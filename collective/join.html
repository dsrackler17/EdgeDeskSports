<!doctype html>
<!--
  Model Collective invite onboarding.
  Friction budget accounting (hard spec): 3 screens, required fields across the
  whole flow = 5 of the budget of 8 (email, display name, sport, model name,
  terms checkbox). Everything else is optional and marked optional.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join the Model Collective</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--surface:#13161c;--surface2:#191d25;--border:#262c36;--text:#e7eaf0;--dim:#8a93a2;--faint:#5b6472;--accent:#4d8dff;--pos:#2fb47c;--neg:#e26044;--warn:#d99a2b;--gold:#e3b84d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 60px}
.wordmark{font-weight:800;font-size:14px;letter-spacing:.06em}
.wordmark .mk{display:inline-block;width:9px;height:14px;background:var(--accent);border-radius:2px;transform:skewX(-12deg);margin-right:7px;vertical-align:-2px}
h1{font-size:20px;margin:18px 0 6px;font-weight:800}
.lede{color:var(--dim);font-size:13.5px;margin:0 0 18px}
.steps{display:flex;gap:8px;margin:22px 0 6px}
.step{flex:1;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding-top:8px;border-top:2px solid var(--border)}
.step.on{color:var(--accent);border-top-color:var(--accent)}
.step.done{color:var(--pos);border-top-color:var(--pos)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:14px}
label{display:block;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px}
label .opt{color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-block;background:var(--accent);border:1px solid var(--accent);color:#0b1220;font-weight:700;font-size:14px;border-radius:9px;padding:11px 18px;cursor:pointer;font-family:inherit;width:100%;margin-top:16px}
.btn.sec{background:var(--surface2);border-color:var(--border);color:var(--text);width:auto;font-weight:600;font-size:12.5px;padding:8px 14px}
.btn[disabled]{opacity:.55;cursor:default}
.note{color:var(--dim);font-size:12px}
.warnnote{color:var(--warn);font-size:12.5px}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid rgba(227,184,77,.5);color:var(--gold);border-radius:10px;padding:2px 8px}
.copyblk{margin:18px 0}
.copyblk .t{font-weight:700;font-size:13.5px;margin-bottom:2px}
.copyblk .s{color:var(--dim);font-size:12px;margin-bottom:7px}
.copybox{display:flex;gap:8px;align-items:stretch}
.copybox .val{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow:auto;white-space:pre;max-height:130px;color:var(--text)}
.copybox .val.tall{max-height:200px;white-space:pre-wrap}
.copybox button{flex:none;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0 14px;font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit}
.copybox button:hover{border-color:var(--faint)}
.ok{color:var(--pos)}
.err{border:1px solid rgba(226,96,68,.4);color:var(--neg);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.terms{display:flex;gap:9px;align-items:flex-start;margin:16px 0 0;font-size:12.5px;color:var(--dim)}
.terms input{width:auto;margin-top:2px}
.footer{color:var(--faint);font-size:11px;margin-top:34px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <span class="wordmark"><span class="mk"></span>MODEL COLLECTIVE</span>
  <div id="app"><div class="panel note">Checking your invite&hellip;</div></div>
  <div class="footer">Independent models, one verified record. Research and information only, not betting advice. 21+. 1-800-GAMBLER.<br><a href="/collective/">About the Collective</a> &middot; <a href="/terms.html">Terms</a></div>
</div>

<script>
"use strict";
window.COLLECTIVE_CONFIG = {
  SB_URL:  "https://iattxbkbufslbauoumga.supabase.co",
  SB_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdHR4YmtidWZzbGJhdW91bWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzY4MDUsImV4cCI6MjA5NzIxMjgwNX0.Mly5G587o5IFRnEigU2wRp9buWEk3dFwH9RNPJK7Uo8",
  BASE_URL: "https://edgedesksports.com",
  API: "https://iattxbkbufslbauoumga.supabase.co/functions/v1"
};
var CFG=window.COLLECTIVE_CONFIG;
function apiOverrideAllowed(u){
  try{
    var url=new URL(String(u||''),location.href);
    if(url.protocol!=='https:'&&url.protocol!=='http:')return false;
    var h=url.hostname.toLowerCase();
    if(h==='localhost'||h==='127.0.0.1'||h==='[::1]')return true;
    if(url.protocol!=='https:')return false;
    return /(^|\.)supabase\.co$/.test(h)||/(^|\.)supabase\.in$/.test(h)||/(^|\.)edgedesksports\.com$/.test(h);
  }catch(e){return false;}
}
function resolveApiBase(){
  var q=null,ls=null;
  try{q=new URLSearchParams(location.search).get('api');}catch(e){}
  if(q&&apiOverrideAllowed(q))return q;
  try{ls=localStorage.getItem('COLLECTIVE_API_OVERRIDE');}catch(e){}
  return ls||CFG.API;
}
/* The session token goes to whatever API base this resolves to, so a URL
   override is honoured only for hosts a Collective deployment can live on.
   See collective/index.html for the full note. */
var API=resolveApiBase();

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
/* Only http(s) goes into an href; a server-supplied URL is still a URL. */
function safeUrl(u){
  var s=String(u==null?'':u).trim();
  if(!s)return '';
  try{var url=new URL(s,'https://invalid.invalid/');
    if(url.protocol!=='https:'&&url.protocol!=='http:')return '';
    if(url.hostname==='invalid.invalid')return '';
    return url.href;}catch(e){return '';}
}
function $(id){return document.getElementById(id);}

/* ---- token recovery: the magic-link redirect must not lose the invite ---- */
var TOKEN=new URLSearchParams(location.search).get('t')||'';
if(TOKEN){try{localStorage.setItem('mc_join_token',TOKEN);}catch(e){}}
else{try{TOKEN=localStorage.getItem('mc_join_token')||'';}catch(e){}}

/* ---- session capture from magic link hash ---- */
function session(){try{return JSON.parse(localStorage.getItem('collective_session')||'null');}catch(e){return null;}}
(function(){
  if(/access_token=/.test(location.hash)){
    var p=new URLSearchParams(location.hash.replace(/^#\/?/,''));
    if(p.get('access_token')){
      try{localStorage.setItem('collective_session',JSON.stringify({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:p.get('expires_at')}));}catch(e){}
      history.replaceState(null,'',location.pathname+location.search);
    }
  }
})();

var STATE={info:null,prefill:{},screen:1};

function steps(n){
  function cls(i){return i<n?'step done':(i===n?'step on':'step');}
  return '<div class="steps"><div class="'+cls(1)+'">1 &middot; Account</div><div class="'+cls(2)+'">2 &middot; Profile</div><div class="'+cls(3)+'">3 &middot; Connect</div></div>';
}
function copyWire(){
  document.querySelectorAll('[data-copy]').forEach(function(b){
    if(b._w)return;b._w=true;
    b.onclick=function(){
      var v=document.getElementById(b.getAttribute('data-copy')).textContent;
      function done(){var o=b.textContent;b.textContent='Copied';setTimeout(function(){b.textContent=o;},1500);}
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fb);else fb();
      function fb(){var ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
    };
  });
}

async function api(path,opts){
  opts=opts||{};
  var h=opts.headers||{};
  if(opts.auth){var s=session();if(s&&s.access_token)h['authorization']='Bearer '+s.access_token;}
  var r=await fetch(API+'/collective_join'+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  var d=null;try{d=await r.json();}catch(e){}
  if(!r.ok&&!(r.status===410&&d&&d.status)){
    var msg=(d&&d.error&&d.error.message)||('Request failed ('+r.status+')');
    var err=new Error(msg);err.status=r.status;err.code=d&&d.error&&d.error.code;throw err;
  }
  return d;
}

function deadToken(kind){
  var head=kind==='expired'?'This invite link has expired'
    :(kind==='revoked'?'This invite was withdrawn':'This invite has already been used');
  var sub=kind==='expired'
    ?'Invite links live for 30 days. Yours has lapsed, which is easy to fix.'
    :(kind==='revoked'
      ?'The person who sent this link revoked it. If you think that was a mistake, request a fresh one below.'
      :'Each invite link works once. If that was you on another device, open your dashboard instead. If not, request a fresh link below.');
  $('app').innerHTML=
    '<h1>'+head+'</h1><p class="lede">'+sub+'</p>'+
    '<div class="panel"><label>Your email</label><input id="rqEmail" type="email" placeholder="you@example.com">'+
    '<label>Anything we should know <span class="opt">optional</span></label><input id="rqNote" placeholder="Who invited you, your model, your site">'+
    '<button class="btn" id="rqBtn">Request a fresh invite</button>'+
    '<p class="note hide" id="rqDone" style="margin-top:10px"></p></div>'+
    '<p class="note" style="margin-top:14px">Already a member? <a href="/collective/#dashboard">Go to your dashboard</a></p>';
  $('rqBtn').onclick=async function(){
    var em=$('rqEmail').value.trim();
    if(!/.+@.+\..+/.test(em)){$('rqEmail').focus();return;}
    this.disabled=true;
    try{
      var r=await api('/v1/join/request',{method:'POST',headers:{'content-type':'application/json'},body:{email:em,note:$('rqNote').value.trim(),token:TOKEN}});
      $('rqDone').textContent=(r&&r.message)||'Request recorded. A fresh link goes out by email.';
      $('rqDone').classList.remove('hide');$('rqDone').classList.add('ok');
    }catch(e){this.disabled=false;$('rqDone').textContent=e.message;$('rqDone').classList.remove('hide');}
  };
}

function badToken(){
  $('app').innerHTML=
    '<h1>This link does not look right</h1>'+
    '<p class="lede">The invite code is missing or truncated. Check that the whole link was copied, or request a fresh one.</p>'+
    '<div class="panel"><label>Your email</label><input id="rqEmail" type="email" placeholder="you@example.com">'+
    '<label>Anything we should know <span class="opt">optional</span></label><input id="rqNote" placeholder="Who invited you, your model, your site">'+
    '<button class="btn" id="rqBtn">Request a working invite</button>'+
    '<p class="note hide" id="rqDone" style="margin-top:10px"></p></div>';
  $('rqBtn').onclick=async function(){
    var em=$('rqEmail').value.trim();
    if(!/.+@.+\..+/.test(em)){$('rqEmail').focus();return;}
    this.disabled=true;
    try{
      var r=await api('/v1/join/request',{method:'POST',headers:{'content-type':'application/json'},body:{email:em,note:$('rqNote').value.trim(),token:TOKEN}});
      $('rqDone').textContent=(r&&r.message)||'Request recorded.';
      $('rqDone').classList.remove('hide');$('rqDone').classList.add('ok');
    }catch(e){this.disabled=false;$('rqDone').textContent=e.message;$('rqDone').classList.remove('hide');}
  };
}

/* WHAT MEMBERSHIP ASKS, ON THE INVITE ITSELF.

   Somebody accepting an invite is agreeing to something, and the thing they
   are agreeing to should be on the screen where they agree to it. A member
   removed for going quiet in the middle of a season should be able to point
   at this page and say they were told — and, more to the point, should have
   been told early enough to not go quiet. Held once here and rendered on
   both the invite screen and the finish screen so the wording cannot drift. */
var PARTICIPATION_MIN=3;
function participationBlock(){
  return '<div class="panel" style="border-color:rgba(217,154,43,.5);margin:14px 0">'+
    '<b style="color:var(--warn)">What membership asks of you</b>'+
    '<p class="note" style="margin:6px 0">Active participation requires at least <b>'+PARTICIPATION_MIN+
    ' eligible model projections per week</b> within your declared sport or scope.</p>'+
    '<p class="note" style="margin:6px 0">Members who repeatedly submit fewer than that, or who miss weeks '+
    'without communication, may be moved to inactive or removed.</p>'+
    '<p class="note" style="margin:6px 0">Personal betting activity does not matter. Submit the '+
    '<b>model\u2019s output</b>, not only the games you choose to bet.</p>'+
    '<p class="note" style="margin:6px 0 0">A quiet week is not just a gap in your own record \u2014 it thins the '+
    'consensus and leaves a hole in the coverage every other member is measured against. Your count for the '+
    'current slate is on your dashboard from day one, so this never arrives as a surprise.</p></div>';
}
function screen1(){
  var f=STATE.info.founding?'<p class="warnnote" style="margin:-8px 0 14px"><span class="chip">&#9733; Founding Member</span> &nbsp;This invite makes you one of the founding members of the Collective. Founding status is permanent.</p>':'';
  $('app').innerHTML=steps(1)+
    '<h1>You are joining the Model Collective</h1>'+
    '<p class="lede">Shared infrastructure for independent sports models. You keep your model, your site, and your customers. The Collective grades your record independently and puts it in front of every member’s audience.</p>'+f+
    participationBlock()+
    '<div class="panel"><label>Email</label><input id="jEmail" type="email" autocomplete="email" placeholder="you@example.com" autofocus>'+
    '<button class="btn" id="jSend">Send my sign-in link</button>'+
    '<p class="note" style="margin:12px 0 0">No password to invent. We email you a one-time link that continues right here.</p>'+
    '<div id="jErr"></div></div>';
  $('jSend').onclick=send;
  $('jEmail').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
  async function send(){
    var em=$('jEmail').value.trim();
    if(!/.+@.+\..+/.test(em)){$('jEmail').focus();return;}
    $('jSend').disabled=true;
    /* the api override rides along only when it passed the same guard the
       page applies on load — otherwise a sign-in link would carry it back */
    var apiQ=new URLSearchParams(location.search).get('api');
    var redirect=location.origin+location.pathname+'?t='+encodeURIComponent(TOKEN)+((apiQ&&apiOverrideAllowed(apiQ))?'&api='+encodeURIComponent(apiQ):'');
    try{
      var r=await fetch(CFG.SB_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),{
        method:'POST',headers:{apikey:CFG.SB_ANON,'content-type':'application/json'},
        body:JSON.stringify({email:em,create_user:true})});
      if(!r.ok){var b='';try{b=(await r.json()).msg||'';}catch(e){}throw new Error(b||('Could not send the link ('+r.status+')'));}
      $('app').innerHTML=steps(1)+
        '<h1>Check your email</h1>'+
        '<p class="lede">A sign-in link is on its way to <b style="color:var(--text)">'+esc(em)+'</b>. Open it on this device and you will land back here on step 2.</p>'+
        '<div class="panel note">Nothing arriving? Check spam, or <a href="#" id="resend">send it again</a>.<span id="cd"></span></div>';
      var cool=60;
      $('resend').onclick=function(ev){ev.preventDefault();if(cool>0)return;screen1();};
      var iv=setInterval(function(){cool--;if(cool<=0){clearInterval(iv);$('cd').textContent='';}else $('cd').textContent=' ('+cool+'s)';},1000);
    }catch(e){
      $('jSend').disabled=false;
      $('jErr').innerHTML='<div class="err">'+esc(e.message)+'</div>';
    }
  }
}

function screen2(){
  var p=STATE.prefill||{};
  var sports=STATE.sports||[{code:'NFL',name:'Football'}];
  var opts=sports.map(function(s){return '<option value="'+esc(s.code)+'"'+((p.sport||sports[0].code)===s.code?' selected':'')+'>'+esc(s.code)+'</option>';}).join('');
  $('app').innerHTML=steps(2)+
    '<h1>Your profile and your model</h1>'+
    '<p class="lede">Three required fields. Everything else can wait, and more models can be added later from your dashboard.</p>'+
    '<div class="panel">'+
    '<label>Display name</label><input id="pName" value="'+esc(p.display_name||'')+'" placeholder="Your public name" autofocus>'+
    '<label>Sport</label><select id="pSport">'+opts+'</select>'+
    '<label>Model name</label><input id="pModel" value="'+esc(p.model_name||'')+'" placeholder="What you call your model">'+
    '<label>Where does your model live? <span class="opt">optional</span></label>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap" id="pSrcRow">'+
      '<button type="button" class="btn" data-src="excel">Excel / CSV</button>'+
      '<button type="button" class="btn" data-src="github">GitHub</button>'+
      '<button type="button" class="btn" data-src="online">Online</button>'+
      '<button type="button" class="btn" data-src="other">Other</button>'+
    '</div><div id="pSrcDetail"></div>'+
    '<label>Description <span class="opt">optional</span></label><input id="pDesc" placeholder="One sentence about your model">'+
    '<label>Website <span class="opt">optional</span></label><input id="pSite" placeholder="https://yoursite.com">'+
    '<p class="note" style="margin:4px 0 0">No site? Your Collective profile becomes your home page.</p>'+
    '<label>X handle <span class="opt">optional</span></label><input id="pX" placeholder="handle, no @">'+
    '<label>Logo URL <span class="opt">optional, we generate a monogram otherwise</span></label><input id="pLogo" placeholder="https://">'+
    '<div class="terms"><input type="checkbox" id="pTerms"><span>I agree to the <a href="/terms.html" target="_blank">Collective terms</a>. Your submissions stay in the historical record if you ever leave. Your model, your site, and your customers stay yours.</span></div>'+
    '<button class="btn" id="pGo">Create my profile</button>'+
    '<div id="pErr"></div></div>';
  var SRC_INFO={
    excel:{note:'Perfect. After joining, your dashboard has a Post a slate panel: upload your .xlsx or .csv and it maps your columns automatically. Nothing to configure now.'},
    github:{label:'Repository URL',ph:'https://github.com/you/model'},
    online:{label:'Model URL or API endpoint',ph:'https://yourmodel.com'},
    other:{label:'Describe where your model lives',ph:'A short description'}
  };
  var pSrc=(p.source_kind&&SRC_INFO[p.source_kind])?p.source_kind:null;
  function paintSrc(){
    document.querySelectorAll('#pSrcRow .btn').forEach(function(b){
      var on=b.getAttribute('data-src')===pSrc;
      b.style.borderColor=on?'var(--accent)':'';b.style.color=on?'var(--text)':'';
    });
    var d2=pSrc?SRC_INFO[pSrc]:null;
    $('pSrcDetail').innerHTML=!d2?'':(d2.label
      ?'<input id="pSrcRef" style="margin-top:8px" placeholder="'+esc(d2.ph||'')+'" value="'+esc(p.source_ref||'')+'">'
      :'<p class="note" style="margin:8px 0 0">'+esc(d2.note)+'</p>');
  }
  document.querySelectorAll('#pSrcRow .btn').forEach(function(b){
    b.onclick=function(){pSrc=(pSrc===b.getAttribute('data-src'))?null:b.getAttribute('data-src');paintSrc();};
  });
  paintSrc();
  $('pGo').onclick=async function(){
    var name=$('pName').value.trim(),sport=$('pSport').value,model=$('pModel').value.trim();
    var errs=[];
    if(name.length<2)errs.push('Display name needs at least 2 characters.');
    if(model.length<2)errs.push('Model name needs at least 2 characters.');
    if(!$('pTerms').checked)errs.push('The terms checkbox is required.');
    var site=$('pSite').value.trim(),logo=$('pLogo').value.trim();
    if(site&&!/^https?:\/\//.test(site))site='https://'+site;
    if(logo&&!/^https?:\/\//.test(logo))errs.push('Logo URL must start with https://');
    if(errs.length){$('pErr').innerHTML='<div class="err">'+errs.map(esc).join('<br>')+'</div>';return;}
    this.disabled=true;this.textContent='Creating your profile…';
    try{
      var r=await api('/v1/join/'+encodeURIComponent(TOKEN)+'/redeem',{method:'POST',auth:true,headers:{'content-type':'application/json'},body:{
        display_name:name,sport:sport,model_name:model,
        description:$('pDesc').value.trim()||null,website_url:site||null,
        x_handle:$('pX').value.trim().replace(/^@/,'')||null,logo_url:logo||null,
        source_kind:pSrc||null,source_ref:(pSrc&&$('pSrcRef'))?$('pSrcRef').value.trim()||null:null,
        accept_terms:true}});
      STATE.redeem=r;screen3();
    }catch(e){
      this.disabled=false;this.textContent='Create my profile';
      if(e.status===401){
        try{localStorage.removeItem('collective_session');}catch(_){}
        $('pErr').innerHTML='<div class="err">Your sign-in link expired. It takes 20 seconds to get a new one.</div>'+
          '<button class="btn" id="pBack" style="margin-top:10px">Send me a new sign-in link</button>';
        document.getElementById('pBack').onclick=function(){screen1();};
      }
      else $('pErr').innerHTML='<div class="err">'+esc(e.message)+'</div>';
    }
  };
}

function screen3(){
  var r=STATE.redeem;
  var keyBlock=r.api_key&&r.api_key.key
    ?'<div class="copyblk"><div class="t">1 &middot; Your API key</div><div class="s">Treat this key like a password. It is shown once. You can rotate it any time from your dashboard.</div>'+
      '<div class="copybox"><div class="val" id="cKey">'+esc(r.api_key.key)+'</div><button data-copy="cKey">Copy</button></div></div>'
    :'<div class="copyblk"><div class="t">1 &middot; Your API key</div><div class="s">Already issued on a previous visit. Rotate it from your dashboard if you no longer have it.</div></div>';
  $('app').innerHTML=steps(3)+
    '<h1>You are in'+(r.founding?' <span class="chip">Founding member</span>':'')+'</h1>'+
    '<p class="lede"><a href="'+esc(safeUrl(r.creator&&r.creator.profile_url)||'/collective/')+'">Your profile is live right now →</a><br>Three things to copy, then your model connects itself.</p>'+
    '<div class="panel">'+keyBlock+
    '<div class="copyblk"><div class="t">2 &middot; The Claude prompt</div><div class="s">Copy the whole prompt, paste it into Claude Code in your project, and it wires your model to the Collective without touching your logic.</div>'+
      '<div class="copybox"><div class="val tall" id="cPrompt">'+esc(r.prompt)+'</div><button data-copy="cPrompt">Copy</button></div></div>'+
    '<div class="copyblk"><div class="t">3 &middot; Your Collective tab</div><div class="s">Paste this where you want the Collective to render on your site.</div>'+
      '<div class="copybox"><div class="val" id="cEmbed">'+esc(r.embed_snippet)+'</div><button data-copy="cEmbed">Copy</button></div></div>'+
    '<p class="note" style="margin:6px 0 0">What happens next: your first live submission flips your profile to Active Contributor automatically. Payout details are only asked for after your first successful submission, from your <a href="'+esc(safeUrl(r.dashboard_url)||'/collective/#dashboard')+'">dashboard</a>.</p>'+
    '</div>'+
    participationBlock()+
    '<p class="note">Your count for the current slate is on your <a href="'+esc(safeUrl(r.dashboard_url)||'/collective/#dashboard')+'">dashboard</a>, '+
    'updated as you post. If something comes up and you are going to be short, say so before the week ends rather '+
    'than after.</p>';
  copyWire();
  try{localStorage.removeItem('mc_join_token');}catch(e){}
}

(async function boot(){
  if(!TOKEN||!/^mci_[A-Za-z0-9]{8,}$/.test(TOKEN)){badToken();return;}
  try{
    var info=await api('/v1/join/'+encodeURIComponent(TOKEN));
    if(!info||!info.status){badToken();return;}
    if(info.status==='revoked'){deadToken('revoked');return;}
    if(info.status==='expired'){deadToken('expired');return;}
    if(info.status==='spent'&&!session()){deadToken('spent');return;}
    STATE.info=info;STATE.prefill=info.prefill||{};
    try{
      var mr=await fetch(API+'/collective_public/v1/meta');var m=await mr.json();
      STATE.sports=(m&&m.sports&&m.sports.length)?m.sports:null;
    }catch(e){}
    if(session())screen2();else screen1();
  }catch(e){
    if(e.status===404){badToken();return;}
    $('app').innerHTML='<div class="panel"><b>The Collective could not check this invite.</b><br><span class="note">'+esc(e.message)+' Refresh in a moment.</span></div>';
  }
})();
</script>
