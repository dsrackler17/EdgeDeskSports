<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collective Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--surface:#13161c;--surface2:#191d25;--border:#262c36;--text:#e7eaf0;--dim:#8a93a2;--faint:#5b6472;--accent:#4d8dff;--pos:#2fb47c;--neg:#e26044;--warn:#d99a2b;--gold:#e3b84d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}
.hd{position:sticky;top:0;z-index:10;background:rgba(13,15,19,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.hd-in{display:flex;align-items:center;gap:12px;padding:12px 14px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.wordmark{font-weight:800;font-size:14px;letter-spacing:.06em}
.wordmark .mk{display:inline-block;width:9px;height:14px;background:var(--warn);border-radius:2px;transform:skewX(-12deg);margin-right:7px;vertical-align:-2px}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{color:var(--dim);font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;cursor:pointer}
nav a.on{color:var(--text);background:var(--surface2)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:18px;margin:6px 0 4px}
h2{font-size:14px;margin:22px 0 8px}
.lede{color:var(--dim);font-size:13px;margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;width:100%}
textarea{font-family:'JetBrains Mono',monospace;font-size:12px;min-height:110px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:12.5px;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:700}
.btn[disabled]{opacity:.5;cursor:default}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:8px}
table{border-collapse:collapse;width:100%;min-width:680px}
th{background:var(--surface2);color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:8px 9px;border-top:1px solid var(--border);font-size:12.5px;white-space:nowrap;vertical-align:middle}
td input{width:70px;padding:5px 7px;font-family:'JetBrains Mono',monospace;font-size:12px}
.chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border);border-radius:10px;padding:2px 7px;color:var(--dim)}
.chip.ok{color:var(--pos);border-color:rgba(47,180,124,.45)}
.chip.warn{color:var(--warn);border-color:rgba(217,154,43,.45)}
.chip.dead{color:var(--faint);border-style:dashed}
.note{color:var(--dim);font-size:12px}
.warnnote{color:var(--warn);font-size:12.5px}
.err{border:1px solid rgba(226,96,68,.4);color:var(--neg);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.copybox{display:flex;gap:8px;margin:10px 0}
.copybox .val{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow-x:auto;white-space:pre}
.raw{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;white-space:pre-wrap;max-height:160px;overflow:auto;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:12.5px;z-index:50}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <span class="wordmark"><span class="mk"></span>COLLECTIVE ADMIN</span>
  <span class="note">founder console</span>
  <span style="flex:1"></span>
  <nav id="nav" class="hide">
    <a data-s="overview" class="on">Overview</a><a data-s="invites">Invites</a><a data-s="members">Members</a>
    <a data-s="quarantine">Quarantine</a><a data-s="games">Games</a><a data-s="results">Results</a><a data-s="odds">Odds</a><a data-s="earnings">Earnings</a>
  </nav>
</div></header>
<div class="wrap"><div id="app"><div class="panel note">Loading&hellip;</div></div></div>

<script src="odds.js"></script>
<script>
"use strict";
window.COLLECTIVE_CONFIG = {
  SB_URL:  "https://iattxbkbufslbauoumga.supabase.co",
  SB_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdHR4YmtidWZzbGJhdW91bWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzY4MDUsImV4cCI6MjA5NzIxMjgwNX0.Mly5G587o5IFRnEigU2wRp9buWEk3dFwH9RNPJK7Uo8",
  BASE_URL: "https://edgedesksports.com",
  API: "https://iattxbkbufslbauoumga.supabase.co/functions/v1"
};
var CFG=window.COLLECTIVE_CONFIG;
var API=(new URLSearchParams(location.search).get('api'))||localStorage.getItem('COLLECTIVE_API_OVERRIDE')||CFG.API;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2000);}
function rel(iso){if(!iso)return 'never';var s=(Date.now()-new Date(iso).getTime())/1e3;if(s<5400)return Math.max(1,Math.round(s/60))+'m ago';if(s<172800)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function cents(c){return c==null?'-':'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function copyWire(scope){(scope||document).querySelectorAll('[data-copy]').forEach(function(b){if(b._w)return;b._w=true;b.onclick=function(){var v=$(b.getAttribute('data-copy')).textContent;if(navigator.clipboard)navigator.clipboard.writeText(v).then(function(){toast('Copied');});};});}

var SPORTS=null;
async function sports(){
  if(SPORTS)return SPORTS;
  try{
    var m=await api('/v1/meta',{fn:'collective_public'});
    SPORTS=(m&&m.sports&&m.sports.length)?m.sports:[{code:'NFL',season:new Date().getFullYear()}];
  }catch(e){SPORTS=[{code:'NFL',season:new Date().getFullYear()}];}
  return SPORTS;
}
function sportOpts(list,sel){
  return list.map(function(s){return '<option value="'+esc(s.code)+'"'+(sel===s.code?' selected':'')+'>'+esc(s.code)+(s.name?' ('+esc(s.name)+')':'')+'</option>';}).join('');
}
function seasonFor(list,code){var s=list.filter(function(x){return x.code===code;})[0];return (s&&s.season)||new Date().getFullYear();}
function session(){try{return JSON.parse(localStorage.getItem('collective_admin_session')||'null');}catch(e){return null;}}
(function(){
  if(/access_token=/.test(location.hash)){
    var p=new URLSearchParams(location.hash.replace(/^#\/?/,''));
    if(p.get('access_token')){
      try{localStorage.setItem('collective_admin_session',JSON.stringify({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:p.get('expires_at')}));}catch(e){}
      history.replaceState(null,'',location.pathname+location.search);
    }
  }
})();
async function api(path,opts){
  opts=opts||{};
  var h=opts.headers||{};
  var s=session();if(s&&s.access_token)h['authorization']='Bearer '+s.access_token;
  var fn=opts.fn||'collective_admin';
  var r=await fetch(API+'/'+fn+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  var d=null;try{d=await r.json();}catch(e){}
  if(!r.ok){var e2=new Error((d&&d.error&&d.error.message)||('Request failed ('+r.status+')'));e2.status=r.status;throw e2;}
  return d;
}

var SEC='overview';
var IV_PREFILL=null;
function pct(bps){return (bps/100)%1===0?(bps/100)+'%':(bps/100).toFixed(1)+'%';}
function linkCache(){try{return JSON.parse(localStorage.getItem('mc_admin_links')||'{}');}catch(e){return {};}}
function cacheLink(id,url){try{var c=linkCache();c[id]=url;localStorage.setItem('mc_admin_links',JSON.stringify(c));}catch(e){}}
function nav(){
  $('nav').classList.remove('hide');
  document.querySelectorAll('#nav a').forEach(function(a){
    a.classList.toggle('on',a.getAttribute('data-s')===SEC);
    a.onclick=function(){SEC=a.getAttribute('data-s');nav();render();};
  });
}

function signin(){
  $('app').innerHTML='<h1>Sign in</h1><p class="lede">Admin access is by account allowlist. Sign in with your email and a one-time link.</p>'+
    '<div class="panel" style="max-width:420px"><label>Email</label><input id="aEmail" type="email" placeholder="you@example.com">'+
    '<div style="margin-top:12px"><button class="btn primary" id="aSend">Send my sign-in link</button></div>'+
    '<p class="note hide" id="aSent" style="margin-top:10px"></p></div>';
  $('aSend').onclick=async function(){
    var em=$('aEmail').value.trim();if(!/.+@.+\..+/.test(em))return;
    this.disabled=true;
    var redirect=location.origin+location.pathname+(location.search||'');
    try{
      var r=await fetch(CFG.SB_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{apikey:CFG.SB_ANON,'content-type':'application/json'},body:JSON.stringify({email:em,create_user:true})});
      if(!r.ok)throw new Error('Could not send the link ('+r.status+')');
      $('aSent').textContent='Link sent to '+em+'. Open it on this device.';$('aSent').classList.remove('hide');
    }catch(e){toast(e.message);this.disabled=false;}
  };
}
function notAdmin(uidMsg){
  $('app').innerHTML='<div class="panel"><b>This account is not on the admin list.</b><br><span class="note">'+esc(uidMsg||'')+' Add the user id to collective.config key admin.user_ids, then reload.</span><br><br><button class="btn" onclick="localStorage.removeItem(\'collective_admin_session\');location.reload()">Sign out</button></div>';
}

async function render(){
  if(!session()){signin();return;}
  nav();
  var app=$('app');
  app.innerHTML='<div class="panel note">Loading '+esc(SEC)+'&hellip;</div>';
  try{
    if(SEC==='overview')await secOverview(app);
    else if(SEC==='invites')await secInvites(app);
    else if(SEC==='members')await secMembers(app);
    else if(SEC==='quarantine')await secQuarantine(app);
    else if(SEC==='games')await secGames(app);
    else if(SEC==='results')await secResults(app);
    else if(SEC==='odds')await secOdds(app);
    else if(SEC==='earnings')await secEarnings(app);
  }catch(e){
    if(e.status===401){localStorage.removeItem('collective_admin_session');signin();return;}
    if(e.status===403){notAdmin();return;}
    app.innerHTML='<div class="err">'+esc(e.message)+'</div>';
  }
}

async function secOverview(app){
  var d=await api('/v1/admin/overview');
  var c=d.collective,e=d.economics,o=d.onboarding,t=d.today;
  function kv(items){return '<div style="display:flex;gap:26px;flex-wrap:wrap">'+items.map(function(x){
    return '<span><div style="color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em">'+x[0]+'</div><div class="mono" style="font-size:16px;font-weight:700;margin-top:2px'+(x[2]?';color:'+x[2]:'')+'">'+x[1]+'</div></span>';
  }).join('')+'</div>';}
  app.innerHTML='<h1>Overview</h1><p class="lede">The Collective at a glance. Every number is computed from real rows and the configured economics.</p>'+
    '<h2>Collective</h2><div class="panel">'+kv([
      ['Founding members',c.founding_members],
      ['Creators',c.creators],
      ['Subscribers',c.subscribers],
      ['MRR',cents(c.mrr_cents)]])+
    (c.billing_live?'':'<p class="note" style="margin:10px 0 0">Billing is not live yet: subscriber and revenue numbers stay at zero until it opens.</p>')+'</div>'+
    '<h2>Creator onboarding</h2><div class="panel">'+kv([
      ['Invites pending',o.invites_pending],
      ['Invites redeemed',o.invites_redeemed]])+
    '<p class="note" style="margin:10px 0 0"><a href="#" data-go="invites">Invite a creator &rarr;</a></p></div>'+
    '<h2>Today</h2><div class="panel">'+kv([
      ['Models submitted',t.models_submitted],
      ['Missing today',t.models_missing,t.models_missing>0?'var(--warn)':null],
      ['Quarantined rows',t.quarantined_rows,t.quarantined_rows>0?'var(--warn)':null]])+
    (t.quarantined_rows>0?'<p class="note" style="margin:10px 0 0"><a href="#" data-go="quarantine">Resolve quarantine &rarr;</a></p>':'')+'</div>'+
    '<h2>Earnings</h2><div class="panel">'+kv([
      ['Operating reserve ('+pct(e.reserve_bps)+')',cents(e.reserve_cents)],
      ['Platform ('+pct(e.platform_bps)+')',cents(e.platform_cents)],
      ['Founder pool ('+pct(e.founder_pool_bps)+')',cents(e.pool_cents)],
      ['Per founding member',cents(e.per_founder_cents)]])+
    '<p class="note" style="margin:10px 0 0"><a href="#" data-go="earnings">Full breakdown &rarr;</a></p></div>';
  app.querySelectorAll('[data-go]').forEach(function(a){
    a.onclick=function(ev){ev.preventDefault();SEC=a.getAttribute('data-go');nav();render();};
  });
}

var SRC_LABEL={excel:'Excel / CSV',github:'GitHub',online:'Online',other:'Other'};
var SRC_DETAIL={
  excel:{label:'',note:'Nothing to configure: they upload their spreadsheet straight from their dashboard after joining.'},
  github:{label:'Repository URL',ph:'https://github.com/them/model'},
  online:{label:'Model URL or API endpoint',ph:'https://theirmodel.com'},
  other:{label:'Describe the source',ph:'Where the model lives'}
};

async function secInvites(app){
  var list=await api('/v1/admin/invites');
  var links=linkCache();
  var rows=(list.rows||[]).map(function(r){
    var st={sent:'<span class="chip ok">Sent</span>',redeemed:'<span class="chip ok">Active</span>',
            expired:'<span class="chip dead">Expired</span>',revoked:'<span class="chip dead">Revoked</span>'}[r.status]||esc(r.status);
    var acts=[];
    if(links[r.id]&&r.status==='sent'){
      acts.push('<a href="#" data-act="copy" data-id="'+esc(r.id)+'">Copy</a>');
      acts.push('<a href="'+esc(links[r.id])+'" target="_blank" rel="noopener">Open</a>');
    }
    if(r.status==='sent')acts.push('<a href="#" data-act="revoke" data-id="'+esc(r.id)+'" style="color:var(--neg)">Revoke</a>');
    acts.push('<a href="#" data-act="resend" data-id="'+esc(r.id)+'">Resend</a>');
    return '<tr data-row="'+esc(r.id)+'"><td><b>'+esc(r.display_name||r.note||'(no name)')+'</b>'+(r.email?'<br><span class="note">'+esc(r.email)+'</span>':'')+'</td>'+
      '<td>'+esc(r.model_name||'')+'</td>'+
      '<td>'+(r.founding?'<span class="chip warn">&#9733; Founding</span>':'<span class="chip">Creator</span>')+'</td>'+
      '<td>'+st+'</td>'+
      '<td class="note">'+new Date(r.created_at).toLocaleDateString()+'</td>'+
      '<td class="note">'+new Date(r.expires_at).toLocaleDateString()+'</td>'+
      '<td style="display:flex;gap:10px">'+acts.join('')+'</td></tr>';
  }).join('');
  var pf=IV_PREFILL||{};IV_PREFILL=null;
  app.innerHTML='<h1>Invite a Creator</h1><p class="lede">One action mints the whole onboarding package: link, profile shell, model, source, founding status, key, prompt, and embed. You send the link; the creator does the rest in about a minute.</p>'+
    '<div class="panel"><div class="grid2">'+
    '<div><label>Name</label><input id="ivName" placeholder="Their public name" value="'+esc(pf.display_name||'')+'"></div>'+
    '<div><label>Email <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="ivEmail" placeholder="them@example.com" value="'+esc(pf.email||'')+'"></div>'+
    '<div><label>Model name <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="ivModel" placeholder="They can name it during onboarding" value="'+esc(pf.model_name||'')+'"></div>'+
    '</div>'+
    '<label>Where does their model live? <span style="text-transform:none;letter-spacing:0">(optional)</span></label>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap" id="ivSrcRow">'+
      ['excel','github','online','other'].map(function(k){return '<button class="btn" data-src="'+k+'">'+SRC_LABEL[k]+'</button>';}).join('')+
    '</div><div id="ivSrcDetail"></div>'+
    '<label>Founding member?</label>'+
    '<div style="display:flex;gap:8px" id="ivFoundRow">'+
      '<button class="btn" data-f="1">&#9733; Founding Member</button><button class="btn" data-f="0">Creator</button>'+
    '</div>'+
    '<div style="margin-top:14px"><button class="btn primary" id="ivGo">Mint Invite</button></div><div id="ivOut"></div></div>'+
    '<h2>All invites</h2><div class="tblwrap"><table><thead><tr><th>Creator</th><th>Model</th><th>Type</th><th>Status</th><th>Created</th><th>Expires</th><th>Actions</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="note" style="text-align:center;padding:14px">No invites yet. Mint the first one above.</td></tr>')+'</tbody></table></div>'+
    '<p class="note">Copy and Open work on this device for links minted here; invite codes are stored hashed, so a link cannot be recovered later. Resend prefills the form so a fresh link is one click.</p>';

  var ivSrc=pf.source_kind||null,ivFound=(pf.founding===true)?'1':'0';
  function paintSrc(){
    document.querySelectorAll('#ivSrcRow .btn').forEach(function(b){
      b.style.borderColor=b.getAttribute('data-src')===ivSrc?'var(--accent)':'';
      b.style.color=b.getAttribute('data-src')===ivSrc?'var(--text)':'';
    });
    var d2=ivSrc?SRC_DETAIL[ivSrc]:null;
    $('ivSrcDetail').innerHTML=!d2?'':(d2.label
      ?'<label>'+esc(d2.label)+'</label><input id="ivSrcRef" placeholder="'+esc(d2.ph||'')+'" value="'+esc(pf.source_ref||'')+'">'
      :'<p class="note" style="margin:8px 0 0">'+esc(d2.note)+'</p>');
  }
  function paintFound(){
    document.querySelectorAll('#ivFoundRow .btn').forEach(function(b){
      var on=b.getAttribute('data-f')===ivFound;
      b.style.borderColor=on?(ivFound==='1'?'var(--gold)':'var(--accent)'):'';
      b.style.color=on?'var(--text)':'';
    });
  }
  document.querySelectorAll('#ivSrcRow .btn').forEach(function(b){
    b.onclick=function(){ivSrc=(ivSrc===b.getAttribute('data-src'))?null:b.getAttribute('data-src');paintSrc();};
  });
  document.querySelectorAll('#ivFoundRow .btn').forEach(function(b){
    b.onclick=function(){ivFound=b.getAttribute('data-f');paintFound();};
  });
  paintSrc();paintFound();

  $('ivGo').onclick=async function(){
    var name=$('ivName').value.trim();
    if(name.length<2){toast('A name is required to mint an invite');$('ivName').focus();return;}
    this.disabled=true;
    try{
      var body={display_name:name,email:$('ivEmail').value.trim(),model_name:$('ivModel').value.trim(),founding:ivFound==='1'};
      if(ivSrc){body.source_kind=ivSrc;if($('ivSrcRef'))body.source_ref=$('ivSrcRef').value.trim();}
      var r=await api('/v1/admin/invites',{method:'POST',headers:{'content-type':'application/json'},body:body});
      if(r.invite_id)cacheLink(r.invite_id,r.invite_url);
      window._ivMsg=r.message;
      $('ivOut').innerHTML='<div class="panel" style="margin:14px 0 0;border-color:rgba(47,180,124,.5)">'+
        '<h2 style="margin:0 0 4px">Invite Ready</h2>'+
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 2px">'+
          '<b>'+esc(r.invite.display_name||name)+'</b>'+
          (r.invite.model_name?'<span class="note">'+esc(r.invite.model_name)+'</span>':'')+
          (r.invite.founding?'<span class="chip warn">&#9733; Founding Member</span>':'<span class="chip">Creator</span>')+
          (r.invite.source_kind?'<span class="chip">'+esc(SRC_LABEL[r.invite.source_kind]||r.invite.source_kind)+'</span>':'')+
        '</div>'+
        '<div class="copybox"><div class="val" id="ivUrl">'+esc(r.invite_url)+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn primary" data-copy="ivUrl">Copy Invite Link</button>'+
          '<button class="btn" id="ivMsgBtn">Copy Message</button>'+
          '<a class="btn" href="'+esc(r.invite_url)+'" target="_blank" rel="noopener">Open Invite</a>'+
        '</div>'+
        '<p class="note" style="margin:10px 0 0">Send the link however you already talk to them. It works once and expires in 30 days. When they finish onboarding they appear under Members automatically.</p></div>';

/* Slate parsing is deliberately forgiving: a schedule arrives as a file, a
   paste from a text editor, or a paste out of Excel (which yields tabs, not
   commas). Commas, tabs, and semicolons all separate; quotes, header rows,
   and extra trailing columns are ignored. */
function parseSlate(text){
  var t=String(text||'').trim();
  var rows=[],problems=[],seen=0;
  if(t.charAt(0)==='['){
    JSON.parse(t).forEach(function(o,i){
      seen++;
      var wk=parseInt(o.week,10),ko=String(o.kickoff||'').trim();
      if(!isFinite(wk)||!ko||!o.home||!o.away){problems.push('Entry '+(i+1)+': needs week, kickoff, home, away.');return;}
      rows.push({week:wk,kickoff:ko,home:String(o.home).trim(),away:String(o.away).trim()});
    });
    return {rows:rows,problems:problems,seen:seen};
  }
  t.split(/\r?\n/).forEach(function(line,i){
    if(!line.trim())return;
    seen++;
    var p=line.split(/[,\t;]/).map(function(x){return x.trim().replace(/^"(.*)"$/,'$1').trim();})
              .filter(function(x,idx,arr){return idx<arr.length-1||x!=='';});
    if(p.length<4){problems.push('Line '+(i+1)+': found '+p.length+' column'+(p.length===1?'':'s')+', need 4.');return;}
    var wk=parseInt(p[0],10);
    /* a header row ("week, kickoff, home, away") is skipped, not an error */
    if(!isFinite(wk)){if(i===0||/week/i.test(p[0]))return;problems.push('Line '+(i+1)+': "'+p[0]+'" is not a week number.');return;}
    if(isNaN(new Date(p[1]).getTime())){problems.push('Line '+(i+1)+': "'+p[1]+'" is not a readable kickoff time.');return;}
    if(!p[2]||!p[3]){problems.push('Line '+(i+1)+': home and away are both required.');return;}
    rows.push({week:wk,kickoff:p[1],home:p[2],away:p[3]});
  });
  return {rows:rows,problems:problems,seen:seen};
}

var RES_SPORT=null,RES_SEASON=null,RES_TOKEN=0;
async function secResults(app){
  var SP=await sports();
  if(!RES_SPORT){RES_SPORT=SP[0].code;RES_SEASON=seasonFor(SP,RES_SPORT);}
  var d=await api('/v1/games?sport='+encodeURIComponent(RES_SPORT)+'&season='+encodeURIComponent(RES_SEASON),{fn:'collective_public'});
  var need=(d.games||[]).filter(function(g){return !g.result&&new Date(g.kickoff_at).getTime()<Date.now();});
  var rows=need.map(function(g,i){
    return '<tr><td><b>'+esc(g.label)+'</b><br><span class="note">'+new Date(g.kickoff_at).toLocaleString()+'</span></td>'+
      '<td><input id="rH'+i+'" placeholder="home"></td><td><input id="rA'+i+'" placeholder="away"></td>'+
      '<td><input id="rS'+i+'" placeholder="-2.5"></td><td><input id="rT'+i+'" placeholder="47.5"></td><td><input id="rM'+i+'" placeholder="0.62"></td>'+
      '<td id="rC'+i+'" data-g="'+esc(g.game_id)+'"><span class="note">checking&hellip;</span></td>'+
      '<td><button class="btn" data-i="'+i+'" data-g="'+esc(g.game_id)+'">Settle</button></td></tr>';
  }).join('');
  app.innerHTML='<h1>Results</h1><p class="lede">Final scores plus the closing line (home convention, negative means home favored). Settling a game grades every candidate projection on it immediately. The closing line here is the only line any pick is ever graded against.</p>'+
    '<p class="note" style="margin:-6px 0 10px">Where the Collective captured its own closing line from the odds feed, it is offered in the last column. It appears only after the market actually closed, and it is a prefill: the number you settle with is still the one in the box.</p>'+
    '<div class="grid2" style="margin-bottom:10px"><div><label>Sport</label><select id="rSport">'+sportOpts(SP,RES_SPORT)+'</select></div>'+
    '<div><label>Season</label><input id="rSeason" type="number" value="'+esc(RES_SEASON)+'"></div></div>'+
    '<div class="tblwrap"><table><thead><tr><th>Game</th><th>Home pts</th><th>Away pts</th><th>Close spread</th><th>Close total</th><th>Close home ML prob</th><th>Captured close</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="8" class="note" style="text-align:center;padding:14px">No unsettled past games for '+esc(RES_SPORT)+' '+esc(RES_SEASON)+'. Load the slate under Games first.</td></tr>')+'</tbody></table></div>';
  $('rSport').onchange=function(){RES_SPORT=this.value;RES_SEASON=seasonFor(SP,RES_SPORT);render();};
  $('rSeason').onchange=function(){RES_SEASON=+this.value||RES_SEASON;render();};

  /* The closing line the Collective captured itself, offered as a prefill.
     It is only ever offered once the market has actually closed, and the
     admin can still overwrite it: this replaces recall, not judgement. */
  if(window.MCOdds&&need.length){
    MCOdds.configure({api:API});
    /* Each lookup is async and the table can be re-rendered while they are in
       flight, so every callback checks it is still writing into the row it
       was launched for. Without the stamp, a slow response from the previous
       render lands on whatever game now occupies index i and offers one
       game's closing line as another's. */
    var stamp = (RES_TOKEN = (RES_TOKEN || 0) + 1);
    need.slice(0,30).forEach(function(g,i){
      var gameId=g.game_id;
      MCOdds.closingForGame(gameId).then(function(cl){
        if(stamp!==RES_TOKEN)return;
        var cell=$('rC'+i);
        if(!cell||cell.getAttribute('data-g')!==gameId)return;
        if(!cl||!cl.available){
          var why={no_linked_odds_event:'no odds event linked to this game',
                   market_not_closed:'market has not closed yet',
                   no_pregame_capture:'no price was captured before kickoff'}[cl&&cl.reason]||'not available';
          cell.innerHTML='<span class="note">'+esc(why)+'</span>';
          return;
        }
        /* The median of an even number of books lands on a quarter point:
           the median of -6.0 and -6.5 is -6.25. Rounding that to one decimal
           printed -6.3, which is neither what was captured nor a number any
           book offered — and this value grades every model on the game. */
        var num2=function(v){return String(Math.round(Number(v)*100)/100);};
        cell.innerHTML='<button class="btn" data-fill="'+i+'">Use captured close</button>'+
          '<div class="note" style="margin-top:3px">'+
          (cl.closing_spread!=null?'spread '+esc(num2(cl.closing_spread)):'')+
          (cl.closing_total!=null?' &middot; total '+esc(num2(cl.closing_total)):'')+
          (cl.books?' &middot; '+esc(cl.books)+' books':'')+'</div>';
        cell.querySelector('button').onclick=function(){
          if(cl.closing_spread!=null)$('rS'+i).value=num2(cl.closing_spread);
          if(cl.closing_total!=null)$('rT'+i).value=num2(cl.closing_total);
          if(cl.closing_home_ml_prob!=null)$('rM'+i).value=Number(cl.closing_home_ml_prob).toFixed(4);
          toast('Filled from the captured close');
        };
      }).catch(function(){});
    });
  }
  app.querySelectorAll('button[data-g]').forEach(function(b){
    b.onclick=async function(){
      var i=b.getAttribute('data-i');
      var body={results:[{game_id:b.getAttribute('data-g'),home_score:+$('rH'+i).value,away_score:+$('rA'+i).value,
        closing_spread:$('rS'+i).value===''?null:+$('rS'+i).value,closing_total:$('rT'+i).value===''?null:+$('rT'+i).value,
        closing_home_ml_prob:$('rM'+i).value===''?null:+$('rM'+i).value}]};
      if(isNaN(body.results[0].home_score)||isNaN(body.results[0].away_score)){toast('Scores required');return;}
      b.disabled=true;
      try{var r=await api('/v1/admin/results',{method:'POST',headers:{'content-type':'application/json'},body:body});toast('Settled. Graded '+(r.graded||0)+' projections.');render();}
      catch(e){toast(e.message);b.disabled=false;}
    };
  });
}

/* ================= odds =================
   Operating the feed: is it current, what did the last run do, and the two
   buttons that make a change. The provider credential is never here: these
   are calls to our own functions, which hold the key server side. */
async function secOdds(app){
  app.innerHTML='<h1>Odds feed</h1><p class="lede">The Collective&#39;s own NFL market feed. One ingestion path fills it; every surface on the site reads it. Nothing on this page holds or sees the provider credential.</p><div class="panel note">Loading feed status&hellip;</div>';
  var st=null,ing=null;
  try{
    st=await api('/v1/nfl/status',{fn:'collective_odds'});
  }catch(e){ st={error:e.message}; }
  try{
    ing=await api('/v1/status',{fn:'collective_odds_ingest'});
  }catch(e){ ing={error:e.message}; }

  var run=(ing&&ing.last_run)||(st&&st.last_run)||null;
  var fresh=window.MCOdds?MCOdds.freshChip(st||{},st&&st.last_odds_at):'';
  var cad=(ing&&ing.cadence)||null;
  var prov=(ing&&ing.provider)||null;

  var health='<div class="panel"><div style="display:flex;gap:26px;flex-wrap:wrap">'+
    '<div><div class="note">Feed</div><div>'+fresh+'</div></div>'+
    '<div><div class="note">Provider</div><div>'+esc(prov?prov.name:'unknown')+
      (prov?(prov.configured
        ?' <span style="color:var(--pos)">credential present</span>'
        :' <span style="color:var(--neg)">NFL_ODDS_API_KEY not set</span>'):'')+'</div></div>'+
    '<div><div class="note">Upcoming games</div><div>'+esc(st&&st.events_upcoming!=null?st.events_upcoming:'-')+'</div></div>'+
    '<div><div class="note">Live now</div><div>'+esc(st&&st.events_live!=null?st.events_live:'-')+'</div></div>'+
    '<div><div class="note">Books current</div><div>'+esc(st&&st.books_current!=null?st.books_current:'-')+'</div></div>'+
    '<div><div class="note">Stored prices</div><div>'+esc(st&&st.snapshots_total!=null?st.snapshots_total:'-')+'</div></div>'+
    (cad?'<div><div class="note">Polling</div><div>every '+esc(cad.interval_seconds)+'s <span class="note">('+esc(cad.reason)+')</span></div></div>':'')+
    '</div>'+
    ((st&&st.error)||(ing&&ing.error)
      ? '<div class="err" style="margin-top:10px">'+esc((st&&st.error)||(ing&&ing.error))+'</div>':'')+
    '</div>';

  var lastRun=run
    ? '<h2 style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:18px">Last run</h2>'+
      '<div class="panel"><div style="display:flex;gap:22px;flex-wrap:wrap">'+
      '<div><div class="note">Status</div><div>'+esc(run.status||'-')+'</div></div>'+
      '<div><div class="note">Started</div><div>'+esc(run.started_at?rel(run.started_at):'-')+'</div></div>'+
      '<div><div class="note">Books</div><div>'+esc(run.books_ok||0)+' ok, '+esc(run.books_failed||0)+' failed</div></div>'+
      '<div><div class="note">Games</div><div>'+esc(run.events_seen||0)+' seen, '+esc(run.events_created||0)+' new</div></div>'+
      '<div><div class="note">Prices</div><div>'+esc(run.snapshots_written||0)+' written, '+esc(run.snapshots_unchanged||0)+' unchanged</div></div>'+
      '<div><div class="note">Rejected rows</div><div>'+esc(run.rows_rejected||0)+'</div></div>'+
      '</div>'+
      (run.error_message?'<div class="err" style="margin-top:10px">'+esc(run.error_code||'error')+': '+esc(run.error_message)+'</div>':'')+
      '<p class="note" style="margin:10px 0 0">Unchanged prices are not stored. A run that writes nothing usually means the market did not move, not that the run failed.</p>'+
      '</div>'
    : '<div class="panel note" style="margin-top:18px">No ingestion run has been recorded yet.</div>';

  var actions='<h2 style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:18px">Operations</h2>'+
    '<div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn" id="odProbe">Probe the provider</button>'+
    '<button class="btn" id="odRun">Run ingestion now</button>'+
    '<button class="btn" id="odClose">Close finished markets</button>'+
    '<button class="btn" id="odLink">Link games to the slate</button>'+
    '</div>'+
    '<p class="note" style="margin:10px 0 0">Probe makes one real request and reports the response <b>structure</b> plus whether our reader could map it. It never prints the credential. Running ingestion by hand bypasses the polling interval, so use it sparingly on a trial plan.</p>'+
    '<div id="odOut"></div></div>';

  app.innerHTML='<h1>Odds feed</h1><p class="lede">The Collective&#39;s own NFL market feed. One ingestion path fills it; every surface on the site reads it. Nothing on this page holds or sees the provider credential.</p>'+
    health+lastRun+actions;

  function show(title,obj,cls){
    $('odOut').innerHTML='<div class="'+(cls||'panel')+'" style="margin-top:10px"><b>'+esc(title)+'</b>'+
      '<div class="raw">'+esc(JSON.stringify(obj,null,1))+'</div></div>';
  }
  function wire(id,label,fn){
    $(id).onclick=async function(){
      var b=this;b.disabled=true;var old=b.textContent;b.textContent='Working…';
      try{ show(label,await fn()); }
      catch(e){ show(label+' failed',{error:e.message},'err'); }
      b.textContent=old;b.disabled=false;
    };
  }
  wire('odProbe','Provider probe',function(){
    return api('/v1/probe',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}});
  });
  wire('odRun','Ingestion run',function(){
    return api('/v1/ingest?force=1',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}}).then(function(r){
        setTimeout(render,600); return r;});
  });
  wire('odClose','Close markets',function(){
    return api('/v1/close',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}});
  });
  wire('odLink','Link games',function(){
    return api('/v1/link',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}});
  });
}

async function secEarnings(app){
  var d=await api('/v1/admin/earnings');
  var s=d.summary||{};
  var per=pct(Math.round((s.founder_pool_bps||6000)/(s.founder_count||6)));
  var rows=(d.rows||[]).map(function(r){
    return '<tr><td>'+esc(r.creator_slug)+'</td><td class="mono">'+esc(r.month)+'</td><td class="mono">'+cents(r.earned_cents)+'</td><td class="mono">'+cents(r.clawed_cents)+'</td><td class="mono">'+cents(r.paid_cents)+'</td><td class="mono">'+cents(r.balance_cents)+'</td><td class="mono">'+cents(r.available_cents)+'</td></tr>';
  }).join('');
  function line(label,val,sub){
    return '<div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border)">'+
      '<span>'+label+(sub?'<br><span class="note" style="font-size:11px">'+sub+'</span>':'')+'</span>'+
      '<span class="mono" style="font-weight:700">'+val+'</span></div>';
  }
  app.innerHTML='<h1>Collective Revenue</h1>'+
    '<p class="lede">The waterfall, computed live from the configured economics and the real subscriber count. Change a number in config and every figure here follows.</p>'+
    '<div class="grid2"><div class="panel">'+
      line('Price',cents(s.price_cents)+'<span class="note">/month</span>')+
      line('Subscribers',String(s.subscribers||0))+
      line('Monthly recurring revenue',cents(s.mrr_cents))+
      line('Operating reserve <span class="chip">'+pct(s.reserve_bps||1000)+'</span>',cents(s.reserve_cents),'Infrastructure, data, APIs, processing')+
      line('Platform allocation <span class="chip">'+pct(s.platform_bps||3000)+'</span>',cents(s.platform_cents),'EdgeDesk: platform, billing, hosting, development')+
      line('Founding Collective Pool <span class="chip warn">'+pct(s.founder_pool_bps||6000)+'</span>',cents(s.pool_cents),'Divided equally across '+(s.founder_count||6)+' founding seats')+
      '<div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0"><span><b>Per founding member</b></span><span class="mono" style="font-weight:700;color:var(--pos)">'+cents(s.per_founder_cents)+'</span></div>'+
    '</div><div class="panel">'+
      '<b>Founding Member Distribution</b>'+
      '<p class="note" style="margin:8px 0 0">Each founding member receives an equal share of the '+pct(s.founder_pool_bps||6000)+' Collective founder pool.</p>'+
      '<p style="margin:10px 0 0">Current founder share: <b class="mono">'+per+'</b> of Collective revenue.</p>'+
      '<p class="note" style="margin:10px 0 0">Referral is a separate customer acquisition share, currently '+pct(s.referral_bps||0)+', and never reduces a founder&#39;s pool share.</p>'+
      (s.billing_live?'':'<p class="warnnote" style="margin:10px 0 0">Billing is not live yet: these figures stay at zero until it opens. The structure is already wired, so turning billing on changes nothing here but the numbers.</p>')+
    '</div></div>'+
    '<h2>Ledger</h2><p class="lede">Per creator per month. Net 30, $50 minimum rolls forward, 60-day clawback window.</p>'+
    '<div class="tblwrap"><table><thead><tr><th>Creator</th><th>Month</th><th>Earned</th><th>Clawed back</th><th>Paid out</th><th>Balance</th><th>Available</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="note" style="text-align:center;padding:14px">No ledger entries yet.</td></tr>')+'</tbody></table></div>';
}

render();
</script>
