<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collective Admin</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0b0d1f;--surface:#11132f;--surface2:#171a3a;--border:#222852;--text:#eceaf6;--dim:#9095b8;--faint:#5f6488;--accent:#c9d94a;--pos:#2fb47c;--neg:#e26044;--warn:#d99a2b;--gold:#e3b84d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:dark;accent-color:var(--accent)}
a{color:var(--accent);text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}
.hd{position:sticky;top:0;z-index:10;background:rgba(11,13,31,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.hd-in{display:flex;align-items:center;gap:12px;padding:12px 14px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.wordmark{font-weight:800;font-size:14px;letter-spacing:.06em}
.wordmark .mk{display:inline-block;width:9px;height:14px;background:var(--warn);border-radius:2px;transform:skewX(-12deg);margin-right:7px;vertical-align:-2px}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{color:var(--dim);font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;cursor:pointer}
nav a.on{color:var(--text);background:var(--surface2)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:18px;margin:6px 0 4px}
h2{font-size:14px;margin:22px 0 8px}
.lede{color:var(--dim);font-size:13px;margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;width:100%}
textarea{font-family:'JetBrains Mono',monospace;font-size:12px;min-height:110px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:12.5px;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:700}
.btn[disabled]{opacity:.5;cursor:default}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:8px}
table{border-collapse:collapse;width:100%;min-width:680px}
th{background:var(--surface2);color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:8px 9px;border-top:1px solid var(--border);font-size:12.5px;white-space:nowrap;vertical-align:middle}
td input{width:70px;padding:5px 7px;font-family:'JetBrains Mono',monospace;font-size:12px}
.chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border);border-radius:10px;padding:2px 7px;color:var(--dim)}
.chip.ok{color:var(--pos);border-color:rgba(47,180,124,.45)}
.chip.warn{color:var(--warn);border-color:rgba(217,154,43,.45)}
.chip.dead{color:var(--faint);border-style:dashed}
.note{color:var(--dim);font-size:12px}
.warnnote{color:var(--warn);font-size:12.5px}
.err{border:1px solid rgba(226,96,68,.4);color:var(--neg);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.copybox{display:flex;gap:8px;margin:10px 0}
.copybox .val{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow-x:auto;white-space:pre}
.raw{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;white-space:pre-wrap;max-height:160px;overflow:auto;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:12.5px;z-index:80;max-width:calc(100vw - 28px);text-align:center}
.toast.bad{border-color:rgba(226,96,68,.55);color:var(--neg)}
.toast.good{border-color:rgba(47,180,124,.5)}
.btn.danger{background:transparent;border-color:rgba(226,96,68,.55);color:var(--neg)}
.btn.danger.solid{background:var(--neg);border-color:var(--neg);color:#160806;font-weight:700}
.linkdanger{color:var(--neg);cursor:pointer}
/* ---- the removal sheet -------------------------------------------------
   A confirmation is only a safeguard if it is READ, so this is a panel with
   the numbers in it, not an alert with a verb in it. */
.mask{position:fixed;inset:0;background:rgba(4,5,15,.72);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:620px;margin:auto;padding:16px}
.sheet h2{margin:0 0 2px;font-size:15px}
.sheet .close{float:right;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.facts .f{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.facts .f .k{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
.facts .f .v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;margin-top:2px}
.opt{border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-top:10px;cursor:pointer;background:var(--surface2)}
.opt.on{border-color:var(--accent)}
.opt.danger.on{border-color:var(--neg)}
.opt b{display:block;font-size:13px}
.opt ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12px}
.opt li{margin:2px 0}
.ledger{font-size:12px;color:var(--dim);margin:4px 0 0}
.ledger b{color:var(--text)}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.impact{grid-template-columns:1fr}.sheet{padding:13px}}
.impact .col{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 10px}
.impact .col.del{border-color:rgba(226,96,68,.4)}
.impact .col h3{margin:0 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.impact .col .r{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:2px 0}
.impact .col .r span:last-child{font-family:'JetBrains Mono',monospace}
/* On a phone the members table has to give something up, and it must not be
   the removal action: a destructive control parked behind a horizontal scroll
   is a control nobody finds until they scroll past it by accident. Role and
   Joined go; both are still on the member's own page and in the removal
   panel, which is where a removal is decided anyway. */
@media(max-width:700px){
  #memTable{min-width:0}
  #memTable .c-role,#memTable .c-joined,#memTable .c-model,#memTable .c-slate{display:none}
  #memTable .c-inline{display:block}
  #memTable td,#memTable th{padding:7px 6px;white-space:normal}
}
.c-inline{display:none}
</style>

<script>
"use strict";
window.COLLECTIVE_CONFIG = {
  SB_URL:  "https://iattxbkbufslbauoumga.supabase.co",
  SB_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdHR4YmtidWZzbGJhdW91bWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzY4MDUsImV4cCI6MjA5NzIxMjgwNX0.Mly5G587o5IFRnEigU2wRp9buWEk3dFwH9RNPJK7Uo8",
  BASE_URL: "https://edgedesksports.com",
  API: "https://iattxbkbufslbauoumga.supabase.co/functions/v1"
};
var CFG=window.COLLECTIVE_CONFIG;
function apiOverrideAllowed(u){
  try{
    var url=new URL(String(u||''),location.href);
    if(url.protocol!=='https:'&&url.protocol!=='http:')return false;
    var h=url.hostname.toLowerCase();
    if(h==='localhost'||h==='127.0.0.1'||h==='[::1]')return true;
    if(url.protocol!=='https:')return false;
    return /(^|\.)supabase\.co$/.test(h)||/(^|\.)supabase\.in$/.test(h)||/(^|\.)edgedesksports\.com$/.test(h);
  }catch(e){return false;}
}
function resolveApiBase(){
  var q=null,ls=null;
  try{q=new URLSearchParams(location.search).get('api');}catch(e){}
  if(q&&apiOverrideAllowed(q))return q;
  try{ls=localStorage.getItem('COLLECTIVE_API_OVERRIDE');}catch(e){}
  return ls||CFG.API;
}
/* The session token goes to whatever API base this resolves to, so a URL
   override is honoured only for hosts a Collective deployment can live on.
   See collective/index.html for the full note. */
var API=resolveApiBase();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function toast(m,kind){
  var t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:'');
  t.textContent=m;document.body.appendChild(t);
  setTimeout(function(){t.remove();},kind==='bad'?5200:3200);
}

/* ---- the database's own door -------------------------------------------
   Member removal is not an endpoint on collective_admin: it is three
   SECURITY DEFINER routines installed by supabase/collective_member_removal.sql,
   called here over PostgREST with the signed-in admin's OWN token. The acting
   user is auth.uid() inside the database and there is no argument for it, so
   nothing this page sends can claim to be somebody else. The anon key is the
   apikey every Supabase client sends; it grants nothing on its own, and anon
   has execute on none of these.

   The REST base is derived from the SAME resolved API base the rest of this
   page uses, so the ?api= guard above covers it too and a local override still
   reaches a local database. */
function restBase(){
  var b=String(API||CFG.API||'').replace(/\/+$/,'').replace(/\/functions\/v1$/,'');
  return (b||CFG.SB_URL)+'/rest/v1';
}
async function rpc(fn,args){
  var s=session();
  var h={apikey:CFG.SB_ANON,'content-type':'application/json'};
  if(s&&s.access_token)h['authorization']='Bearer '+s.access_token;
  var r=await fetch(restBase()+'/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});
  var d=null;try{d=await r.json();}catch(e){}
  if(!r.ok){
    var e2=new Error((d&&(d.message||d.hint))||('Request failed ('+r.status+')'));
    e2.status=r.status;
    /* PGRST202: the function is not in the schema cache. On this project that
       means one thing: the migration has not been pasted yet. Say so, rather
       than showing a code nobody can act on. */
    if(d&&(d.code==='PGRST202'||d.code==='PGRST203'))e2.notInstalled=true;
    if(r.status===404)e2.notInstalled=true;
    throw e2;
  }
  /* An ok:false body is the routine's own refusal (forbidden, last_admin,
     confirmation_required). It is data, not a transport failure. */
  return d;
}
var MIGRATION_NOTE='The member-removal routines are not installed on this project yet. '+
  'Run supabase/collective_member_removal.sql in the Supabase SQL editor, then reload.';

/* ---- what the members list is allowed to say --------------------------
   The status shown is the one the server already derives (membership), never
   a second opinion computed here. The only thing added is a fact: a member
   with zero stored submissions has never posted, and that is worth seeing
   without opening them. Where the activity roll is unavailable the columns
   say so and nothing is guessed. */
function memberStatus(row,act){
  row=row||{};
  if(act&&act.removed_at)
    return {key:'REMOVED',label:'Removed',cls:'dead'};
  if(act&&act.submissions===0)
    return {key:'NO SUBMISSIONS',label:'No submissions',cls:'warn'};
  if(row.membership==='ACTIVE CONTRIBUTOR')return {key:'ACTIVE',label:'Active',cls:'ok'};
  if(row.membership==='INACTIVE')return {key:'INACTIVE',label:'Inactive',cls:'dead'};
  return {key:'MEMBER',label:row.membership?String(row.membership):'Member',cls:''};
}
/* One activity row per creator, keyed by slug, so a member the roll does not
   mention reads as unknown rather than as zero. */
function activityIndex(res){
  var out={};
  if(!res||!res.ok||!res.available||!res.rows)return out;
  res.rows.forEach(function(r){if(r&&r.creator_slug)out[r.creator_slug]=r;});
  return out;
}
function num(n){return (n==null||n==='')?'\u2014':Number(n).toLocaleString('en-US');}
function shortDate(iso){
  if(!iso)return '\u2014';
  var d=new Date(iso);
  return isNaN(d.getTime())?'\u2014':d.toLocaleDateString();
}
/* The sentence shown after a removal. It reports what the SERVER said it did,
   which is the only number anybody should believe. */
function removalMessage(res){
  if(!res)return 'Removed.';
  if(res.no_op)return 'Already removed. Nothing changed.';
  var n=Number(res.submissions_deleted||0);
  if(res.mode==='membership_only')
    return 'Contributor removed from the Collective. Their submissions and record were kept.';
  return n===1
    ? 'Contributor and 1 Collective submission deleted.'
    : 'Contributor and '+n.toLocaleString('en-US')+' Collective submissions deleted.';
}
/* The two columns of the impact panel, built from the preview the database
   returned. Nothing here is computed in the browser: every number is one the
   routine counted from real rows. */
function impactLines(pv,mode){
  if(!pv||!pv.ok)return {del:[],keep:[]};
  var c=pv.counts||{},w=pv.will_delete||{},k=pv.will_preserve||{};
  var del=[],keep=[];
  if(mode==='full_collective_delete'){
    del.push(['Collective submissions',c.submissions]);
    del.push(['graded results',c.graded]);
    del.push(['pending / ungraded',c.pending]);
    if(c.quarantined)del.push(['quarantined rows',c.quarantined]);
    (w.tables||[]).forEach(function(t){
      if(t.action!=='deleted')return;
      if(t.table==='projections')return;
      del.push([t.table.replace(/_/g,' '),t.rows]);
    });
  }else{
    del.push(['submission keys and access grants','revoked']);
    keep.push(['Collective submissions',c.submissions]);
    keep.push(['graded results',c.graded]);
    keep.push(['their model and its record','kept']);
  }
  keep.push(['games',k.games]);
  keep.push(['other contributors',k.other_contributors]);
  keep.push(['their submissions',k.other_contributor_submissions]);
  (k.protected_tables||[]).forEach(function(t){keep.push([t.table.replace(/_/g,' '),t.rows]);});
  keep.push(['their EdgeDesk account','never touched']);
  return {del:del,keep:keep};
}
/* A score typed into the results form. An EMPTY box used to post as 0 —
   the unary plus on an empty string is 0, not NaN — so one click on Settle
   with nothing typed settled a game 0-0, and the settlement then graded
   every model on it against a score nobody scored. Empty is NaN here, and
   only a whole number in a football range is a score. */
function settleScore(v){
  var s=String(v==null?'':v).trim();
  if(!s)return NaN;
  var n=Number(s);
  return (isFinite(n)&&Math.floor(n)===n&&n>=0&&n<=200)?n:NaN;
}
/* The same rule collective/index.html reads results by: two zeros are the
   signature of a blank form, never a final. */
function isPlaceholderResult(r){
  if(!r||r.home_score==null||r.away_score==null)return false;
  return Number(r.home_score)===0&&Number(r.away_score)===0;
}
function rel(iso){if(!iso)return 'never';var s=(Date.now()-new Date(iso).getTime())/1e3;if(s<5400)return Math.max(1,Math.round(s/60))+'m ago';if(s<172800)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function cents(c){return c==null?'-':'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function copyWire(scope){(scope||document).querySelectorAll('[data-copy]').forEach(function(b){if(b._w)return;b._w=true;b.onclick=function(){var v=$(b.getAttribute('data-copy')).textContent;if(navigator.clipboard)navigator.clipboard.writeText(v).then(function(){toast('Copied');});};});}

var SPORTS=null;
async function sports(){
  if(SPORTS)return SPORTS;
  try{
    var m=await api('/v1/meta',{fn:'collective_public'});
    SPORTS=(m&&m.sports&&m.sports.length)?m.sports:[{code:'NFL',season:new Date().getFullYear()}];
  }catch(e){SPORTS=[{code:'NFL',season:new Date().getFullYear()}];}
  return SPORTS;
}
function sportOpts(list,sel){
  return list.map(function(s){return '<option value="'+esc(s.code)+'"'+(sel===s.code?' selected':'')+'>'+esc(s.code)+(s.name?' ('+esc(s.name)+')':'')+'</option>';}).join('');
}
function seasonFor(list,code){var s=list.filter(function(x){return x.code===code;})[0];return (s&&s.season)||new Date().getFullYear();}
function session(){try{return JSON.parse(localStorage.getItem('collective_admin_session')||'null');}catch(e){return null;}}
(function(){
  if(/access_token=/.test(location.hash)){
    var p=new URLSearchParams(location.hash.replace(/^#\/?/,''));
    if(p.get('access_token')){
      try{localStorage.setItem('collective_admin_session',JSON.stringify({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:p.get('expires_at')}));}catch(e){}
      history.replaceState(null,'',location.pathname+location.search);
    }
  }
})();
async function api(path,opts){
  opts=opts||{};
  var h=opts.headers||{};
  var s=session();if(s&&s.access_token)h['authorization']='Bearer '+s.access_token;
  var fn=opts.fn||'collective_admin';
  var r=await fetch(API+'/'+fn+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  var d=null;try{d=await r.json();}catch(e){}
  if(!r.ok){var e2=new Error((d&&d.error&&d.error.message)||('Request failed ('+r.status+')'));e2.status=r.status;throw e2;}
  return d;
}

var SEC='overview';
var IV_PREFILL=null;
/* A percentage the server did not send is not 0%. It used to render as one,
   which reads as "the platform takes nothing" rather than "nobody said". */
function pct(bps){
  if(bps==null||bps===''||!isFinite(+bps))return '\u2014';
  bps=+bps;
  return (bps/100)%1===0?(bps/100)+'%':(bps/100).toFixed(1)+'%';
}
/* ---- the founder split, and the two numbers behind it -------------------
   THE POOL IS DIVIDED BY A CONFIGURED NUMBER, NOT BY A COUNT OF PEOPLE.
   econ.founder_count is set in config and the payout math reads it
   independently. Clearing somebody's founding_member flag -- marking them
   departed -- changes who the founding members ARE and changes nothing at
   all about that divisor.

   The pool then splits N ways among fewer than N people. A departed
   member's share is paid to nobody, every remaining founder is quietly
   short, and no screen said so, because the count of actual founding
   members (overview) and the configured divisor (earnings) had never been
   in the same place.

   They are now. This returns both, and whether they disagree. It does not
   fix the payout -- the backend owns that -- it makes the drift impossible
   to miss on the screen where the money is divided. */
function founderSplit(s,actual){
  s=s||{};
  var pool=(s.founder_pool_bps==null||!isFinite(+s.founder_pool_bps))?null:+s.founder_pool_bps;
  var cfg=(s.founder_count==null||s.founder_count===''||!isFinite(+s.founder_count))?null:+s.founder_count;
  var act=(actual==null||actual===''||!isFinite(+actual))?null:+actual;
  return {
    pool_bps:pool,
    configured:cfg,
    actual:act,
    /* what the payout math is actually doing */
    per_configured_bps:(pool!=null&&cfg!=null&&cfg>0)?Math.round(pool/cfg):null,
    /* what an equal split across the people who really hold the status would be */
    per_actual_bps:(pool!=null&&act!=null&&act>0)?Math.round(pool/act):null,
    /* positive: more founders than seats. negative: seats nobody holds. */
    drift:(cfg!=null&&act!=null)?(act-cfg):0
  };
}
/* Said once, so the earnings screen, the overview and a member's own page
   cannot describe the same disagreement three different ways. */
function founderDriftHTML(f){
  if(!f||!f.drift)return '';
  var short=f.drift<0;
  return '<p class="warnnote" style="margin:10px 0 0"><b>The configured founder count does not match the roll.</b> '
    +'The split is being computed against <b class="mono">'+f.configured+'</b> founding seat'+(f.configured===1?'':'s')
    +', but <b class="mono">'+f.actual+'</b> account'+(f.actual===1?'':'s')
    +' currently carr'+(f.actual===1?'ies':'y')+' founding status'
    +(short
      ? ' \u2014 so '+Math.abs(f.drift)+' seat'+(Math.abs(f.drift)===1?' is':'s are')+' held by nobody and '
        +'that share is paid to no one. Each remaining founder is being paid '
        +pct(f.per_configured_bps)+' where an equal split of the pool would be '+pct(f.per_actual_bps)+'.'
      : ' \u2014 so '+f.drift+' founder'+(f.drift===1?'':'s')+' beyond the configured seats '
        +'share a pool sized for fewer. Each is being paid against '+pct(f.per_configured_bps)
        +' where an equal split would be '+pct(f.per_actual_bps)+'.')
    +' Clearing a founding_member flag does not decrement econ.founder_count: the payout math reads that '
    +'number independently, so it has to be changed in config as well.</p>';
}
function linkCache(){try{return JSON.parse(localStorage.getItem('mc_admin_links')||'{}');}catch(e){return {};}}
function cacheLink(id,url){try{var c=linkCache();c[id]=url;localStorage.setItem('mc_admin_links',JSON.stringify(c));}catch(e){}}
function nav(){
  $('nav').classList.remove('hide');
  document.querySelectorAll('#nav a').forEach(function(a){
    a.classList.toggle('on',a.getAttribute('data-s')===SEC);
    a.onclick=function(){SEC=a.getAttribute('data-s');nav();render();};
  });
}

function signin(){
  $('app').innerHTML='<h1>Sign in</h1><p class="lede">Admin access is by account allowlist. Sign in with your email and a one-time link.</p>'+
    '<div class="panel" style="max-width:420px"><label>Email</label><input id="aEmail" type="email" placeholder="you@example.com">'+
    '<div style="margin-top:12px"><button class="btn primary" id="aSend">Send my sign-in link</button></div>'+
    '<p class="note hide" id="aSent" style="margin-top:10px"></p></div>';
  $('aSend').onclick=async function(){
    var em=$('aEmail').value.trim();if(!/.+@.+\..+/.test(em))return;
    this.disabled=true;
    var redirect=location.origin+location.pathname+(location.search||'');
    try{
      var r=await fetch(CFG.SB_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{apikey:CFG.SB_ANON,'content-type':'application/json'},body:JSON.stringify({email:em,create_user:true})});
      if(!r.ok)throw new Error('Could not send the link ('+r.status+')');
      $('aSent').textContent='Link sent to '+em+'. Open it on this device.';$('aSent').classList.remove('hide');
    }catch(e){toast(e.message);this.disabled=false;}
  };
}
function notAdmin(uidMsg){
  $('app').innerHTML='<div class="panel"><b>This account is not on the admin list.</b><br><span class="note">'+esc(uidMsg||'')+' Add the user id to collective.config key admin.user_ids, then reload.</span><br><br><button class="btn" onclick="localStorage.removeItem(\'collective_admin_session\');location.reload()">Sign out</button></div>';
}

async function render(){
  if(!session()){signin();return;}
  nav();
  var app=$('app');
  app.innerHTML='<div class="panel note">Loading '+esc(SEC)+'&hellip;</div>';
  try{
    if(SEC==='overview')await secOverview(app);
    else if(SEC==='invites')await secInvites(app);
    else if(SEC==='members')await secMembers(app);
    else if(SEC==='quarantine')await secQuarantine(app);
    else if(SEC==='games')await secGames(app);
    else if(SEC==='results')await secResults(app);
    else if(SEC==='odds')await secOdds(app);
    else if(SEC==='earnings')await secEarnings(app);
  }catch(e){
    if(e.status===401){localStorage.removeItem('collective_admin_session');signin();return;}
    if(e.status===403){notAdmin();return;}
    app.innerHTML='<div class="err">'+esc(e.message)+'</div>';
  }
}

      ['Founding members',c.founding_members],

    (t.quarantined_rows>0?'<p class="note" style="margin:10px 0 0"><a href="#" data-go="quarantine">Resolve quarantine &rarr;</a></p>':'')+'</div>'+
    '<h2>Earnings</h2><div class="panel">'+kv([
      ['Operating reserve ('+pct(e.reserve_bps)+')',cents(e.reserve_cents)],
      ['Platform ('+pct(e.platform_bps)+')',cents(e.platform_cents)],

async function secInvites(app){
  var list=await api('/v1/admin/invites');
  var links=linkCache();
  var rows=(list.rows||[]).map(function(r){
    var st={sent:'<span class="chip ok">Sent</span>',redeemed:'<span class="chip ok">Active</span>',
            expired:'<span class="chip dead">Expired</span>',revoked:'<span class="chip dead">Revoked</span>'}[r.status]||esc(r.status);

    }
    if(r.status==='sent')acts.push('<a href="#" data-act="revoke" data-id="'+esc(r.id)+'" style="color:var(--neg)">Revoke</a>');

      '<td>'+(r.founding?'<span class="chip warn">&#9733; Founding</span>':'<span class="chip">Creator</span>')+'</td>'+

      '<td class="note">'+new Date(r.expires_at).toLocaleDateString()+'</td>'+
      '<td style="display:flex;gap:10px">'+acts.join('')+'</td></tr>';
  }).join('');
  var pf=IV_PREFILL||{};IV_PREFILL=null;
  app.innerHTML='<h1>Invite a Creator</h1><p class="lede">One action mints the whole onboarding package: link, profile shell, model, source, founding status, key, prompt, and embed. You send the link; the creator does the rest in about a minute.</p>'+
    /* The invite page states the participation floor before anyone accepts.
       Repeated here so whoever mints the link knows exactly what the person
       on the other end has been told, and can say the same thing. */
    '<div class="panel" style="border-color:rgba(217,154,43,.45)">'+
    '<b style="color:var(--warn)">What the invite tells them</b>'+
    '<p class="note" style="margin:6px 0">Active participation requires at least <b>3 eligible model projections '+
    'per week</b> within their declared sport or scope. Members who repeatedly submit fewer than that, or who miss '+
    'weeks without communication, may be moved to inactive or removed. Personal betting activity does not matter \u2014 '+
    'they submit the model\u2019s output, not only the games they choose to bet.</p>'+
    '<p class="note" style="margin:0">This is on the invite screen before they accept, on their finish screen, on the '+
    'public rules page, and as a live count on their own dashboard. Nobody should learn it from being removed.</p></div>'+
    '<div class="panel"><div class="grid2">'+
    '<div><label>Name</label><input id="ivName" placeholder="Their public name" value="'+esc(pf.display_name||'')+'"></div>'+
    '<div><label>Email <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="ivEmail" placeholder="them@example.com" value="'+esc(pf.email||'')+'"></div>'+
    '<div><label>Model name <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="ivModel" placeholder="They can name it during onboarding" value="'+esc(pf.model_name||'')+'"></div>'+
    '</div>'+
    '<label>Where does their model live? <span style="text-transform:none;letter-spacing:0">(optional)</span></label>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap" id="ivSrcRow">'+
      ['excel','github','online','other'].map(function(k){return '<button class="btn" data-src="'+k+'">'+SRC_LABEL[k]+'</button>';}).join('')+
    '</div><div id="ivSrcDetail"></div>'+
    '<label>Founding member?</label>'+
    '<div style="display:flex;gap:8px" id="ivFoundRow">'+
      '<button class="btn" data-f="1">&#9733; Founding Member</button><button class="btn" data-f="0">Creator</button>'+
    '</div>'+
    '<div style="margin-top:14px"><button class="btn primary" id="ivGo">Mint Invite</button></div><div id="ivOut"></div></div>'+
    '<h2>All invites</h2><div class="tblwrap"><table><thead><tr><th>Creator</th><th>Model</th><th>Type</th><th>Status</th><th>Created</th><th>Expires</th><th>Actions</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="note" style="text-align:center;padding:14px">No invites yet. Mint the first one above.</td></tr>')+'</tbody></table></div>'+
    '<p class="note">Copy and Open work on this device for links minted here; invite codes are stored hashed, so a link cannot be recovered later. Resend prefills the form so a fresh link is one click.</p>';

  var ivSrc=pf.source_kind||null,ivFound=(pf.founding===true)?'1':'0';
  function paintSrc(){
    document.querySelectorAll('#ivSrcRow .btn').forEach(function(b){
      b.style.borderColor=b.getAttribute('data-src')===ivSrc?'var(--accent)':'';
      b.style.color=b.getAttribute('data-src')===ivSrc?'var(--text)':'';
    });
    var d2=ivSrc?SRC_DETAIL[ivSrc]:null;
    $('ivSrcDetail').innerHTML=!d2?'':(d2.label
      ?'<label>'+esc(d2.label)+'</label><input id="ivSrcRef" placeholder="'+esc(d2.ph||'')+'" value="'+esc(pf.source_ref||'')+'">'
      :'<p class="note" style="margin:8px 0 0">'+esc(d2.note)+'</p>');

    document.querySelectorAll('#ivFoundRow .btn').forEach(function(b){
      var on=b.getAttribute('data-f')===ivFound;
      b.style.borderColor=on?(ivFound==='1'?'var(--gold)':'var(--accent)'):'';
      b.style.color=on?'var(--text)':'';
    });
  }
  document.querySelectorAll('#ivSrcRow .btn').forEach(function(b){
    b.onclick=function(){ivSrc=(ivSrc===b.getAttribute('data-src'))?null:b.getAttribute('data-src');paintSrc();};
  });
  document.querySelectorAll('#ivFoundRow .btn').forEach(function(b){
    b.onclick=function(){ivFound=b.getAttribute('data-f');paintFound();};

    this.disabled=true;
    try{
      var body={display_name:name,email:$('ivEmail').value.trim(),model_name:$('ivModel').value.trim(),founding:ivFound==='1'};
      if(ivSrc){body.source_kind=ivSrc;if($('ivSrcRef'))body.source_ref=$('ivSrcRef').value.trim();}
      var r=await api('/v1/admin/invites',{method:'POST',headers:{'content-type':'application/json'},body:body});
      if(r.invite_id)cacheLink(r.invite_id,r.invite_url);

        '<h2 style="margin:0 0 4px">Invite Ready</h2>'+
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 2px">'+

          (r.invite.model_name?'<span class="note">'+esc(r.invite.model_name)+'</span>':'')+
          (r.invite.founding?'<span class="chip warn">&#9733; Founding Member</span>':'<span class="chip">Creator</span>')+
          (r.invite.source_kind?'<span class="chip">'+esc(SRC_LABEL[r.invite.source_kind]||r.invite.source_kind)+'</span>':'')+
        '</div>'+
        '<div class="copybox"><div class="val" id="ivUrl">'+esc(r.invite_url)+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn primary" data-copy="ivUrl">Copy Invite Link</button>'+
          '<button class="btn" id="ivMsgBtn">Copy Message</button>'+
          '<a class="btn" href="'+esc(r.invite_url)+'" target="_blank" rel="noopener">Open Invite</a>'+
        '</div>'+
        '<p class="note" style="margin:10px 0 0">Send the link however you already talk to them. It works once and expires in 30 days. When they finish onboarding they appear under Members automatically.</p></div>';

      };

    }catch(e){toast(e.message);}
    this.disabled=false;
  };

  app.querySelectorAll('[data-act]').forEach(function(a){

      ev.preventDefault();
      var id=a.getAttribute('data-id'),act=a.getAttribute('data-act');
      if(act==='copy'){
        var u=linkCache()[id];

      }

        if(!confirm('Revoke this invite? The link stops working immediately. This cannot be undone.'))return;

        catch(e){toast(e.message);}
        return;
      }
      if(act==='resend'){
        var row=(list.rows||[]).filter(function(x){return x.id===id;})[0]||{};
        IV_PREFILL={display_name:row.display_name,email:row.email,model_name:row.model_name,
          source_kind:row.source_kind,founding:row.founding};
        render();window.scrollTo(0,0);toast('Form prefilled. Mint to issue a fresh link.');
      }
    };
  });
}

var MEM_ACT=null, MEM_ACT_ERR=null, REMOVAL_BUSY=false;

async function loadActivity(force){
  if(MEM_ACT&&!force)return MEM_ACT;
  try{ MEM_ACT=activityIndex(await rpc('collective_member_activity',{})); MEM_ACT_ERR=null; }
  catch(e){ MEM_ACT={}; MEM_ACT_ERR=e.notInstalled?MIGRATION_NOTE:e.message; }
  return MEM_ACT;
}

async function secMembers(app,detailSlug){
  var res=await Promise.all([api('/v1/admin/members'),api('/v1/admin/earnings').catch(function(){return null;})]);
  var d=res[0],esum=res[1]&&res[1].summary;
  var act=await loadActivity();
  var list=d.rows||[];
  if(detailSlug){
    var r=list.filter(function(x){return x.creator_slug===detailSlug;})[0];
    if(r){memberDetail(app,r,esum,act[detailSlug]);return;}
  }
  var rows=list.map(function(r){
    var a=act[r.creator_slug]||null;
    var st=memberStatus(r,a);
    var removed=!!(a&&a.removed_at);
    return '<tr data-m="'+esc(r.creator_slug)+'"'+(removed?' style="opacity:.55"':'')+'>'+
      /* On a phone the Last slate column is hidden, so the number it carries
         moves here rather than disappearing: it is the one that decides
         whether somebody is participating. */
      '<td class="go" style="cursor:pointer"><b>'+esc(r.display_name)+'</b><br><span class="note mono">'+esc(r.creator_slug)+'</span>'+
        '<span class="note c-inline">last slate '+rel(r.last_submission_at||(a&&a.last_submission_at))+
        ' · joined '+esc(shortDate(r.joined_at))+'</span></td>'+
      '<td class="go c-model" style="cursor:pointer">'+esc((r.models||[]).map(function(mo){return mo.name;}).join(', '))+'</td>'+
      '<td class="c-role">'+(r.founding?'<span class="chip warn">&#9733; Founding</span>':'<span class="chip">Creator</span>')+'</td>'+
      '<td><span class="chip '+esc(st.cls)+'">'+esc(st.label)+'</span></td>'+
      '<td class="mono">'+(a?esc(num(a.submissions)):'<span class="note">—</span>')+'</td>'+
      '<td class="note c-slate">'+rel(r.last_submission_at||(a&&a.last_submission_at))+'</td>'+
      '<td class="note c-joined">'+esc(shortDate(r.joined_at))+'</td>'+
      '<td><a class="linkdanger" data-rm="'+esc(r.creator_slug)+'" title="'+
        (removed?'Already removed. Opening this still offers a full delete of their Collective data.'
                :'Opens the impact panel. Nothing is deleted by clicking this.')+'">'+
        (removed?'Removed':'Remove')+'</a></td></tr>';
  }).join('');
  /* The standard this list is read against, next to the list. "Last slate"
     is the column that decides whether somebody is participating, and it
     means nothing without the number it is being judged against. */
  var ACTIVE_NOTE='<p class="note" style="margin:8px 0 0">Active participation is at least '+
    '<b>3 eligible model projections per week</b> in the member’s declared sport or scope. Members who '+
    'repeatedly fall short, or miss weeks without communication, may be moved to inactive or removed — they are '+
    'told this on the invite, on the rules page, and by a live count on their own dashboard. <b>Last slate</b> is the '+
    'column to read it against. Status is the one the server derives; <b>No submissions</b> is a fact about stored rows, '+
    'not a judgement.</p>';
  app.innerHTML='<h1>Members</h1><p class="lede">Everyone in the Collective. Click a member for the full picture: identity, model, source, activity, and economics. Membership status is derived from submissions, never set by hand.</p>'+
    (MEM_ACT_ERR?'<div class="err">Submission counts and removal are unavailable: '+esc(MEM_ACT_ERR)+'</div>':'')+
    '<div class="tblwrap"><table id="memTable"><thead><tr><th>Name</th><th class="c-model">Model</th><th class="c-role">Role</th><th>Status</th><th>Subs</th><th class="c-slate">Last slate</th><th class="c-joined">Joined</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="8" class="note" style="text-align:center;padding:14px">No members yet. Mint an invite under Invites.</td></tr>')+'</tbody></table></div>'+ACTIVE_NOTE;
  app.querySelectorAll('tr[data-m]').forEach(function(tr){
    tr.querySelectorAll('.go').forEach(function(td){
      td.onclick=function(){secMembers(app,tr.getAttribute('data-m'));};
    });
  });
  app.querySelectorAll('[data-rm]').forEach(function(a){
    a.onclick=function(ev){
      ev.preventDefault();ev.stopPropagation();
      var slug=a.getAttribute('data-rm');
      openRemoval(list.filter(function(x){return x.creator_slug===slug;})[0]||{creator_slug:slug},app);
    };
  });
}

/* ================= removing a contributor =================
   NOTHING IS DELETED BY OPENING THIS. The panel is a read: it asks the
   database what a removal would touch and shows the answer, per table, with
   the row counts the database counted. The admin then picks one of two
   removals, and the destructive one is refused by the SERVER unless the word
   DELETE is typed — the box below is a courtesy, not the check. */
function closeRemoval(){
  var m=$('rmMask');
  if(m){m.remove();document.removeEventListener('keydown',removalKeys);}
}
function removalKeys(e){ if(e.key==='Escape'&&!REMOVAL_BUSY)closeRemoval(); }

async function openRemoval(row,app){
  closeRemoval();
  var slug=row.creator_slug;
  var mask=document.createElement('div');
  mask.className='mask';mask.id='rmMask';
  mask.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Remove contributor">'+
    '<span class="close" id="rmX">&times;</span><h2>Remove contributor</h2>'+
    '<p class="note" id="rmWho">'+esc(row.display_name||slug)+'</p>'+
    '<div class="panel note" style="margin:12px 0 0">Reading what this would touch&hellip;</div></div>';
  mask.onclick=function(e){if(e.target===mask&&!REMOVAL_BUSY)closeRemoval();};
  document.body.appendChild(mask);
  document.addEventListener('keydown',removalKeys);
  $('rmX').onclick=function(){if(!REMOVAL_BUSY)closeRemoval();};

  var pv;
  try{ pv=await rpc('collective_member_removal_preview',{p_creator_slug:slug}); }
  catch(e){ pv={ok:false,code:e.notInstalled?'not_installed':'error',message:e.notInstalled?MIGRATION_NOTE:e.message}; }
  if(!$('rmMask'))return;
  if(!pv||!pv.ok){
    $('rmMask').querySelector('.sheet').innerHTML=
      '<span class="close" id="rmX2">&times;</span><h2>Remove contributor</h2>'+
      '<div class="err">'+esc((pv&&pv.message)||'The impact could not be read, so nothing is offered here.')+'</div>'+
      '<button class="btn" id="rmClose2">Close</button>';
    $('rmX2').onclick=closeRemoval;$('rmClose2').onclick=closeRemoval;
    return;
  }
  renderRemoval(pv,row,app);
}

      '<li>Their EdgeDesk account, the earnings ledger, games and market data are untouched</li>'+
      '<li><b style="color:var(--neg)">This cannot be undone.</b></li></ul></div>';

  }

  sheet.innerHTML=
    '<span class="close" id="rmX">&times;</span>'+
    '<h2>Remove '+esc(c.display_name||row.display_name||slug)+'</h2>'+
    '<p class="note mono" style="margin:0">'+esc(slug)+

        ((pv.models&&pv.models.length)?' · '+esc(pv.models.map(function(m){return m.name;}).join(', ')):''))+'</p>'+

    (g.actor_is_target?'<div class="err" style="margin:10px 0 0">This is your own account. An administrator cannot remove themselves here — ask another administrator.</div>':'')+
    (g.target_is_admin&&!g.actor_is_target?'<div class="err" style="margin:10px 0 0"><b>This contributor is a Collective administrator.</b> Removing them does not remove their admin rights: those live in the config key <span class="mono">admin.user_ids</span> and have to be changed there as well.'+
       (g.admin_count<=1?' They are also the ONLY configured administrator, so this removal will be refused.':'')+'</div>':'')+
    '<div class="facts">'+
      '<div class="f"><div class="k">Joined</div><div class="v" style="font-size:13px">'+esc(shortDate(c.joined_at))+'</div></div>'+
      '<div class="f"><div class="k">Submissions</div><div class="v">'+esc(num(cnt.submissions))+'</div></div>'+
      '<div class="f"><div class="k">Graded</div><div class="v">'+esc(num(cnt.graded))+'</div></div>'+
      '<div class="f"><div class="k">Pending</div><div class="v">'+esc(num(cnt.pending))+'</div></div>'+
      (cnt.quarantined?'<div class="f"><div class="k">Quarantined</div><div class="v">'+esc(num(cnt.quarantined))+'</div></div>':'')+
      '<div class="f"><div class="k">Last slate</div><div class="v" style="font-size:13px">'+esc(rel(cnt.last_submission_at))+'</div></div>'+
    '</div>'+
    '<div id="rmOpts">'+optionHTML()+'</div>'+
    '<div id="rmImpact">'+impactHTML()+'</div>'+
    '<div id="rmConfirm">'+confirmHTML()+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+
      '<button class="btn" id="rmCancel">Cancel</button>'+
      '<button class="btn primary" id="rmGo">Remove from the Collective</button>'+
    '</div><div id="rmErr"></div>';

  function paint(){
    $('rmOpts').innerHTML=optionHTML();
    $('rmImpact').innerHTML=impactHTML();
    $('rmConfirm').innerHTML=confirmHTML();
    var go=$('rmGo');
    go.className='btn '+(mode==='full_collective_delete'?'danger solid':'primary');
    go.textContent=mode==='full_collective_delete'
      ? 'Delete '+num(cnt.submissions)+' submission'+(Number(cnt.submissions)===1?'':'s')+' and remove'
      : 'Remove from the Collective';
    wire();
    gate();
  }
  function gate(){
    var go=$('rmGo');
    var blocked=!!g.actor_is_target||REMOVAL_BUSY;
    if(mode==='full_collective_delete'){
      var t=$('rmType');
      blocked=blocked||!t||t.value.trim()!=='DELETE';
    }
    go.disabled=blocked;
  }
  function wire(){
    $('rmOpts').querySelectorAll('.opt').forEach(function(o){
      o.onclick=function(){mode=o.getAttribute('data-mode');paint();};
    });
    var t=$('rmType');if(t)t.oninput=gate;
  }
  $('rmX').onclick=function(){if(!REMOVAL_BUSY)closeRemoval();};
  $('rmCancel').onclick=function(){if(!REMOVAL_BUSY)closeRemoval();};
  $('rmGo').onclick=async function(){
    /* One request per click, and one click per removal. A double-click used to
       be the classic way to run a destructive action twice; the database
       serializes it too, but the second request should never leave here. */
    if(REMOVAL_BUSY)return;
    REMOVAL_BUSY=true;this.disabled=true;var label=this.textContent;this.textContent='Removing…';
    var res=null,errMsg=null;
    try{
      res=await rpc('collective_member_remove',{

        p_confirm:mode==='full_collective_delete'?(($('rmType')||{}).value||'').trim():null});

      if(box){box.innerHTML='<div class="err">'+esc(m)+'</div>';}
      var b=$('rmGo');if(b){b.disabled=false;b.textContent=label;}
      gate();
      toast(m,'bad');
      return;
    }
    closeRemoval();
    toast(removalMessage(res),'good');
    /* Refresh from the server rather than patching the row in place: the
       counts on this screen are the database's, and after a removal they have
       all moved. No hard reload. */
    MEM_ACT=null;
    if(app)secMembers(app);
  };
  paint();
}

/* Slate parsing is deliberately forgiving: a schedule arrives as a file, a
   paste from a text editor, or a paste out of Excel (which yields tabs, not
   commas). Commas, tabs, and semicolons all separate; quotes, header rows,
   and extra trailing columns are ignored. */
function parseSlate(text){
  var t=String(text||'').trim();
  var rows=[],problems=[],seen=0;
  if(t.charAt(0)==='['){
    JSON.parse(t).forEach(function(o,i){
      seen++;
      var wk=parseInt(o.week,10),ko=String(o.kickoff||'').trim();
      if(!isFinite(wk)||!ko||!o.home||!o.away){problems.push('Entry '+(i+1)+': needs week, kickoff, home, away.');return;}
      rows.push({week:wk,kickoff:ko,home:String(o.home).trim(),away:String(o.away).trim()});
    });
    return {rows:rows,problems:problems,seen:seen};
  }
  t.split(/\r?\n/).forEach(function(line,i){
    if(!line.trim())return;
    seen++;
    var p=line.split(/[,\t;]/).map(function(x){return x.trim().replace(/^"(.*)"$/,'$1').trim();})
              .filter(function(x,idx,arr){return idx<arr.length-1||x!=='';});
    if(p.length<4){problems.push('Line '+(i+1)+': found '+p.length+' column'+(p.length===1?'':'s')+', need 4.');return;}
    var wk=parseInt(p[0],10);
    /* a header row ("week, kickoff, home, away") is skipped, not an error */
    if(!isFinite(wk)){if(i===0||/week/i.test(p[0]))return;problems.push('Line '+(i+1)+': "'+p[0]+'" is not a week number.');return;}
    if(isNaN(new Date(p[1]).getTime())){problems.push('Line '+(i+1)+': "'+p[1]+'" is not a readable kickoff time.');return;}
    if(!p[2]||!p[3]){problems.push('Line '+(i+1)+': home and away are both required.');return;}
    rows.push({week:wk,kickoff:p[1],home:p[2],away:p[3]});
  });
  return {rows:rows,problems:problems,seen:seen};
}

var RES_SPORT=null,RES_SEASON=null,RES_TOKEN=0;
async function secResults(app){
  var SP=await sports();
  if(!RES_SPORT){RES_SPORT=SP[0].code;RES_SEASON=seasonFor(SP,RES_SPORT);}
  /* EVERY WEEK UP TO THE CURRENT ONE, not just the current one.

     /v1/games serves a week at a time and this screen used to read exactly
     one -- whichever week the server called current -- so an unsettled game
     from an earlier week was unreachable from the console that exists to
     settle it. That was survivable while "current" meant a 36-hour lookback,
     because the week just played was still it. It is not survivable now that
     Current rolls forward as soon as a slate is complete: a game the settle
     job could not find a final for would roll out of this screen the next
     day and stay out.

     So the head call names the current week and the sweep reads back to week
     zero. A week with nothing outstanding costs one cached, empty response. */
  var head=await api('/v1/games?sport='+encodeURIComponent(RES_SPORT)+'&season='+encodeURIComponent(RES_SEASON),{fn:'collective_public'});
  var cur=(head&&head.week!=null)?Number(head.week):null;
  var all=(head&&head.games)||[];
  if(cur!=null&&cur>0){
    var wks=[];for(var wi=0;wi<cur;wi++)wks.push(wi);
    var pages=await Promise.all(wks.map(function(w){
      return api('/v1/games?sport='+encodeURIComponent(RES_SPORT)+'&season='+encodeURIComponent(RES_SEASON)+'&week='+w,
        {fn:'collective_public'}).catch(function(){return null;});
    }));
    pages.forEach(function(pg){if(pg&&pg.games)all=all.concat(pg.games);});
  }
  /* the head payload is one of the weeks, so a game can arrive twice */
  var seenG={};
  all=all.filter(function(g){
    var k=String(g&&g.game_id);
    if(!g||seenG[k])return false;
    seenG[k]=1;return true;
  });
  var d={games:all};
  /* Unsettled past games, plus any settled 0-0: that is the shape of this
     form submitted with nothing typed in it (see settleScore), not a final,
     and the fix is to settle the game again with the real score. */
  var need=(d.games||[]).filter(function(g){return (!g.result||isPlaceholderResult(g.result))&&new Date(g.kickoff_at).getTime()<Date.now();});
  /* oldest first: the game that has been waiting longest is the one an
     operator opening this screen is looking for */
  need.sort(function(a,b){return new Date(a.kickoff_at)-new Date(b.kickoff_at);});
  var rows=need.map(function(g,i){
    return '<tr><td><b>'+esc(g.label)+'</b><br><span class="note">'+new Date(g.kickoff_at).toLocaleString()+'</span>'+
      (isPlaceholderResult(g.result)?'<br><span class="warnnote">Settled 0-0 &mdash; a placeholder, not a final. Every model on it is graded against nothing until it is settled again with the real score.</span>':'')+'</td>'+
      '<td><input id="rH'+i+'" placeholder="home"></td><td><input id="rA'+i+'" placeholder="away"></td>'+
      '<td><input id="rS'+i+'" placeholder="-2.5"></td><td><input id="rT'+i+'" placeholder="47.5"></td><td><input id="rM'+i+'" placeholder="0.62"></td>'+
      '<td id="rC'+i+'" data-g="'+esc(g.game_id)+'"><span class="note">checking&hellip;</span></td>'+
      '<td><button class="btn" data-i="'+i+'" data-g="'+esc(g.game_id)+'">Settle</button></td></tr>';
  }).join('');
  app.innerHTML='<h1>Results</h1><p class="lede">Final scores plus the closing line (home convention, negative means home favored). Settling a game grades every candidate projection on it immediately. The closing line here is the only line any pick is ever graded against.</p>'+
    '<p class="note" style="margin:-6px 0 10px">Where the Collective captured its own closing line from the odds feed, it is offered in the last column. It appears only after the market actually closed, and it is a prefill: the number you settle with is still the one in the box.</p>'+
    '<div class="grid2" style="margin-bottom:10px"><div><label>Sport</label><select id="rSport">'+sportOpts(SP,RES_SPORT)+'</select></div>'+
    '<div><label>Season</label><input id="rSeason" type="number" value="'+esc(RES_SEASON)+'"></div></div>'+
    '<div class="tblwrap"><table><thead><tr><th>Game</th><th>Home pts</th><th>Away pts</th><th>Close spread</th><th>Close total</th><th>Close home ML prob</th><th>Captured close</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="8" class="note" style="text-align:center;padding:14px">No unsettled past games for '+esc(RES_SPORT)+' '+esc(RES_SEASON)+'. Load the slate under Games first.</td></tr>')+'</tbody></table></div>';
  $('rSport').onchange=function(){RES_SPORT=this.value;RES_SEASON=seasonFor(SP,RES_SPORT);render();};
  $('rSeason').onchange=function(){RES_SEASON=+this.value||RES_SEASON;render();};

  /* The closing line the Collective captured itself, offered as a prefill.
     It is only ever offered once the market has actually closed, and the
     admin can still overwrite it: this replaces recall, not judgement. */
  if(window.MCOdds&&need.length){
    MCOdds.configure({api:API});
    /* Each lookup is async and the table can be re-rendered while they are in
       flight, so every callback checks it is still writing into the row it
       was launched for. Without the stamp, a slow response from the previous
       render lands on whatever game now occupies index i and offers one
       game's closing line as another's. */
    var stamp = (RES_TOKEN = (RES_TOKEN || 0) + 1);
    need.slice(0,30).forEach(function(g,i){
      var gameId=g.game_id;
      MCOdds.closingForGame(gameId).then(function(cl){
        if(stamp!==RES_TOKEN)return;
        var cell=$('rC'+i);
        if(!cell||cell.getAttribute('data-g')!==gameId)return;
        if(!cl||!cl.available){
          var why={no_linked_odds_event:'no odds event linked to this game',
                   market_not_closed:'market has not closed yet',
                   no_pregame_capture:'no price was captured before kickoff'}[cl&&cl.reason]||'not available';
          cell.innerHTML='<span class="note">'+esc(why)+'</span>';
          return;
        }
        /* The median of an even number of books lands on a quarter point:
           the median of -6.0 and -6.5 is -6.25. Rounding that to one decimal
           printed -6.3, which is neither what was captured nor a number any
           book offered — and this value grades every model on the game. */
        var num2=function(v){return String(Math.round(Number(v)*100)/100);};
        cell.innerHTML='<button class="btn" data-fill="'+i+'">Use captured close</button>'+
          '<div class="note" style="margin-top:3px">'+
          (cl.closing_spread!=null?'spread '+esc(num2(cl.closing_spread)):'')+
          (cl.closing_total!=null?' &middot; total '+esc(num2(cl.closing_total)):'')+
          (cl.books?' &middot; '+esc(cl.books)+' books':'')+'</div>';
        cell.querySelector('button').onclick=function(){
          if(cl.closing_spread!=null)$('rS'+i).value=num2(cl.closing_spread);
          if(cl.closing_total!=null)$('rT'+i).value=num2(cl.closing_total);
          if(cl.closing_home_ml_prob!=null)$('rM'+i).value=Number(cl.closing_home_ml_prob).toFixed(4);
          toast('Filled from the captured close');
        };
      }).catch(function(){});
    });
  }
  app.querySelectorAll('button[data-g]').forEach(function(b){
    b.onclick=async function(){
      var i=b.getAttribute('data-i');
      var hs=settleScore($('rH'+i).value),as=settleScore($('rA'+i).value);
      if(isNaN(hs)||isNaN(as)){toast('Scores required: type both final scores as whole numbers');return;}
      if(hs===0&&as===0){toast('0-0 is not a final. Type the actual score.');return;}
      var body={results:[{game_id:b.getAttribute('data-g'),home_score:hs,away_score:as,
        closing_spread:$('rS'+i).value===''?null:+$('rS'+i).value,closing_total:$('rT'+i).value===''?null:+$('rT'+i).value,
        closing_home_ml_prob:$('rM'+i).value===''?null:+$('rM'+i).value}]};
      b.disabled=true;
      try{var r=await api('/v1/admin/results',{method:'POST',headers:{'content-type':'application/json'},body:body});toast('Settled. Graded '+(r.graded||0)+' projections.');render();}
      catch(e){toast(e.message);b.disabled=false;}
    };
  });
}

/* ================= odds =================
   Operating the feed: is it current, what did the last run do, and the two
   buttons that make a change. The provider credential is never here: these
   are calls to our own functions, which hold the key server side. */
async function secOdds(app){
  app.innerHTML='<h1>Odds feed</h1><p class="lede">The Collective&#39;s own NFL market feed. One ingestion path fills it; every surface on the site reads it. Nothing on this page holds or sees the provider credential.</p><div class="panel note">Loading feed status&hellip;</div>';
  var st=null,ing=null;
  try{
    st=await api('/v1/nfl/status',{fn:'collective_odds'});
  }catch(e){ st={error:e.message}; }
  try{
    ing=await api('/v1/status',{fn:'collective_odds_ingest'});
  }catch(e){ ing={error:e.message}; }

  var run=(ing&&ing.last_run)||(st&&st.last_run)||null;
  var fresh=window.MCOdds?MCOdds.freshChip(st||{},st&&st.last_odds_at):'';
  var cad=(ing&&ing.cadence)||null;
  var prov=(ing&&ing.provider)||null;

  var health='<div class="panel"><div style="display:flex;gap:26px;flex-wrap:wrap">'+
    '<div><div class="note">Feed</div><div>'+fresh+'</div></div>'+
    '<div><div class="note">Provider</div><div>'+esc(prov?prov.name:'unknown')+
      (prov?(prov.configured
        ?' <span style="color:var(--pos)">credential present</span>'
        :' <span style="color:var(--neg)">NFL_ODDS_API_KEY not set</span>'):'')+'</div></div>'+
    '<div><div class="note">Upcoming games</div><div>'+esc(st&&st.events_upcoming!=null?st.events_upcoming:'-')+'</div></div>'+
    '<div><div class="note">Live now</div><div>'+esc(st&&st.events_live!=null?st.events_live:'-')+'</div></div>'+
    '<div><div class="note">Books current</div><div>'+esc(st&&st.books_current!=null?st.books_current:'-')+'</div></div>'+
    '<div><div class="note">Stored prices</div><div>'+esc(st&&st.snapshots_total!=null?st.snapshots_total:'-')+'</div></div>'+
    (cad?'<div><div class="note">Polling</div><div>every '+esc(cad.interval_seconds)+'s <span class="note">('+esc(cad.reason)+')</span></div></div>':'')+
    '</div>'+
    ((st&&st.error)||(ing&&ing.error)
      ? '<div class="err" style="margin-top:10px">'+esc((st&&st.error)||(ing&&ing.error))+'</div>':'')+
    '</div>';

  var lastRun=run
    ? '<h2 style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:18px">Last run</h2>'+
      '<div class="panel"><div style="display:flex;gap:22px;flex-wrap:wrap">'+
      '<div><div class="note">Status</div><div>'+esc(run.status||'-')+'</div></div>'+
      '<div><div class="note">Started</div><div>'+esc(run.started_at?rel(run.started_at):'-')+'</div></div>'+
      '<div><div class="note">Books</div><div>'+esc(run.books_ok||0)+' ok, '+esc(run.books_failed||0)+' failed</div></div>'+
      '<div><div class="note">Games</div><div>'+esc(run.events_seen||0)+' seen, '+esc(run.events_created||0)+' new</div></div>'+
      '<div><div class="note">Prices</div><div>'+esc(run.snapshots_written||0)+' written, '+esc(run.snapshots_unchanged||0)+' unchanged</div></div>'+
      '<div><div class="note">Rejected rows</div><div>'+esc(run.rows_rejected||0)+'</div></div>'+
      '</div>'+
      (run.error_message?'<div class="err" style="margin-top:10px">'+esc(run.error_code||'error')+': '+esc(run.error_message)+'</div>':'')+
      '<p class="note" style="margin:10px 0 0">Unchanged prices are not stored. A run that writes nothing usually means the market did not move, not that the run failed.</p>'+
      '</div>'
    : '<div class="panel note" style="margin-top:18px">No ingestion run has been recorded yet.</div>';

  var actions='<h2 style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:18px">Operations</h2>'+
    '<div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn" id="odProbe">Probe the provider</button>'+
    '<button class="btn" id="odRun">Run ingestion now</button>'+
    '<button class="btn" id="odClose">Close finished markets</button>'+
    '<button class="btn" id="odLink">Link games to the slate</button>'+
    '</div>'+
    '<p class="note" style="margin:10px 0 0">Probe makes one real request and reports the response <b>structure</b> plus whether our reader could map it. It never prints the credential. Running ingestion by hand bypasses the polling interval, so use it sparingly on a trial plan.</p>'+
    '<div id="odOut"></div></div>';

  app.innerHTML='<h1>Odds feed</h1><p class="lede">The Collective&#39;s own NFL market feed. One ingestion path fills it; every surface on the site reads it. Nothing on this page holds or sees the provider credential.</p>'+
    health+lastRun+actions;

  function show(title,obj,cls){
    $('odOut').innerHTML='<div class="'+(cls||'panel')+'" style="margin-top:10px"><b>'+esc(title)+'</b>'+
      '<div class="raw">'+esc(JSON.stringify(obj,null,1))+'</div></div>';
  }
  function wire(id,label,fn){
    $(id).onclick=async function(){
      var b=this;b.disabled=true;var old=b.textContent;b.textContent='Working…';
      try{ show(label,await fn()); }
      catch(e){ show(label+' failed',{error:e.message},'err'); }
      b.textContent=old;b.disabled=false;
    };
  }
  wire('odProbe','Provider probe',function(){
    return api('/v1/probe',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}});
  });
  wire('odRun','Ingestion run',function(){
    return api('/v1/ingest?force=1',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}}).then(function(r){
        setTimeout(render,600); return r;});
  });
  wire('odClose','Close markets',function(){
    return api('/v1/close',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}});
  });
  wire('odLink','Link games',function(){
    return api('/v1/link',{fn:'collective_odds_ingest',method:'POST',
      headers:{'content-type':'application/json'},body:{}});
  });
}

async function secEarnings(app){
  var d=await api('/v1/admin/earnings');
  var s=d.summary||{};
  /* The count of accounts that really hold founding status lives on the
     overview, and the divisor the payout uses lives here. Neither endpoint
     has ever seen the other's number. A failure to read the roll must not
     take the earnings screen down -- it only costs the comparison. */
  var roll=null;
  try{var ov=await api('/v1/admin/overview');roll=ov&&ov.collective&&ov.collective.founding_members;}
  catch(e){roll=null;}
  var f=founderSplit(s,roll);
  var per=pct(f.per_configured_bps);
  var rows=(d.rows||[]).map(function(r){
    return '<tr><td>'+esc(r.creator_slug)+'</td><td class="mono">'+esc(r.month)+'</td><td class="mono">'+cents(r.earned_cents)+'</td><td class="mono">'+cents(r.clawed_cents)+'</td><td class="mono">'+cents(r.paid_cents)+'</td><td class="mono">'+cents(r.balance_cents)+'</td><td class="mono">'+cents(r.available_cents)+'</td></tr>';
  }).join('');
  function line(label,val,sub){
    return '<div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border)">'+
      '<span>'+label+(sub?'<br><span class="note" style="font-size:11px">'+sub+'</span>':'')+'</span>'+
      '<span class="mono" style="font-weight:700">'+val+'</span></div>';
  }
  app.innerHTML='<h1>Collective Revenue</h1>'+
    '<p class="lede">The waterfall, computed live from the configured economics and the real subscriber count. Change a number in config and every figure here follows.</p>'+
    '<div class="grid2"><div class="panel">'+
      line('Price',cents(s.price_cents)+'<span class="note">/month</span>')+
      line('Subscribers',String(s.subscribers||0))+
      line('Monthly recurring revenue',cents(s.mrr_cents))+
      line('Operating reserve <span class="chip">'+pct(s.reserve_bps)+'</span>',cents(s.reserve_cents),'Infrastructure, data, APIs, processing')+
      line('Platform allocation <span class="chip">'+pct(s.platform_bps)+'</span>',cents(s.platform_cents),'EdgeDesk: platform, billing, hosting, development')+
      line('Founding Collective Pool <span class="chip warn">'+pct(s.founder_pool_bps)+'</span>',cents(s.pool_cents),
        'Divided equally across '+(f.configured==null?'an unset number of':f.configured)+' configured founding seat'
        +(f.configured===1?'':'s')
        +(f.actual==null?'':' \u00b7 '+f.actual+' account'+(f.actual===1?'':'s')
          +' hold'+(f.actual===1?'s':'')+' founding status')
        +(f.drift?' <b style="color:var(--warn)">\u2014 these disagree</b>':''))+
      '<div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0"><span><b>Per founding member</b></span><span class="mono" style="font-weight:700;color:var(--pos)">'+cents(s.per_founder_cents)+'</span></div>'+
    '</div><div class="panel">'+
      '<b>Founding Member Distribution</b>'+
      '<p class="note" style="margin:8px 0 0">Each founding member receives an equal share of the '+pct(s.founder_pool_bps)+' Collective founder pool.</p>'+
      '<p style="margin:10px 0 0">Current founder share: <b class="mono">'+per+'</b> of Collective revenue.</p>'+
      founderDriftHTML(f)+
      '<p class="note" style="margin:10px 0 0">Referral is a separate customer acquisition share, currently '+pct(s.referral_bps)+', and never reduces a founder&#39;s pool share.</p>'+
      (s.billing_live?'':'<p class="warnnote" style="margin:10px 0 0">Billing is not live yet: these figures stay at zero until it opens. The structure is already wired, so turning billing on changes nothing here but the numbers.</p>')+
    '</div></div>'+
    '<h2>Ledger</h2><p class="lede">Per creator per month. Net 30, $50 minimum rolls forward, 60-day clawback window.</p>'+
    '<div class="tblwrap"><table><thead><tr><th>Creator</th><th>Month</th><th>Earned</th><th>Clawed back</th><th>Paid out</th><th>Balance</th><th>Available</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="note" style="text-align:center;padding:14px">No ledger entries yet.</td></tr>')+'</tbody></table></div>';
}

render();
</script>
