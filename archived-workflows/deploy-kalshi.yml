# Deploy the Kalshi market data layer: the kalshi_sync edge function and
# (optionally) its SQL — supabase/kalshi_market_data.sql (tables, views, KPIs,
# the card) and supabase/kalshi_market_data_cron.sql (the daily discover and
# the 5-minute snapshot on pg_cron). README §Kalshi market data.
#
# MANUAL ON PURPOSE, as every deploy-*.yml here: tests first, then the function,
# then the SQL in dependency order. A report row that says CHECK THIS fails the
# job (the layer's "pending: ... tracked = true" row is not one).
#
# SECRETS (the same ones Deploy NBA injury layer uses):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF   to deploy the function
#   SB_DB_URL                                     to apply the SQL (optional;
#                                                 or paste the files into the SQL editor)
# And once, on the Supabase side (the function and pg_cron share one secret):
#   supabase secrets set KALSHI_CRON_SECRET=<a long random value>
#   select vault.create_secret('<the same value>', 'kalshi_cron_secret');
# No Kalshi key exists or is needed: the market data is public.
name: Deploy Kalshi market data

on:
  workflow_dispatch:
    inputs:
      deploy_function:
        description: 'Deploy supabase/functions/kalshi_sync (JWT verification OFF: pg_cron sends no JWT)'
        type: boolean
        default: true
      apply_sql:
        description: 'Apply kalshi_market_data.sql and kalshi_market_data_cron.sql (needs the capture tables, close_v7_parity.sql, pg_cron and pg_net)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-kalshi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # the deployed file itself is imported by the sync test (type stripping),
      # against a mocked network: what ships is what was tested
      - name: The function, the layer and the card must pass before anything ships
        env:
          KALSHI_SQL_REQUIRED: '1'
        run: |
          sudo apt-get install -y -qq postgresql >/dev/null 2>&1 || true
          node tools/kalshi/inline_identity.js --check
          node tools/kalshi/kalshi_sync.test.js
          node tools/kalshi/kalshi_sql.test.js
          node tools/kalshi/kalshi_ui.test.js

      - name: Check the credentials exist before claiming anything
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          # Presence only. No value is ever printed.
          echo "have_token=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "have_ref=$([ -n "$REF" ] && echo yes || echo no)"     >> "$GITHUB_OUTPUT"
          echo "have_db=$([ -n "$DBURL" ] && echo yes || echo no)"    >> "$GITHUB_OUTPUT"
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not set — kalshi_sync cannot be deployed from CI."; fi
          if [ -z "$DBURL" ]; then echo "::warning::SB_DB_URL is not set — paste the two SQL files into the SQL editor instead, in order."; fi

      - name: Install the Supabase CLI
        if: ${{ inputs.deploy_function && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt IS LOAD-BEARING: pg_cron sends the x-cron-secret header,
      # not a JWT. A POST without the secret is refused by the function itself.
      - name: Deploy kalshi_sync
        if: ${{ inputs.deploy_function && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy kalshi_sync \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Apply the SQL (layer, then cron)
        if: ${{ inputs.apply_sql && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          for f in supabase/kalshi_market_data.sql supabase/kalshi_market_data_cron.sql; do
            out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f")
            echo "== $f"; echo "$out" | tail -10
            if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::$f: a report row says CHECK THIS"; exit 1; fi
          done
