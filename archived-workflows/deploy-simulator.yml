# Deploy the EdgeDesk Simulator's database layer: supabase/simulator.sql, then
# the research registration supabase/simulator_registry.sql.
#
# MANUAL ON PURPOSE (workflow_dispatch). Applying SQL to production is a
# decision a person makes (docs/simulator/README.md, "Deployment sequence").
#
# IN ORDER, STOPPING AT THE FIRST PROBLEM
#   1. the SQL suite against a throwaway PostgreSQL (RLS, the premium
#      entitlement, atomic publication, immutability);
#   2. applies supabase/simulator.sql in one transaction with ON_ERROR_STOP
#      (idempotent, additive; a CHECK THIS report row fails the job);
#   3. optionally applies supabase/simulator_registry.sql (SIM-NFL-SEASON
#      v0.1.0 registered EXPERIMENTAL, T3; never promoted).
# Nothing is published here: the Simulator workflow publishes, and only for an
# ACTIVE sport. Removal: docs/simulator/README.md, "Disable and recover".
#
# SECRETS: SB_DB_URL (the pooled Postgres connection string).
name: Deploy simulator SQL

on:
  workflow_dispatch:
    inputs:
      apply_registry:
        description: 'Also register SIM-NFL-SEASON v0.1.0 (EXPERIMENTAL, T3) in the research registry'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-simulator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
      - name: Add postgres to PATH
        run: ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"
      - name: The SQL must pass against a throwaway PostgreSQL before it touches production
        env:
          SIM_SQL_REQUIRED: '1'
        run: |
          node simulator/tests/sql.test.ts
          node simulator/src/research/build_registry_sql.ts --check
          cmp supabase/simulator.sql supabase/migrations/20261023120000_simulator.sql
      - name: Check the credential exists before claiming anything
        env:
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          # presence only; no value is ever printed
          if [ -z "$DBURL" ]; then echo "::error::SB_DB_URL is not set — paste supabase/simulator.sql (then supabase/simulator_registry.sql) into the SQL editor instead"; exit 1; fi
      - name: Apply supabase/simulator.sql
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/simulator.sql 2>&1); then
            echo "$out" | tail -20; echo "::error::supabase/simulator.sql did not apply (rolled back)"; exit 1
          fi
          echo "$out" | tail -10
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/simulator.sql: a report row says CHECK THIS"; exit 1; fi
      - name: Apply supabase/simulator_registry.sql
        if: ${{ inputs.apply_registry }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/simulator_registry.sql 2>&1); then
            echo "$out" | tail -20; echo "::error::supabase/simulator_registry.sql did not apply (rolled back)"; exit 1
          fi
          echo "$out" | tail -10
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/simulator_registry.sql: a report row says CHECK THIS"; exit 1; fi
