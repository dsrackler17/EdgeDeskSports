# EdgeDesk Football — NFL injury report sync.
#
# The decision card, the publisher brief and the Full picture used to say
# "Injury and availability data is not on file" on every NFL edge. nflverse
# publishes the league's official injury report as a public, keyless CSV.
# This commits it, reduced to the latest reported week per team, to
# football/injuries/nfl_<season>.json, which the app reads beside itself.
#
# Nothing is inferred: a season nflverse has not published is committed as
# published:false and the card keeps saying the report is not on file. The
# file is rewritten only when the rows changed, so quiet days commit nothing.
#
# The source has no per-row publication time, so each run also appends every
# game designation new or changed since the last run to the append-only
# ledger football/injuries/history/nfl_<season>.jsonl, stamped with this
# run's retrieval time (EdgeDesk's first sight, never the league's time).
# Signal Center reads it. It is committed with the report below.
name: Injury sync

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (default: current, Jan/Feb -> prior year)'
        required: false
        default: ''
  schedule:
    # Every six hours: the report moves Wednesday to Saturday and on game day.
    - cron: '15 */6 * * *'

permissions:
  contents: write
  statuses: write   # the integrity-gate status a commit to main needs (tools/integrity/attest.js)

concurrency:
  group: injury-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Reduction logic must pass before it is allowed to write
        run: node football/injuries/fetch_injuries.test.js

      - name: Fetch the injury report
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            node football/injuries/fetch_injuries.js --season "${{ github.event.inputs.season }}"
          else
            node football/injuries/fetch_injuries.js
          fi

      # THE STARTER SYNC (football/nfl/starter_sync.js, docs/nfl-prior-decay/README.md):
      # the report just fetched can change who an upcoming card prices at
      # quarterback (OUT or DOUBTFUL). When any upcoming game's starter inputs
      # (schedule feed id, depth-chart QB1, the club's QB lines on the report)
      # moved since the slate was built, the slate is rebuilt now and every
      # priced-starter change is logged to football/nfl/starter_sync/. The game
      # cards follow at the next hourly game-research build (cfb-lab.yml, the
      # one writer of football/game_research/).
      - name: NFL starter sync
        run: node tools/football/nfl_starter_sync.js || echo "::warning::the starter sync could not rebuild the slate; the previous slate stands"

      # The research desk reads the report through the compact metrics
      # artifact, so it is rebuilt here and committed beside the report.
      - name: Rebuild the matchup metrics artifact
        run: node tools/football/build_matchup_metrics.js

      # The NFL identity profiles carry the report by position group.
      - name: NFL feeds for the identity build (games, team-week, player-week)
        run: node tools/football/fetch_nfl_feeds.js || true

      # Slice 4: the opener ledger captures the first number the desk sees for
      # every upcoming NFL game, so open-to-close value is graded on EdgeDesk's
      # own captures; the injury archive keeps the official report by season.
      - name: Closing-line archive and opener ledger
        run: node tools/football/build_lines_archive.js || true

      # The NFL Market Structure margin windows are read from the line archive
      # just rebuilt, so they are committed with it (as key_numbers.json is).
      # --no-pbp keeps the two-point weeks as committed; nfl-market-structure.yml
      # refreshes those daily from play-by-play.
      - name: Market structure margin windows and situational records
        run: node tools/football/build_market_structure.js --no-pbp || true

      - name: Injury archive (official report, every season)
        run: node tools/football/build_injury_archive.js || true

      # Who started each game and his passing line, for the replays' quarterback
      # layer (football/validation/pricing_nfl.json qb_layer). Past seasons stay
      # as committed; only the season in progress is read from the feed above.
      - name: Quarterback-start archive
        run: node tools/football/build_qb_starts_archive.js || true

      - name: Rebuild the team identity profiles
        run: node tools/football/build_team_identity.js

      # THE PUSH goes through the shared helper (tools/ci/push_generated.sh): the
      # starter sync can rewrite football/nfl/slate.json, which starter-context.yml
      # also publishes, and a `git pull --rebase` retry cannot survive that race.
      # The helper carries only the files this run changed onto the remote tip.
      - name: Commit the report
        env:
          # football/matchup/metrics.json is AN AGGREGATE of other jobs' files (the
          # starters, injuries, rankings, coaching): on a rejected push it is rebuilt
          # on the new tip, never carried from this run. Carried, the weekly build's
          # copy (built from 21:53's starters) replaced starter-context's at
          # 2026-10-26 00:30, and Intelligence CI's --check failed every pull request.
          PUSH_REBUILD: node tools/football/build_matchup_metrics.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # directories, not globs: an unmatched glob is passed through
          # literally and fails the whole add
          bash tools/ci/push_generated.sh "${{ github.ref_name }}" \
            'injury sync: NFL injury report from nflverse' -- \
            football/injuries/ football/matchup/metrics.json football/identity/ football/pricing/ football/validation/key_numbers.json football/market_structure/nfl.json \
            football/nfl/slate.json football/nfl/starter_sync/ football/venues/forecasts.json
