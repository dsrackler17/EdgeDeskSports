# EdgeDesk collegiate — the daily backfill slice (collegiate/run.js
# --only-backfill): past seasons' rosters and schedules the plan names, and a
# per-host slice of the box scores the held schedules link (collegiate/
# plan.json "boxscores"; 100 a host a run, SIDEARM's 30 s between reads
# waited). Each item stops being read once collegiate/data/backfill.json
# records it complete. Shares its concurrency group with the weekly run so
# the two never write collegiate/data at once.
name: Collegiate backfill (daily)

on:
  schedule:
    - cron: '17 13 * * *'         # the backup, daily 13:17 UTC (pg_cron is primary, 09:17: supabase/cbase_cron.sql)
  workflow_dispatch:
    inputs:
      force:
        description: 'read a slice even if today already had one (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  statuses: write   # the integrity-gate status a commit to main needs (tools/integrity/attest.js)

concurrency:
  group: collegiate-data          # shared with the weekly run, repository-wide
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The collector's own rules first
        run: node tools/collegiate/collegiate.test.js
      - name: Backfill slice, then the ledger
        timeout-minutes: 320
        # one slice a day: pg_cron wakes it at 09:17, and GitHub's backup does nothing if that ran
        run: node --max-old-space-size=6000 collegiate/run.js --only-backfill --skip-directory ${{ inputs.force != 'true' && '--once-a-day' || '' }}
      - name: Publish what was read (tools/ci/push_generated.sh)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -d collegiate/data ] || exit 0
          bash tools/ci/push_generated.sh "${{ github.ref_name }}" "collegiate: backfill slice" -- collegiate/data
