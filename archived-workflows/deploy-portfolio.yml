# Deploy the Portfolio database: supabase/portfolio.sql, then
# supabase/portfolio_journal.sql (the journal, the Decision Grade, the
# calendar and the Process Coach, which need the first file's tables).
#
# MANUAL ON PURPOSE (workflow_dispatch). Applying SQL to production is a
# decision a person makes. What this removes is the copy-paste of eight
# parts into the SQL editor, and the part forgotten in the middle.
#
# WHAT IT DOES, IN ORDER, STOPPING AT THE FIRST PROBLEM
#   1. the SQL suite against a throwaway PostgreSQL (tools/portfolio/
#      portfolio_sql.test.js: the file applied twice, row level security
#      attacked as another reader and as anon, every derived figure in parity
#      with the browser's engine, the import pipeline end to end);
#   2. applies supabase/portfolio.sql in ONE transaction with ON_ERROR_STOP —
#      the file is idempotent and additive, takes its tables without waiting
#      while holding any (so a reader saving a position cannot deadlock it),
#      and ends in a report; a row that reads CHECK THIS fails the run;
#   3. the same for supabase/portfolio_journal.sql (its own suite first:
#      tools/portfolio/journal_sql.test.js), in its own transaction, so a
#      problem in the journal layer never rolls back the positions layer;
#   4. the same for supabase/portfolio_connect.sql (tools/portfolio/
#      connect_sql.test.js): the platform registry, sync runs and the
#      service-only ingest. It switches NO connector on — that takes a
#      passing live smoke test (tools/portfolio/connector_smoke.js).
#   5. the same for supabase/portfolio_decision.sql (tools/portfolio/
#      decision_sql.test.js): the Decision Record — immutable snapshots, the
#      market path, reflections, outcome classes, the baseline, process
#      memory, the experiment record, Card events, export and delete.
#      Its two notices (decision_review, experiment_ready) appear once
#      supabase/personal_research.sql has been re-applied as well; until
#      then a settlement simply sends none (it is never blocked).
#   6. the same for supabase/portfolio_aggregator.sql (tools/portfolio/
#      sharpsports.test.js): the sportsbook ingest, the settlement history,
#      refresh requests, bettor references and webhook deliveries, and the
#      sharpsports registry row (OFF). SharpSports is RETIRED (2026-10-14):
#      no sportsbook sync provider runs unless SPORTSBOOK_SYNC_PROVIDER names
#      one (docs/sportsbook-sync-providers.md). It switches nothing on.
#   7. the same for supabase/portfolio_model_context.sql (tools/portfolio/
#      model_context_sql.test.js): EdgeDesk's model on a bet, only as recorded
#      before it was placed. Reads model_pnl_public (the Record P&L schema).
#   8. the same for supabase/portfolio_juicereel.sql (tools/portfolio/
#      juicereel.test.js): Juice Reel — the juicereel registry row (OFF), the
#      sealed OAuth grants, atomic refresh-token rotation and the grant-level
#      sync. It switches nothing on: reader linking takes
#      SPORTSBOOK_SYNC_PROVIDER=juicereel, Juice Reel's approval, a PASSED
#      PRODUCTION smoke test (tools/portfolio/juicereel_smoke.js) and a
#      cleared terms review (docs/juicereel.md).
#   Nothing else is written.
#
# No juicereel-webhook is deployed: Juice Reel's only webhook bucket is
# subscription events, which EdgeDesk does not use (docs/juicereel.md).
#
# AFTER IT: Supabase serves the public schema already, so the page works as
# soon as this is green. portfolio_private is deliberately NOT exposed —
# leave it out of Settings > API > Exposed schemas.
#
# SECRETS (the one the other deploy workflows already use):
#   SB_DB_URL   the pooled Postgres connection string
name: Deploy Portfolio schema

on:
  workflow_dispatch:
    inputs:
      deploy_function:
        description: 'Also deploy the portfolio_connect and sharpsports-webhook edge functions (their secrets must already be set in Supabase)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The SQL must pass against a throwaway PostgreSQL before it touches production
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: |
          sudo apt-get install -y -qq postgresql postgresql-client >/dev/null 2>&1 || true
          node tools/portfolio/portfolio_sql.test.js
          node tools/portfolio/journal_sql.test.js
          node tools/portfolio/connect_sql.test.js
          node tools/portfolio/decision_sql.test.js
          node tools/portfolio/sharpsports.test.js
          node tools/portfolio/juicereel.test.js
          node tools/portfolio/model_context_sql.test.js

      - name: Check the credential exists before claiming anything
        env:
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          # Presence only. No value is ever printed.
          if [ -z "$DBURL" ]; then echo "::error::SB_DB_URL is not set. Add it in Settings > Secrets and variables > Actions, or paste supabase/parts/portfolio.part1-of-*.sql … the last part into the SQL editor, in order."; exit 1; fi

      - name: Apply supabase/portfolio.sql (one transaction)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -16
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Apply supabase/portfolio_journal.sql (one transaction)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio_journal.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio_journal.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -14
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio_journal.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Apply supabase/portfolio_connect.sql (one transaction)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio_connect.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio_connect.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -10
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio_connect.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Apply supabase/portfolio_decision.sql (one transaction)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio_decision.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio_decision.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -12
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio_decision.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Apply supabase/portfolio_aggregator.sql (one transaction; SharpSports stays OFF)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio_aggregator.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio_aggregator.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -8
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio_aggregator.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Apply supabase/portfolio_model_context.sql (one transaction)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio_model_context.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio_model_context.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -3
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio_model_context.sql: a report row says CHECK THIS (is the Record P&L schema applied?)"; exit 1; fi

      - name: Apply supabase/portfolio_juicereel.sql (one transaction; Juice Reel stays OFF)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/portfolio_juicereel.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/portfolio_juicereel.sql did not apply (rolled back; nothing changed)"
            exit 1
          fi
          echo "$out" | tail -8
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/portfolio_juicereel.sql: a report row says CHECK THIS"; exit 1; fi

      - name: The connector core and the shipped function must pass first
        if: ${{ inputs.deploy_function }}
        run: |
          node tools/portfolio/inline_connect_core.js --check
          node tools/portfolio/connect_core.test.js
          node tools/portfolio/connect_sync.test.js
          node tools/portfolio/connect_function.test.js
          node tools/portfolio/sharpsports.test.js
          node tools/portfolio/juicereel.test.js

      - name: Install the Supabase CLI
        if: ${{ inputs.deploy_function }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy portfolio_connect (JWT verified inside; the sweep takes no identity)
        if: ${{ inputs.deploy_function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are needed to deploy a function"; exit 1; fi
          supabase functions deploy portfolio_connect --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          # The SharpSports subscriptions name THIS URL: /functions/v1/sharpsports-webhook
          # (hyphen). SharpSports sends no Supabase JWT, so verification stays off;
          # the function authenticates deliveries itself.
          supabase functions deploy sharpsports-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          # Presence only: each function's own health check names what is configured, never a value.
          curl -sS -o /tmp/pc.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/portfolio_connect" || true
          head -c 900 /tmp/pc.json; echo
          # Juice Reel: the redirect URI the function sends must be the one registered on the Juice Reel application.
          node -e "let h={};try{h=JSON.parse(require('fs').readFileSync('/tmp/pc.json','utf8'))}catch(e){};const j=(h.configured||{}).juicereel||{};console.log('sportsbook sync provider:',((h.configured||{}).sportsbook_sync||{}).provider||'none','· juicereel ready:',!!j.ready,'· redirect URI:',j.redirect_uri)"
          code=$(curl -sS -o /tmp/hook.json -w '%{http_code}' "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/sharpsports-webhook")
          head -c 400 /tmp/hook.json; echo
          if [ "$code" != "200" ]; then echo "::error::sharpsports-webhook answered $code to its health check (404 = not deployed under that name; 401 = JWT verification is on)"; exit 1; fi
