# EdgeDesk — the NBA engine (docs/engine/NBA.md).
#
#   tests     on every pull request and push that touches this work: the NBA
#             engine offline (ingest parser, lineups, distribution, markets,
#             learners, ledger, quotes, desk, loader; the NBA Data Pack's
#             verification and reconciliation reproduce, a tampered copy
#             fails), the committed record and
#             slate checks, the warehouse contract and the odds row on a
#             throwaway PostgreSQL, the navigation and sports list, the no-bypass
#             guard, and the panel in Chromium (desktop + 390 px).
#   build     every three hours: ingest the season in progress (sportsdataverse
#             hoopR, public, keyless), rebuild lineups, price the slate and the
#             props, grade the ledger, and commit only on change.
#             NBA book prices are requested ONLY when the repository variable
#             NBA_PRICES is "on" AND the gateway row basketball_nba is enabled
#             (supabase/nba_odds_sport.sql creates it disabled). Default spend: 0.
#             The Supabase copy (nbahist) is written ONLY when NBA_SUPABASE is
#             "on" and the service-role secrets exist.
#   validate  weekly (Wednesday, 12:37 UTC): ingest every season (cached),
#             rerun the SEALED walk-forward (selection window; the test window
#             is never unsealed by a scheduled job), the props record, refit the
#             live parameters, rebuild the slate, and commit only if the checks
#             pass on the new record.
# The scheduled jobs run from their own workflows (nba-build.yml, nba-validate.yml),
# so a pull request or a push lists only the tests here, never a Skipped job.
name: NBA engine
run-name: NBA engine · ${{ github.event_name }}

on:
  pull_request:
    paths:
      - 'nba/**'
      - 'lib/edgedesk_nba_ui.js'
      - 'lib/edgedesk_nba.css'
      - 'lib/edgedesk_sports.js'
      - 'tools/nba/**'
      - 'supabase/nba_engine.sql'
      - 'supabase/nba_odds_sport.sql'
      - 'supabase/functions/edgedesk_ai/index.ts'
      - 'app.html'
      - 'datapack/nba_v1/**'
      - 'tools/datapack/verify_nba.js'
      - '.github/workflows/nba.yml'
      - '.github/workflows/nba-validate.yml'
      - '.github/workflows/nba-build.yml'
  push:
    branches: [main]
    paths:
      - 'nba/**'
      - 'lib/edgedesk_nba_ui.js'
      - 'tools/nba/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyarrow (the NBA Data Pack is Parquet; read by nba/tools/parquet_select.py)
        run: pip install --quiet pyarrow
      - name: Rebuild the 2025-26 work tables the tests read (player games, stints, shots — rebuilt, never committed; ≈30 MB public parquet)
        run: node --max-old-space-size=6144 nba/ingest/season.js --season 2026
      - name: The NBA engine offline (parsers, lineups, distribution, markets, learners, ledger, quotes, desk, loader, the data pack's verification, reconciliation and tamper test)
        run: node tools/nba/nba.test.js
      - name: The NBA on the desk (module and the real edge handler, no model)
        run: node tools/nba/nba_desk.test.js
      - name: The committed record, props record and slate pass their checks
        run: node nba/model/walkforward.js --check && node nba/props/walkforward.js --check && node nba/build_slate.js --check
      - name: The warehouse contract and the NBA odds row on a real PostgreSQL (disabled until authorised)
        env: { NBA_SQL_REQUIRED: '1' }
        run: node tools/nba/nba_sql.test.js
      - name: No path around the odds gateway; the navigation and the sports list name the NBA
        run: node tools/odds/no_bypass.test.js && node tools/app/navigation.test.js && node tools/app/sports_config.test.js && node tools/presentation/presentation_sync.test.js
      - name: Install Chromium for the panel
        continue-on-error: true
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: The NBA panel in Chromium, desktop and a 390 px phone
        run: node tools/nba/nba_ui.e2e.js
