# EdgeDesk Tennis — the research record.
#
# WHAT THIS WORKFLOW OWNS, and what it deliberately does not.
#
# tennis-sync.yml and tennis-live.yml own the PROVIDER layer: the draw, the
# scoreboard, identity, the live match centre. Neither is touched here. This
# one owns the RESEARCH RECORD — the historical match archive, the point-in-time
# features, the rating layer, the model registry, the priced board and the
# published record — and it is the only tennis workflow that needs a DIRECT
# database connection.
#
# WHY A DIRECT CONNECTION. The feature and rating builders are set-based SQL
# over hundreds of thousands of rows. Pushing that through PostgREST would be
# tens of thousands of round trips, and an Edge Function has neither the memory
# nor the wall clock for it. So these jobs speak psql.
#
# NO NEW SECRET. The credential is SB_DB_URL, which this repository already
# holds and which deploy-intelligence.yml already uses to apply SQL migrations —
# the same kind of credential for the same kind of use. It is passed to the
# tools under the name SUPABASE_DB_URL, which is what Supabase's own docs call
# it and what tools/tennis/lib/pg.js reads. It is read by the runner and by
# nothing else; no browser, no Edge Function and no committed file ever sees it,
# and tools/tennis/lib/pg.js redacts it from every error it raises.
#
# THE HISTORICAL BACKFILL IS NOT HERE ON PURPOSE. Importing 361,571 matches is
# a one-off administrative act against a licence-restricted archive, and it is
# run by a person who has read docs/tennis-architecture.md, with
# `npm run tennis:record:import`. Putting it on a schedule would make an
# accidental re-import of a non-commercial dataset a cron away.
#
# EVERY JOB IS SAFE TO RE-RUN. The features and ratings are recomputed from the
# record; the board appends a prediction only where the model, the ratings and
# a market snapshot all exist; settlement refuses to touch an already-settled
# row; and the monitor writes nothing at all.
name: Tennis record

on:
  schedule:
    # nightly: rebuild the point-in-time features and the rating layer, in that
    # order, because the ratings read the features
    - cron: '35 5 * * *'
    # every two hours through the tennis day: price the board and settle what
    # finished. Deliberately not every 20 minutes — a rating layer rebuilt
    # nightly does not move in between, so a faster board would republish the
    # same number under a new timestamp and make the record look busier than it is.
    - cron: '15 */2 * * *'
    # weekly: the venue and weather backfill, and the model's calibration review
    - cron: '20 7 * * 1'
    # hourly: the monitor. Reads, never writes.
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        options: [features, ratings, lab, brief, board, settle, incremental, weather, model, monitor, all]
        required: true
        default: monitor
      commit:
        description: 'Write to the database. Unchecked is a dry run that says what it would do.'
        type: boolean
        required: false
        default: false

concurrency:
  # The feature builder and the rating builder write the same rows. Two runs
  # racing would not corrupt anything (every write is an upsert) but the second
  # would read a half-rebuilt layer, so they queue.
  group: tennis-record
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # WHY THIS IS ITS OWN JOB, and not two more steps in the one below.
  #
  # Both guards used to live in the record job, and neither one guarded
  # anything. A step in GitHub Actions is implicitly `if: success()` — but only
  # while it has no `if:` of its own. Every step below carries one, to select
  # the job this run is, and an explicit `if:` REPLACES the implicit
  # success(), so a failed guard stopped nothing: the run went on to the
  # feature builder, the settler and the monitor, and each one threw the raw
  # psql error the guard had just explained in plain words. Run 5 is the
  # receipt — seven lines of guidance followed by the stack traces they were
  # written to replace, eleven annotations where there had been seven.
  #
  # A separate job cannot be bypassed that way. `needs:` is not a condition on
  # a step, so nothing in the record job runs unless this one passed, and a
  # step added later is gated whether or not whoever adds it remembers to be
  # careful. That is the difference between a rule and a habit.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -eo pipefail {0}
    outputs:
      job: ${{ steps.pick.outputs.job }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # The engine's own rules before anything is written: the null rule, the
      # draw-slot identity, the research gates, and the mechanical assertion
      # that no model input names a post-match column.
      - name: The record engine's rules must pass before anything is written
        run: |
          node tools/tennis/model.test.js
          node tools/tennis/providers.test.js
          node tools/tennis/ai_tennis.test.js
          node tools/tennis/lab.test.js

      - name: Decide which job this run is
        id: pick
        run: |
          JOB="${{ inputs.job }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "35 5 * * *")   JOB=nightly ;;
              "15 */2 * * *") JOB=board ;;
              "20 7 * * 1")   JOB=weekly ;;
              "50 * * * *")   JOB=monitor ;;
              *)              JOB=monitor ;;
            esac
          fi
          if [ -z "$JOB" ]; then JOB=monitor; fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "This run is: $JOB"

      - name: Refuse to run without a database connection
        if: ${{ success() && steps.pick.outputs.job != 'none' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SB_DB_URL is not set. The record jobs need a direct connection"
            echo "::error::(Supabase > Connect > Session pooler), the same secret deploy-intelligence.yml"
            echo "::error::uses to apply migrations. Nothing was read and nothing was written."
            exit 1
          fi
          echo "A database connection is configured. The value is never printed."

      # THE CONTRACT HAS TO BE INSTALLED, AND FOR EVERY RUN SO FAR IT WAS NOT.
      #
      # supabase/tennis_record.sql has been in this repository, proven against a
      # throwaway PostgreSQL by games-sql.yml and read by every tool below,
      # since the record shipped — but NO WORKFLOW EVER APPLIED IT. games-sql.yml
      # only proves the file CAN be applied; deploy-intelligence.yml, the one
      # job that speaks to production with psql, knew about three migrations and
      # not this one. So the schema existed in git and nowhere else, and all
      # four Tennis record runs died the same way:
      #
      #     ERROR:  relation "tennis.ingestion_runs" does not exist
      #     ERROR:  relation "tennis.prediction_record" does not exist
      #
      # — three raw psql stack traces that read like a code fault and were not
      # one. deploy-intelligence.yml now carries apply_tennis_record and
      # apply_tennis_lab; this step is what tells an operator to use them,
      # once, instead of leaving the answer in a stack trace.
      - name: Refuse to run without the record contract installed
        if: ${{ success() && steps.pick.outputs.job != 'none' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: |
          MISSING=$(psql "$SUPABASE_DB_URL" -tAX -v ON_ERROR_STOP=1 -c "
            select coalesce(string_agg(t, ', ' order by t), '') from unnest(array[
              'tennis.data_quality_issues', 'tennis.ingestion_runs', 'tennis.matches', 'tennis.meta',
              'tennis.model_predictions', 'tennis.model_registry', 'tennis.odds_snapshots', 'tennis.player_match_features',
              'tennis.player_ratings_current', 'tennis.players', 'tennis.prediction_record', 'tennis.rankings_current',
              'tennis.research_opportunities', 'tennis.source_licenses', 'tennis.stg_archive_matches', 'tennis.tournaments',
              'tennis.venues', 'tennis.weather_observations', 'tennis.live_matches'
            ]) t where to_regclass(t) is null;")
          # A RELATION THAT EXISTS IS NOT THE SAME AS A RELATION THAT MATCHES,
          # and checking only the first is how a repair turned into a raw psql
          # error halfway through a migration. On 2026-09-20 an apply of
          # supabase/tennis_record.sql against production stopped at
          #
          #     NOTICE:  relation "players" already exists, skipping
          #     ERROR:   column "name_norm" does not exist
          #
          # tennis.players PREDATES this contract. `create table if not exists`
          # skipped it, and the very next statement — an index on name_norm —
          # assumed the columns the file would have created. psql runs a -f
          # script statement by statement, so everything before that line had
          # already committed and the database was left further in than it
          # started and still broken. The list above would have called that
          # database fully installed the moment the last table appeared.
          #
          # So the shape is checked too, against the columns the contract's OWN
          # indexes and constraints stand on: if one of those is absent, the
          # apply WILL stop there, and it is better said here than discovered
          # mid-migration.
          # The columns asked for here are the ones the contract's indexes and
          # constraints stand on AND that the file does not add itself. The
          # tournaments block is deliberately short: tennis.tournaments belongs
          # to the live centre, and tennis_record.sql brings it up to the
          # contract with `alter table ... add column if not exists` before it
          # indexes anything, so season/venue_id/latitude and the rest are NOT
          # a conflict there and must not be reported as one.
          SHAPE=$(psql "$SUPABASE_DB_URL" -tAX -v ON_ERROR_STOP=1 -c "
            with required(tbl, col) as (values
              ('players','name_norm'), ('players','tour'), ('players','last_match'), ('players','player_uuid'),
              ('matches','tour'), ('matches','match_date'), ('matches','tournament_id'), ('matches','round_order'),
              ('matches','winner_id'), ('matches','loser_id'), ('matches','surface'), ('matches','season'),
              ('matches','source_match_uid'),
              ('tournaments','tour'), ('tournaments','provider'), ('tournaments','start_date'), ('tournaments','surface'),
              ('rankings_current','tour'), ('rankings_current','rank'),
              ('venues','venue_name'), ('venues','latitude'), ('venues','longitude')
            )
            select coalesce(string_agg('tennis.' || r.tbl || '.' || r.col, ', ' order by r.tbl, r.col), '')
            from required r
            where to_regclass('tennis.' || r.tbl) is not null
              and not exists (
                select 1 from pg_attribute a
                where a.attrelid = to_regclass('tennis.' || r.tbl)
                  and a.attname = r.col and a.attnum > 0 and not a.attisdropped);")

          # AND A NAME THAT IS TAKEN BY SOMETHING THAT IS NOT A TABLE. A view
          # answers to_regclass, so the relation check above calls it present;
          # `create table if not exists` then skips it and the first index on
          # it fails with "is not a table". Same class of fault as a missing
          # column, same remedy, and invisible to a check that only asks
          # whether the name resolves.
          KIND=$(psql "$SUPABASE_DB_URL" -tAX -v ON_ERROR_STOP=1 -c "
            select coalesce(string_agg('tennis.' || t || ' is a '
                     || case c.relkind when 'v' then 'view' when 'm' then 'materialized view'
                                       when 'f' then 'foreign table' when 'p' then 'partitioned table'
                                       else c.relkind::text end, ', ' order by t), '')
            from unnest(array['meta','source_licenses','ingestion_runs','data_quality_issues',
                              'stg_archive_matches','players','venues','tournaments','matches',
                              'player_match_features','player_ratings_current','rankings_current',
                              'weather_observations','odds_snapshots','model_registry',
                              'model_predictions','research_opportunities','prediction_record']) t
            join pg_class c on c.oid = to_regclass('tennis.' || t)
            where c.relkind <> 'r';")
          if [ -n "$KIND" ]; then SHAPE="${SHAPE:+$SHAPE; }$KIND, where this contract needs an ordinary table"; fi

          if [ -n "$MISSING" ] || [ -n "$SHAPE" ]; then
            if [ -n "$MISSING" ]; then
              echo "::error::the tennis contract is incomplete on this database."
              echo "::error::missing: $MISSING"
            fi
            if [ -n "$SHAPE" ]; then
              echo "::error::a tennis relation EXISTS but does not match this contract."
              echo "::error::absent columns: $SHAPE"
              echo "::error::That table predates supabase/tennis_record.sql, so applying the file"
              echo "::error::will NOT repair it: create-table-if-not-exists skips the table and the"
              echo "::error::next index fails on the missing column, part-applied. The table has to"
              echo "::error::be reconciled with the contract — or dropped, if it holds nothing worth"
              echo "::error::keeping — before the apply can run to the end."
              echo "::error::What is actually there:"
              # tables AND views: a view is invisible to a relkind='r' listing,
              # and a view holding a name this contract needs as a table is
              # exactly one of the conflicts being reported. Anything that
              # DEPENDS on a relation is listed too, because a dependent view is
              # what stops that relation being replaced.
              psql "$SUPABASE_DB_URL" -tAX -c "
                select '  tennis.' || c.relname
                     || ' [' || case c.relkind when 'r' then 'table' when 'v' then 'VIEW'
                                                when 'm' then 'MATVIEW' else c.relkind::text end || ']'
                     || case when c.relkind = 'r'
                             then '  rows~' || coalesce((select s.n_live_tup from pg_stat_user_tables s where s.relid = c.oid)::text, '?')
                             else '' end
                     || coalesce('  depended on by: ' || (
                          select string_agg(distinct dv.relname, ', ')
                          from pg_depend d join pg_rewrite rw on rw.oid = d.objid
                            join pg_class dv on dv.oid = rw.ev_class
                          where d.refobjid = c.oid and d.classid = 'pg_rewrite'::regclass and dv.oid <> c.oid), '')
                     || '  cols: ' || (select string_agg(a.attname, ',' order by a.attnum) from pg_attribute a
                                        where a.attrelid = c.oid and a.attnum > 0 and not a.attisdropped)
                from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'tennis' and c.relkind in ('r','v','m') order by c.relkind, c.relname;" || true
            fi
            if [ -z "$SHAPE" ]; then
              echo "::error::Apply it from the Deploy intelligence workflow, in this order:"
              echo "::error::  apply_tennis_live_center -> apply_tennis_record -> apply_tennis_lab"
              echo "::error::Every file is idempotent over a database whose tables it created"
              echo "::error::itself — it creates what is absent and leaves what is present alone —"
              echo "::error::so running it over a PARTIAL install is the right repair, and running"
              echo "::error::it twice is safe."
            fi
            echo "::error::Nothing was read and nothing was written."
            exit 1
          fi
          echo "The tennis contract is installed. Every relation these jobs read is present,"
          echo "and each one carries the columns the contract's own indexes stand on."

      # A CONTRACT THAT IS INSTALLED IS NOT A RECORD THAT HOLDS ANYTHING.
      #
      # Every check above proves the relations exist and carry the columns this
      # contract's indexes stand on. Not one of them asks whether a single match
      # is on file. On 2026-09-21 none was: the archive import is a one-off
      # administrative act (docs/runbooks/tennis-import.md) and it had never run
      # against this database. Against an installed-but-empty record the steps
      # below do this:
      #
      #   build_features   exit 0    wrote nothing
      #   build_ratings    exit 0    "no rated players: the record is empty"
      #   build_history    exit 0    "no point-in-time features on file"
      #   build_lab        exit 0    "no rated players on file"
      #   build_brief      exit 0    "nothing on file to write about yet"
      #   build_model      exit 1    "only 0 usable matches"
      #   price_board      exit 1    "no ACTIVE tennis model is registered"
      #
      # So `nightly` reported SUCCESS over an empty record while `board` and
      # `weekly` went red on two different late errors, neither naming the
      # cause — which is exactly the intermittent red this workflow has shown
      # for days. Five of the seven steps exiting 0 is the worse half: a job
      # that produced nothing must never report success, and the absence of a
      # signal is indistinguishable from a passing one.
      #
      # The counts are printed on EVERY run, so "what is actually on file" is a
      # line in the log rather than something to go and ask the database.
      - name: Refuse to run on an empty record
        if: ${{ success() && steps.pick.outputs.job != 'none' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: |
          COUNTS=$(psql "$SUPABASE_DB_URL" -tAX -F'|' -v ON_ERROR_STOP=1 -c "
            select (select count(*) from tennis.matches),
                   (select count(*) from tennis.players),
                   (select count(*) from tennis.player_match_features),
                   (select count(*) from tennis.player_ratings_current),
                   (select count(*) from tennis.model_registry where status = 'active');")
          MATCHES=$(echo "$COUNTS" | cut -d'|' -f1)
          PLAYERS=$(echo "$COUNTS" | cut -d'|' -f2)
          FEATURES=$(echo "$COUNTS" | cut -d'|' -f3)
          RATED=$(echo "$COUNTS" | cut -d'|' -f4)
          ACTIVE=$(echo "$COUNTS" | cut -d'|' -f5)
          echo "On file: ${MATCHES} match(es), ${PLAYERS} player(s), ${FEATURES} feature row(s),"
          echo "         ${RATED} rated player(s), ${ACTIVE} active model(s)."

          # The monitor only reads and reports, and an empty record is exactly
          # the thing worth reporting, so it is never refused.
          if [ "${MATCHES:-0}" -eq 0 ] && [ "${{ steps.pick.outputs.job }}" != "monitor" ]; then
            echo "::error::the tennis record is EMPTY — 0 matches on file."
            echo "::error::The contract is installed correctly; it has simply never been loaded."
            echo "::error::Nothing this job runs can produce a rating, a model, a board or a brief"
            echo "::error::from an empty record, so it is refused here rather than six steps in."
            echo "::error::"
            echo "::error::The historical backfill is NOT on any schedule. It is a one-off"
            echo "::error::administrative act against a CC BY-NC-SA archive, run by hand — see"
            echo "::error::docs/runbooks/tennis-import.md:"
            echo "::error::"
            echo "::error::  npm run tennis:record:verify -- --manifest 00_manifest.json --dir ./parts"
            echo "::error::  npm run tennis:record:import  -- --manifest 00_manifest.json --dir ./parts --chunk 20000 --fast"
            echo "::error::  npm run tennis:features:build && npm run tennis:ratings:build"
            echo "::error::  npm run tennis:model:build   && npm run tennis:board:build"
            echo "::error::"
            echo "::error::Nothing was read and nothing was written."
            exit 1
          fi

          if [ "${MATCHES:-0}" -eq 0 ]; then
            echo "::warning::the tennis record is empty — 0 matches on file. The monitor runs anyway;"
            echo "::warning::every other job on this workflow is refused until the archive is imported."
          fi

  record:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client


      # ── NIGHTLY ────────────────────────────────────────────────────────────
      # Features first, then ratings: the rating layer reads the feature rows,
      # so the reverse order would rate players against yesterday's features and
      # nothing would say so.
      - name: Rebuild the point-in-time features
        if: ${{ needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'features' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/build_features.js ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}

      - name: Rebuild the rating layer
        if: ${{ needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'ratings' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/build_ratings.js ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}

      - name: Refresh the official rankings from the provider
        if: ${{ needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/incremental.js rankings ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
          || echo "::warning::the ranking refresh did not complete — the cursor did not advance and the next run re-reads this window"

      # ── THE TENNIS LAB ─────────────────────────────────────────────────────
      # ORDER MATTERS AND IS NOT ARBITRARY. The history snapshot is what the
      # 30- and 90-day rating deltas are measured AGAINST, so it is written
      # before the signals that read it; run the other way round, every delta
      # would be null on the first night and silently stale afterwards.
      #
      # Both are separate from the rating build above on purpose: that query is
      # the one that once took nine minutes and now takes seventeen seconds, and
      # bolting eight more aggregates onto it would put that back at risk. A
      # failure here leaves the ratings intact and the Lab degraded, rather than
      # the whole record broken.
      - name: Snapshot the rating history
        if: ${{ needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'lab' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/build_history.js ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
          || echo "::warning::the rating history did not rebuild — trajectory deltas will be stale until it does"

      - name: Rebuild the Lab's derived signals
        if: ${{ needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'lab' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/build_lab.js ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}

      # The daily research brief. It needs NO sportsbook and NO schedule: with
      # neither it falls back to a trends or record brief and says so in its own
      # header rather than presenting one as a preview of today's play. So this
      # step has no provider precondition and is expected to succeed on a
      # project that has never had an odds feed.
      - name: Generate the research brief
        if: ${{ needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'brief' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/build_brief.js --all ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}

      # ── THE BOARD ──────────────────────────────────────────────────────────
      # Results before prices: a match that finished should be settled before the
      # board is rebuilt, so a finished match does not reappear as researchable.
      - name: Take in results and recompute what they affect
        if: ${{ needs.preflight.outputs.job == 'board' || needs.preflight.outputs.job == 'incremental' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/incremental.js results ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
          || echo "::warning::the incremental results job failed; the cursor did not advance"

      - name: Settle the published record
        if: ${{ needs.preflight.outputs.job == 'board' || needs.preflight.outputs.job == 'settle' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/settle_record.js ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}

      - name: Price the research board
        if: ${{ needs.preflight.outputs.job == 'board' || needs.preflight.outputs.job == 'all' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/price_board.js ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}

      # ── WEEKLY ─────────────────────────────────────────────────────────────
      - name: Back-fill venue weather
        if: ${{ needs.preflight.outputs.job == 'weekly' || needs.preflight.outputs.job == 'weather' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: |
          echo "Weather back-fill is INDOOR-EXCLUDED and OUTDOOR-CONFIDENT-ONLY by construction"
          echo "(tools/tennis/providers/open_meteo_weather.js). The free Open-Meteo tier is"
          echo "NON-COMMERCIAL: set OPEN_METEO_API_KEY and register a commercial licence row"
          echo "in tennis.source_licenses before weather reaches a paid surface."
          node -e "const w=require('./tools/tennis/providers/open_meteo_weather.js');console.log(JSON.stringify(w.describe(),null,1))"

      # A calibration review, not a retrain. A new model version is a deliberate
      # act by a person: build_model.js registers a CANDIDATE and refuses to move
      # production unless it beats the active model and the obvious baselines
      # without a calibration failure. This run only reports where the active one
      # stands, so a drift is seen before it is argued about.
      - name: Review the active model's calibration
        if: ${{ needs.preflight.outputs.job == 'weekly' || needs.preflight.outputs.job == 'model' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: node tools/tennis/build_model.js

      # ── THE MONITOR ────────────────────────────────────────────────────────
      # Reads, never writes. A failed ingestion that nobody sees is the same as
      # no ingestion at all, so this is the job that makes a silent failure loud.
      - name: Report ingestion health
        if: ${{ always() && (needs.preflight.outputs.job == 'monitor' || needs.preflight.outputs.job == 'all' || needs.preflight.outputs.job == 'nightly' || needs.preflight.outputs.job == 'board') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SB_DB_URL }}
        run: |
          node tools/tennis/incremental.js --status | tee status.log
          if grep -qE '\|\s*NO\b|status.*error' status.log; then
            echo "::warning::a tennis ingestion run did not reconcile or ended in error — see the status table above"
          fi
          if grep -q 'has not succeeded since' status.log; then
            echo "::warning::a tennis job has not succeeded in over two days"
          fi

      - name: Say what this run did
        if: ${{ always() }}
        run: |
          echo "job: ${{ needs.preflight.outputs.job }}"
          echo "writes: ${{ (github.event_name == 'schedule' || inputs.commit) && 'yes' || 'no (dry run)' }}"
          echo ""
          echo "The historical backfill is NOT on this schedule. It is a one-off"
          echo "administrative act against a CC BY-NC-SA archive and is run by hand:"
          echo "  npm run tennis:record:import -- --file <archive.csv.gz> --fast"
