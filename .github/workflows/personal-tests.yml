# EdgeDesk — the checks that gate every change to the personal research
# terminal and the growth layer on top of it: the watchlist, alerts, journal
# and Compare My Number, research cards, personas, the partner program and
# its campaigns, trial activation, acquisition attribution and public samples.
#
#   suites      the libraries, the job's database pass (in-memory PostgREST),
#               the page wiring, the AI desk's personal answers — offline.
#   migrations  supabase/personal_research.sql, affiliates.sql and growth.sql
#               applied TWICE to a real PostgreSQL on the runner's own
#               throwaway cluster, and attacked as other readers, as anon and
#               as the service role.
#
# The browser suites (tools/personal/personal_ui.e2e.js and
# tools/growth/admin_growth_login.e2e.js, tools/growth/outbound_console.e2e.js,
# tools/growth/outbound_stop_page.e2e.js)
# need Playwright and are run by hand: npm run personal:e2e, npm run growth:e2e.
# Nothing here deploys or writes.
name: Personal research CI

on:
  pull_request:
    paths:
      - 'lib/edgedesk_personal*.js'
      - 'lib/edgedesk_personal.css'
      - 'lib/edgedesk_share_card.js'
      - 'lib/edgedesk_pricing.js'
      - 'tools/billing/**'
      - 'terms.html'
      - 'lib/research_core.js'
      - 'supabase/personal_research.sql'
      - 'supabase/bettor_decisions.sql'
      - 'supabase/bankroll_and_stakes.sql'
      - 'lib/edgedesk_decision*.js'
      - 'lib/edgedesk_vocab.js'
      - 'lib/edgedesk_bankroll.js'
      - 'tools/bettor/**'
      - 'supabase/affiliates.sql'
      - 'supabase/growth.sql'
      - 'supabase/billing.sql'
      - 'supabase/stripe_webhook.sql'
      - 'supabase/referral_codes.sql'
      - 'supabase/billing_hardening.sql'
      - 'supabase/billing_reconcile_cron.sql'
      - 'supabase/billing_preflight.sql'
      - 'supabase/billing_snapshot.sql'
      - 'supabase/billing_postflight.sql'
      - '.github/workflows/deploy-billing.yml'
      - 'supabase/subscription_price.sql'
      - 'supabase/community_posts.sql'
      - 'supabase/funnel.sql'
      - 'supabase/functions/stripe_webhook/**'
      - 'supabase/functions/create_checkout_session/**'
      - 'supabase/functions/sync_subscription/**'
      - 'lib/edgedesk_access.js'
      - 'admin/billing/**'
      - 'supabase/functions/edgedesk_ai/_mine.js'
      - 'tools/personal/**'
      - 'supabase/functions/research_cron/**'
      - 'supabase/research_state_cron.sql'
      - '.github/workflows/research-state.yml'
      - '.github/workflows/deploy-research-cron.yml'
      - 'lib/edgedesk_home.js'
      - 'research/sample/**'
      - 'admin/growth/**'
      - 'lib/edgedesk_admin_session.js'
      - 'lib/edgedesk_auth.js'
      - 'tools/growth/**'
      - 'tools/cfb/secret_audit.js'
      - 'supabase/growth_outbound.sql'
      - 'supabase/growth_outbound_cron.sql'
      - 'supabase/functions/growth_outbound_send/**'
      - 'supabase/functions/growth_outbound_webhook/**'
      - 'supabase/functions/growth_outbound_optout/**'
      - 'supabase/functions/growth_outbound_research/**'
      - 'supabase/functions/growth_outbound_draft/**'
      - 'supabase/functions/growth_outbound_digest/**'
      - 'supabase/functions/newsletter/**'
      - 'email/stop/**'
      - '.github/workflows/deploy-growth-outbound.yml'
      - 'admin/affiliates/**'
      - 'index.html'
      - 'app.html'
      - 'package.json'
      - '.github/workflows/personal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Alerts, Top 5, journal grading, CLV and the job's database pass
        run: node tools/personal/personal.test.js
      - name: One source for the offer, the books, the page wiring, no tout language
        run: node tools/personal/personal_wiring.test.js
      # research_cron is research-state.yml's primary scheduler; this imports
      # the deployed file and replays whole days against the landing page's
      # own freshness windows.
      - name: The research-state scheduler dispatches on cadence, never stampedes, keeps game lines on the board
        run: node tools/personal/research_cron.test.js
      # The offer's other half: what Stripe is asked about the payment links
      # (every wrong price, mode and trial must fail), and the paywall,
      # settings card and checkout agreeing on who has already paid.
      - name: The Stripe offer verifier fails every link that sells something else
        run: node tools/billing/verify_stripe_offer.test.js
      - name: A comped account is paid; the paywall, settings and checkout agree
        run: node tools/billing/comp_entitlement.test.js
      - name: The Stripe webhook grants access by status, never by price
        run: node tools/billing/stripe_webhook.test.js
      - name: A subscriber's life through the real webhook and paywall, on either price
        run: node tools/billing/subscriber_lifecycle.test.js
      # The billing core is copied into three single-file Edge Functions; every
      # copy must be byte-identical, and its pieces (which subscription a row
      # describes, Stripe retries and deadlines, what a log line may carry) hold.
      - name: One billing core in three functions, and what it decides
        run: node tools/billing/billing_core.test.js
      - name: The browser asks the database for access, never decides it, and gives up boundedly
        run: node tools/billing/access_client.test.js
      - name: The billing console puts every account in exactly one of five verdicts
        run: node tools/billing/admin_console.test.js
      - name: Compare My Number, research cards, personas, creator offers, trial actions, public samples
        run: node tools/personal/growth.test.js
      # /admin/growth/ used to present an hour-old token forever and report the
      # 401 as "not an operator". The console's session: refresh before expiry,
      # one refresh and one retry on a 401, a refused refresh ends the session in
      # words, single-flight across loaders and tabs, never the anon key.
      - name: The operator console's session refreshes, retries once, and never loops or leaks a token
        run: node tools/growth/admin_session.test.js
      # The check every privileged outbound Edge Function runs first: GoTrue
      # must accept the token, then the database — asked as the caller — must
      # answer exactly true; every other answer, and every failure, refuses.
      - name: The outbound Edge Functions' owner check refuses everything but a verified owner
        run: node tools/growth/outbound_auth.test.js
      # The deployed send function itself, against a mocked GoTrue, PostgREST and
      # Resend: owner first, claim before send, one key per draft, no second send.
      - name: The send function sends only a claimed, approved draft, once, as the owner
        run: node tools/growth/outbound_send.test.js
      # The webhook relay and the opt-out endpoint hold no secret; the database
      # checks Resend's signature. A GET never opts anybody out. The
      # newsletter's webhook keeps nothing about an outbound email.
      - name: The webhook relays only signed deliveries, the opt-out link changes nothing on a GET, and the newsletter ignores outbound email
        run: node tools/growth/outbound_events.test.js
      - name: The AI desk answers the reader's research from their own rows
        run: node tools/intelligence/mine.test.js
      - name: The bettor decision layer (engine, tracks, bankroll, renderers) and placed-bet grading
        run: node tools/bettor/decision.test.js
      - name: The unified football decision engine (NFL and CFB)
        run: node tools/bettor/football_decision.test.js
      - name: One meaning per state (market state, research vs decision, raw vs calibrated EV, exposure, beginner mode)
        run: node tools/bettor/consistency.test.js

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The runner image ships PostgreSQL; each suite starts its own throwaway
      # cluster, applies its migrations twice, and tears it down.
      # Billing hardening: the one access rule, the one writer, and the
      # migration applied over production-shaped data (hand-made rows, comps,
      # duplicates, deliveries that never resolved) without changing a row.
      - name: Billing hardening installs over production's shape; one rule, one writer
        run: node tools/billing/billing_hardening_sql.test.js
      # Every way a checkout can go — wallets, closed tabs, late, duplicate and
      # out-of-order webhooks, Stripe and database failures, duplicates, comps —
      # through the three shipped Edge Functions against the real SQL.
      - name: Every checkout converges between Stripe and EdgeDesk
        run: node tools/billing/billing_flow.test.js
      # The deployment's own safety checks: the read-only preflight, the snapshot,
      # the one-transaction apply that commits only behind its gate (and refuses
      # a migration that rewrites a row or opens a writer), the role probe, the
      # production probes, and a rehearsal of every deploy-billing.yml stage.
      - name: The billing deployment's checks refuse what they must, and the stages rehearse green
        run: |
          node tools/billing/billing_deploy_sql.test.js
          node tools/billing/prod_probe.test.js
          node tools/billing/deploy_stage.test.js
      - name: Personal rows are private, the journal and the reader's number are write-once
        run: node tools/personal/personal_sql.test.js
      - name: The partner program and its campaigns track what happened and never rewrite money or credit
        run: node tools/personal/affiliates_sql.test.js
      - name: The bettor's bankroll units and placed bets are private; EdgeDesk's frozen decisions are write-once and pregame
        run: node tools/bettor/bettor_sql.test.js
      - name: Trial activation, acquisition attribution and public samples
        run: node tools/personal/growth_sql.test.js
      - name: Only a listed operator opens the growth console; nobody can list themselves
        run: node tools/growth/admin_gate_sql.test.js
      # normal user < affiliate_admin < outbound owner. Every outbound table and
      # door attacked as anon, a subscriber, a partner, an affiliate admin who is
      # not an owner and the service role; no self-enrollment; only an owner
      # approves, only an approved draft can become a send.
      - name: Only an explicit outbound owner reaches prospect data, approves or triggers a send
        run: node tools/growth/outbound_sql.test.js
      # A fact about a prospect is evidence; every confidence, score and status
      # is computed from it and no statement may write one. One person, one row.
      - name: Prospect research is evidence; confidences are computed, never written; one person is one row
        run: node tools/growth/outbound_research_sql.test.js
      # Only the owner approves, within the content rules, for the exact count
      # they confirm (all or nothing); approving sends nothing.
      - name: The review queue approves only what the owner confirms, within the content rules
        run: node tools/growth/outbound_review_sql.test.js
      - name: A send is claimed before it is sent, once per draft, and never sent twice
        run: node tools/growth/outbound_send_sql.test.js
      # Resend's signature checked in SQL (HMAC-SHA256 to RFC 4231); a hard
      # bounce, a complaint, an opt-out or "asked to stop" suppresses for good;
      # a test send never does; exactly two doors anon may call.
      - name: Only Resend's signed events change a send; bounces, complaints and opt-outs suppress for good
        run: node tools/growth/outbound_events_sql.test.js
      # The research engine may find, read and verify, never approve or send:
      # every quote is checked against the stored page, every claim against
      # its quote, "own site" is the database's call, the budget is enforced.
      - name: The research engine records only what it can quote, under a daily budget
        run: node tools/growth/outbound_engine_sql.test.js
      # The deployed research function against the real SQL: Brave, Hunter,
      # Claude (via the SDK) and the web mocked; robots.txt, SSRF guards, and
      # every made-up quote dropped before the database refuses it.
      - name: The research function reads politely and keeps only verified quotes
        run: node tools/growth/outbound_research.test.js
      # The drafting engine may draft, never approve or send: every claim is
      # the person's own cited evidence in its words, nothing specific comes
      # from nowhere, a first name only when established, follow-ups only on
      # the cadence (at sending too).
      - name: The drafting engine says only what the database can cite, and greets by an established first name or none
        run: node tools/growth/outbound_drafting_sql.test.js
      # The deployed drafting function against the real SQL: Claude (via the
      # SDK) mocked; a made-up detail refused and retried; the template floor;
      # no door that approves, edits or sends.
      - name: The drafting function writes only what the database accepts, and never approves or sends
        run: node tools/growth/outbound_draft.test.js
      # The morning run: one step a tick, in the owner's window, on a
      # single-use ticket kept only as a hash; the ticket opens only the
      # engine's doors for its run, never approve, edit, send or settings.
      - name: The morning run finds, researches and drafts on single-use tickets, and can never approve or send
        run: node tools/growth/outbound_schedule_sql.test.js
      # Results: a live email's EdgeDesk links carry its campaign code; a
      # visit or an account counts only by that code or the address written
      # to, after the first email; an account ends the sequence; a customer
      # is never cold-emailed; the owner's results leak no account.
      - name: Results are matched by link or address only, end the sequence, and leak no account
        run: node tools/growth/outbound_analytics_sql.test.js
      # Phase 11, hardening: the races (real sessions released together), the
      # junk (seeded, replayable), the whole life of a prospect through all
      # five functions, the System check, and what the files must never say.
      - name: At the same instant, every race resolves to one send, one step, one candidate, one suppression — no deadlock
        run: node tools/growth/outbound_concurrency_sql.test.js
      - name: Junk at every door is refused in words, never an error, and the public doors write nothing without their proof
        run: node tools/growth/outbound_fuzz_sql.test.js
      - name: One prospect's whole life through all six Edge Functions and one database, approved and sent only by the owner
        run: node tools/growth/outbound_lifecycle.test.js
      - name: The System check is the file's own report, owner only; what needs attention appears exactly when true
        run: node tools/growth/outbound_health_sql.test.js
      - name: No key, secret or service-role reference in the files; functions read only their settings and log no token
        run: node tools/growth/outbound_static.test.js
      # Phase 12: the 0–100 qualification score, segments, the offer and
      # content rules, warm-up, the sending domain, providers and Clay/Apollo,
      # and the providers through the deployed functions.
      - name: Prospects are scored 0–100 from evidence, partners are kept apart, and every engine email carries the offer
        run: node tools/growth/outbound_qualify_sql.test.js
      - name: Search, email lookup, verification and enrichment providers are switched on deliberately and weighed as their word
        run: node tools/growth/outbound_providers.test.js
      # The owner's daily email (2026-10): "N drafts are waiting for your
      # review", once a morning, to the owner's own confirmed address only,
      # counts only, on a ticket that opens its own two doors and no others.
      - name: The daily email goes once a morning to the owner alone, says counts only, and never touches a send
        run: node tools/growth/outbound_digest_sql.test.js
      - name: The daily email's function sends exactly what the database wrote, to one address, and records what became of it
        run: node tools/growth/outbound_digest.test.js
      - name: The research-state scheduler's record is the service role's alone; its pg_cron job replaces itself
        env:
          RESEARCH_CRON_SQL_REQUIRED: '1'
        run: node tools/personal/research_cron_sql.test.js
