# EdgeDesk — the checks that gate every change to the personal research
# terminal and the growth layer on top of it: the watchlist, alerts, journal
# and Compare My Number, research cards, personas, the partner program and
# its campaigns, trial activation, acquisition attribution and public samples.
#
#   suites      the libraries, the job's database pass (in-memory PostgREST),
#               the page wiring, the AI desk's personal answers — offline.
#   migrations  supabase/personal_research.sql, affiliates.sql and growth.sql
#               applied TWICE to a real PostgreSQL on the runner's own
#               throwaway cluster, and attacked as other readers, as anon and
#               as the service role.
#
# The browser suite (tools/personal/personal_ui.e2e.js) needs Playwright and
# is run by hand: npm run personal:e2e. Nothing here deploys or writes.
name: Personal research CI

on:
  pull_request:
    paths:
      - 'lib/edgedesk_personal*.js'
      - 'lib/edgedesk_personal.css'
      - 'lib/edgedesk_share_card.js'
      - 'lib/edgedesk_pricing.js'
      - 'tools/billing/**'
      - 'terms.html'
      - 'lib/research_core.js'
      - 'supabase/personal_research.sql'
      - 'supabase/bettor_decisions.sql'
      - 'supabase/bankroll_and_stakes.sql'
      - 'lib/edgedesk_decision*.js'
      - 'lib/edgedesk_vocab.js'
      - 'lib/edgedesk_bankroll.js'
      - 'tools/bettor/**'
      - 'supabase/affiliates.sql'
      - 'supabase/growth.sql'
      - 'supabase/billing.sql'
      - 'supabase/stripe_webhook.sql'
      - 'supabase/referral_codes.sql'
      - 'supabase/functions/edgedesk_ai/_mine.js'
      - 'tools/personal/**'
      - 'research/sample/**'
      - 'admin/growth/**'
      - 'admin/affiliates/**'
      - 'index.html'
      - 'app.html'
      - 'package.json'
      - '.github/workflows/personal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Alerts, Top 5, journal grading, CLV and the job's database pass
        run: node tools/personal/personal.test.js
      - name: One source for the offer, the books, the page wiring, no tout language
        run: node tools/personal/personal_wiring.test.js
      # The offer's other half: what Stripe is asked about the payment links
      # (every wrong price, mode and trial must fail), and the paywall,
      # settings card and checkout agreeing on who has already paid.
      - name: The Stripe offer verifier fails every link that sells something else
        run: node tools/billing/verify_stripe_offer.test.js
      - name: A comped account is paid; the paywall, settings and checkout agree
        run: node tools/billing/comp_entitlement.test.js
      - name: The Stripe webhook grants access by status, never by price
        run: node tools/billing/stripe_webhook.test.js
      - name: A subscriber's life through the real webhook and paywall, on either price
        run: node tools/billing/subscriber_lifecycle.test.js
      - name: Compare My Number, research cards, personas, creator offers, trial actions, public samples
        run: node tools/personal/growth.test.js
      - name: The AI desk answers the reader's research from their own rows
        run: node tools/intelligence/mine.test.js
      - name: The bettor decision layer (engine, tracks, bankroll, renderers) and placed-bet grading
        run: node tools/bettor/decision.test.js
      - name: The unified football decision engine (NFL and CFB)
        run: node tools/bettor/football_decision.test.js
      - name: One meaning per state (market state, research vs decision, raw vs calibrated EV, exposure, beginner mode)
        run: node tools/bettor/consistency.test.js

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The runner image ships PostgreSQL; each suite starts its own throwaway
      # cluster, applies its migrations twice, and tears it down.
      - name: Personal rows are private, the journal and the reader's number are write-once
        run: node tools/personal/personal_sql.test.js
      - name: The partner program and its campaigns track what happened and never rewrite money or credit
        run: node tools/personal/affiliates_sql.test.js
      - name: The bettor's bankroll units and placed bets are private; EdgeDesk's frozen decisions are write-once and pregame
        run: node tools/bettor/bettor_sql.test.js
      - name: Trial activation, acquisition attribution and public samples
        run: node tools/personal/growth_sql.test.js
