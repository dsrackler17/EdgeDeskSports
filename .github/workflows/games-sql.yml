      - '.github/workflows/tennis-record.yml'
      # THE SPLIT PARTS AND THE CHECK THAT KEEPS THEM HONEST. supabase/parts is
      # what gets pasted into the Supabase SQL editor, so a split that has
      # drifted from its source installs a contract the repository has already
      # moved past — which is the state the tennis schema was found in.
