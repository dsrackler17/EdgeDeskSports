# EdgeDesk — every RLS guarantee that a browser cannot be trusted to keep,
# tested against a real PostgreSQL: the Games social layer, the franchise,
# problem reports (the one table `anon` may write to), and member posts (where
# who may PUBLISH is a value in a column, so no policy can express it and a
# trigger has to).
#
# supabase/games_social.sql is where Head-to-Head answer privacy actually lives:
# a table no client role may select from, and a security-definer function that
# decides what may be seen. Reasoning about that is not evidence, so this job
# applies the shipped file to a real database and attacks it as a client would.
#
# The suite SKIPS (and passes) on a machine without PostgreSQL, so `npm test`
# stays green on a bare Node install. This workflow is where it must not skip.
name: RLS against a real PostgreSQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/games_social.sql'
      - 'supabase/games_franchise.sql'
      - 'tools/games/sql/**'
      - 'tools/games/sql_security.test.js'
      - 'tools/games/franchise_sql.test.js'
      - 'tools/games/cards_sql.test.js'
      - 'tools/games/season_sql.test.js'
      - 'tools/games/offline.test.js'
      - 'supabase/issue_reports.sql'
      - 'supabase/billing.sql'
      - 'supabase/stripe_webhook.sql'
      - 'tools/app/sql/**'
      - 'tools/app/issue_reports_sql.test.js'
      - 'tools/app/billing_sql.test.js'
      - 'supabase/site_articles.sql'
      - 'supabase/community_posts.sql'
      - 'tools/articles/sql/**'
      - 'tools/articles/community_sql.test.js'
      - 'supabase/ufc_live_center.sql'
      - 'tools/ufc/sql/**'
      - 'tools/ufc/ufc_sql.test.js'
      - 'supabase/tennis_live_center.sql'
      - 'tools/tennis/sql/**'
      - 'tools/tennis/tennis_sql.test.js'
      - '.github/workflows/games-sql.yml'
  pull_request:
    paths:
      - 'supabase/games_social.sql'
      - 'supabase/games_franchise.sql'
      - 'tools/games/sql/**'
      - 'tools/games/sql_security.test.js'
      - 'tools/games/franchise_sql.test.js'
      - 'tools/games/cards_sql.test.js'
      - 'tools/games/season_sql.test.js'
      - 'tools/games/offline.test.js'
      - 'supabase/issue_reports.sql'
      - 'supabase/billing.sql'
      - 'supabase/stripe_webhook.sql'
      - 'tools/app/sql/**'
      - 'tools/app/issue_reports_sql.test.js'
      - 'tools/app/billing_sql.test.js'
      - 'supabase/site_articles.sql'
      - 'supabase/community_posts.sql'
      - 'tools/articles/sql/**'
      - 'tools/articles/community_sql.test.js'
      - 'supabase/ufc_live_center.sql'
      - 'tools/ufc/sql/**'
      - 'tools/ufc/ufc_sql.test.js'
      - 'supabase/tennis_live_center.sql'
      - 'tools/tennis/sql/**'
      - 'tools/tennis/tennis_sql.test.js'

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run the social SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/games/sql_security.test.js | tee sql.log

      # The franchise layer: rosters, the ledger and every reward, attacked
      # the same way on the same database.
      - name: Run the franchise SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/games/franchise_sql.test.js | tee franchise.log

      # THE MARKETPLACE, AND THE ONLY PROMISE THAT MATTERS WHEN MONEY MOVES:
      # a card has exactly one owner, always, and two buyers racing for it
      # produce one winner and one clean failure. Needs a real database
      # because the guarantee is a unique index and a row lock.
      - name: Run the cards SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/games/cards_sql.test.js | tee cards.log

      # The season the record actually keeps: a power rating that is not the
      # standings, ten award races scored on performance, and a title game.
      - name: Run the season SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/games/season_sql.test.js | tee season.log

      # OFFLINE AND RETRY, IN A REAL BROWSER. Chromium loads the real pages and
      # every call it makes runs through psql against this database, so a
      # connection dropped BEFORE a request lands and one dropped AFTER it
      # commits are two different tests. Skips loudly if the browser is absent.
      - name: Install Chromium for the browser suite
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run the offline and retry suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/games/offline.test.js | tee offline.log

      # Problem reports: the one table `anon` may write to. That concession is
      # only safe if an anonymous reporter cannot read anything back, nobody can
      # file under another account's id, and no credential can be stored — which
      # is what this proves, on the same real database.
      - name: Run the problem-report SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/app/issue_reports_sql.test.js | tee issues.log

      # The signup path's floor: the consent write that gates checkout, and the
      # subscriptions row that IS the product and no browser may write.
      - name: Run the billing SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/app/billing_sql.test.js | tee billing.log

      # Member posts. Anyone with an account may WRITE; only an entitled
      # subscriber may PUBLISH without an editor reading the post first. That
      # is a statement about a value rather than about a row, so it lives in a
      # trigger — and this is where the trigger is actually attacked, as anon,
      # as a free account, as a subscriber, and as one member reaching for
      # another's queued post.
      - name: Run the member-post SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/articles/community_sql.test.js | tee community.log

      # The UFC Live Fight Center contract: public reads, no client writes, the
      # per-event poller lock, the dedup constraints and the cascade — the
      # guarantees the browser and the GitHub jobs both depend on.
      - name: Run the UFC live center SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/ufc/ufc_sql.test.js | tee ufc.log

      # The tennis Live Match Center contract: public reads, no client writes,
      # the per-TOUR-DAY poller lock (one scoreboard carries every tournament's
      # live matches, so the lock is keyed by tour and day), the dedup
      # constraints, the shape checks and the cascade.
      - name: Run the tennis live center SQL suite
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: node tools/tennis/tennis_sql.test.js | tee tennis.log

      # A skip here would mean the guarantee was never tested. On this job that
      # is a failure, not a pass.
      - name: Refuse a silent skip
        run: |
          for f in sql.log franchise.log issues.log billing.log community.log ufc.log tennis.log; do
            if grep -q '^SKIP' "$f"; then
              echo "REFUSING: a SQL suite skipped ($f) in the job whose whole purpose is to run it"
              exit 1
            fi
            grep -q '^PASS' "$f"
          done
