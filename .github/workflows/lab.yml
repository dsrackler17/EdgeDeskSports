name: Multi-sport lab
run-name: Multi-sport lab · ${{ inputs.mode || github.event_name }}

# The data packs (datapack/quant_v1, nhl_v1, nfl_v1) and the brains built on them beside the NHL:
# basketball (NBA, WNBA, men's and women's college), MLB history, the UFC measurement, missingness, the registry and the board.
# Every source here is free and keyless (raw.githubusercontent.com through
# engine/http.js: cache, quota, breaker). Nothing spends an odds credit.

on:
  pull_request:
    paths:
      - 'datapack/**'
      - 'basketball/**'
      - 'mlb/history/**'
      - 'engine/**'
      - 'lib/edgedesk_xboard.js'
      - 'lib/edgedesk_sport_brains.js'
      - 'lib/edgedesk_engine_ui.js'
      - 'tools/datapack/**'
      - 'tools/lab/**'
      - 'football/nfl/pack_crosscheck.js'
      - 'football/nfl/research/**'
      - 'football/nfl/crosswalk/**'
      - 'football/validation/nfl_pack_*.json'
      - 'hockey/tools/parquet_select.py'
      - '.github/workflows/lab.yml'
  push:
    branches: [main]
    paths:
      - 'datapack/**'
      - 'basketball/**'
      - 'mlb/history/**'
      - 'engine/lab/**'
      - 'tools/datapack/**'
      - 'tools/lab/**'
  schedule:
    - cron: '17 9 * * *'     # build: current seasons, slates, registry, board
    - cron: '47 11 * * 3'    # validate: every walk-forward refit
  workflow_dispatch:
    inputs:
      mode:
        description: 'build or validate'
        required: false
        default: 'build'

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyarrow (the NFL pack is Parquet; read by my own helpers, never the pack's scripts)
        run: pip install --quiet pyarrow
      - name: The data packs verify (hashes, counts, blank known_at, contracts, NFL and NHL lags recomputed, no invented xG)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node tools/datapack/verify.js --check && node tools/datapack/verify_nhl.js --check && node tools/datapack/verify_nfl.js --check && node tools/datapack/datapack.test.js
      - name: The NFL pack against my NFL brain's sources, and the research on it
        run: node football/nfl/pack_crosscheck.js --check && node football/nfl/research/pack_research.js --check
      - name: The pack agrees with each brain's own source
        run: node tools/datapack/crosscheck.js --check
      - name: The brains, the protocol, the board's settlement and sensitivity rules, the ladder
        run: node tools/lab/lab.test.js
      - name: Every committed record passes its check
        run: |
          node basketball/walkforward.js --check
          node mlb/history/walkforward.js --check
          node basketball/build_slate.js --check
          node engine/build_registry.js --check
          node engine/build_board.js --check

  build:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 9 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.mode == '' || inputs.mode == 'build'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: lab-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyarrow
      - name: The seasons in progress (completed seasons are cached and unchanged)
        run: |
          node basketball/ingest.js --league all --season current
      - name: Slates, missingness, registry and board
        run: node basketball/build_slate.js && node engine/lab/missingness.js && node engine/build_registry.js && node engine/build_board.js
      - name: The suites pass before anything is written
        run: node tools/lab/lab.test.js && node basketball/build_slate.js --check && node engine/build_registry.js --check && node engine/build_board.js --check
      - name: Commit (tools/ci/push_generated.sh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/ci/push_generated.sh main "lab: current seasons, slates and the cross-sport board" -- \
            basketball/data basketball/slate.json engine/missingness.json engine/registry.json engine/board.json

  validate:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 11 * * 3') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: lab-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyarrow
      - uses: actions/cache@v4
        with:
          path: .cache/lab_src
          key: lab-src-${{ github.run_id }}
          restore-keys: lab-src-
      - name: Every season (cached between runs)
        run: |
          node basketball/ingest.js --league all
          node mlb/history/ingest.js
      - name: The walk-forward records (tuning files are kept; --tune is a deliberate, separate act)
        run: |
          node --max-old-space-size=6144 basketball/walkforward.js --league all
          node --max-old-space-size=6144 mlb/history/walkforward.js
          node engine/lab/ufc_elo.js
      - name: Cross-check, missingness, slates, registry and board on the new records
        run: node tools/datapack/crosscheck.js && node engine/lab/missingness.js && node basketball/build_slate.js && node engine/build_registry.js && node engine/build_board.js
      - name: The suites pass on the new records before anything commits
        run: node tools/lab/lab.test.js && node basketball/walkforward.js --check && node mlb/history/walkforward.js --check && node engine/build_registry.js --check && node engine/build_board.js --check
      - name: Commit (tools/ci/push_generated.sh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/ci/push_generated.sh main "lab: weekly walk-forward records" -- \
            basketball mlb/history engine/lab/ufc_elo.json engine/missingness.json engine/registry.json engine/board.json datapack/quant_v1/EDGEDESK_CROSSCHECK.json
