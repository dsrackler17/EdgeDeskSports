# The scheduled jobs run from their own workflows (lab-build.yml, lab-validate.yml),
# so a pull request or a push lists only the tests here, never a Skipped job.
name: Multi-sport lab
run-name: Multi-sport lab · ${{ github.event_name }}

# The data packs (datapack/quant_v1, nhl_v1, nfl_v1) and the brains built on them beside the NHL:
# basketball (NBA, WNBA, men's and women's college), MLB history, the UFC measurement, missingness, the registry and the board.
# Every source here is free and keyless (raw.githubusercontent.com through
# engine/http.js: cache, quota, breaker). Nothing spends an odds credit.

on:
  pull_request:
    paths:
      - 'datapack/**'
      - 'basketball/**'
      - 'mlb/history/**'
      - 'engine/**'
      # engine/build_registry.js reads college baseball's validation records: a change to them is a
      # change to the registry's evidence (2026-10-26: the weekly run's records broke this check)
      - 'college_baseball/validation/**'
      - 'lib/edgedesk_xboard.js'
      - 'lib/edgedesk_sport_brains.js'
      - 'lib/edgedesk_engine_ui.js'
      - 'tools/datapack/**'
      - 'tools/lab/**'
      - 'football/nfl/pack_crosscheck.js'
      - 'football/nfl/research/**'
      - 'football/nfl/crosswalk/**'
      - 'football/validation/nfl_pack_*.json'
      - 'hockey/tools/parquet_select.py'
      - '.github/workflows/lab.yml'
      - '.github/workflows/lab-validate.yml'
      - '.github/workflows/lab-build.yml'
  push:
    branches: [main]
    paths:
      - 'datapack/**'
      - 'basketball/**'
      - 'mlb/history/**'
      - 'engine/lab/**'
      - 'tools/datapack/**'
      - 'tools/lab/**'

permissions:
  contents: read

# A newer push to a pull request replaces its older run (the result that
# matters is the head's); a push, schedule or dispatch run keeps its own
# group, so no run on main is cancelled (docs/ci/README.md).
concurrency:
  group: lab-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyarrow (the NFL pack is Parquet; read by my own helpers, never the pack's scripts)
        run: pip install --quiet pyarrow
      - name: The data packs verify (hashes, counts, blank known_at, contracts, NFL and NHL lags recomputed, no invented xG)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node tools/datapack/verify.js --check && node tools/datapack/verify_nhl.js --check && node tools/datapack/verify_nfl.js --check && node tools/datapack/datapack.test.js
      - name: The NFL pack against my NFL brain's sources, and the research on it
        run: node football/nfl/pack_crosscheck.js --check && node football/nfl/research/pack_research.js --check
      - name: The pack agrees with each brain's own source
        run: node tools/datapack/crosscheck.js --check
      - name: The brains, the protocol, the board's settlement and sensitivity rules, the ladder
        run: node tools/lab/lab.test.js
      - name: Every committed record passes its check
        run: |
          node basketball/walkforward.js --check
          node mlb/history/walkforward.js --check
          node basketball/build_slate.js --check
          node engine/build_registry.js --check
          node engine/build_board.js --check
