# Deploy Bet Checker: the log_user_bet and grade_user_bets edge functions and
# (optionally) their SQL — supabase/bet_checker.sql (user_bets' entry and close
# columns, the free allowance, the pickers, the logger, the grader, the reader's
# list and stats) and supabase/bet_checker_cron.sql (grade_user_bets every
# fifteen minutes, after the close). docs/bet-checker.md.
#
# MANUAL ON PURPOSE, as every deploy-*.yml here: tests first, then the
# functions, then the SQL in dependency order, then the cron secret, then the
# schedule. A report row that says CHECK THIS fails the job.
#
# ORDER. Billing first: bet_checker.sql calls has_bet_checker_paid(), which
# supabase/billing_hardening.sql defines — apply that through Deploy billing
# (deploy-billing.yml, stage apply_sql) before this. bet_checker.sql stops
# with a message naming it otherwise.
#
# SECRETS (the same ones the other deploy-*.yml use):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF   to deploy the functions
#   SB_DB_URL                                     to apply the SQL (optional;
#                                                 or paste the files into the SQL editor)
# THE CRON SECRET (set_cron_secret, on by default): grade_user_bets'
# BET_CHECKER_CRON_SECRET and the Vault secret bet_checker_cron_secret are one
# value. This run makes them exist and agree, the deploy-nhl-goalie.yml way:
# generated on this runner when Vault has none, masked, sent only to Supabase,
# never printed or stored in GitHub; then a probe proves the function accepts
# it. NEVER SET ONE SIDE BY HAND: a function secret that is not Vault's refuses
# every pg_cron poke.
name: Deploy Bet Checker

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy log_user_bet (JWT verification ON) and grade_user_bets (JWT verification OFF: pg_cron sends no JWT)'
        type: boolean
        default: true
      apply_sql:
        description: 'Apply bet_checker.sql (needs bettor_decisions.sql, billing_hardening.sql and the capture tables)'
        type: boolean
        default: false
      set_cron_secret:
        description: 'Make the grader''s cron secret exist in Vault and on the function, and prove they agree'
        type: boolean
        default: true
      apply_cron:
        description: 'Apply bet_checker_cron.sql (grade_user_bets every fifteen minutes; needs pg_cron and pg_net)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-bet-checker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # the deployed files themselves are imported by the function suite (type
      # stripping), against the shipped SQL: what ships is what was tested
      - name: The SQL, the functions, the page and the billing tiers must pass before anything ships
        run: |
          sudo apt-get install -y -qq postgresql >/dev/null 2>&1 || true
          node tools/bet_checker/bet_checker_sql.test.js
          node tools/bet_checker/functions.test.js
          node tools/bet_checker/core.test.js
          node tools/bet_checker/page.test.js
          node tools/billing/tier_flow.test.js

      - name: Check the credentials exist before claiming anything
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DBURL: ${{ secrets.SB_DB_URL }}
          WANT_FN: ${{ inputs.deploy_functions }}
          WANT_SQL: ${{ inputs.apply_sql }}
          WANT_SECRET: ${{ inputs.set_cron_secret }}
          WANT_CRON: ${{ inputs.apply_cron }}
        run: |
          # Presence only. No value is ever printed.
          echo "have_token=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "have_ref=$([ -n "$REF" ] && echo yes || echo no)"     >> "$GITHUB_OUTPUT"
          echo "have_db=$([ -n "$DBURL" ] && echo yes || echo no)"    >> "$GITHUB_OUTPUT"
          # A part that was asked for and cannot run fails the run: a green run
          # that deployed nothing would be a false claim (AGENTS.md §4).
          bad=0
          if { [ "$WANT_FN" = "true" ] || [ "$WANT_SECRET" = "true" ]; } && { [ -z "$TOKEN" ] || [ -z "$REF" ]; }; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not set — the functions cannot be deployed from CI."; bad=1; fi
          if { [ "$WANT_SQL" = "true" ] || [ "$WANT_SECRET" = "true" ] || [ "$WANT_CRON" = "true" ]; } && [ -z "$DBURL" ]; then
            echo "::error::SB_DB_URL is not set — paste bet_checker.sql, then bet_checker_cron.sql, into the SQL editor instead."; bad=1; fi
          exit $bad

      - name: Install the Supabase CLI
        if: ${{ (inputs.deploy_functions || inputs.set_cron_secret) && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # log_user_bet keeps JWT verification ON (the default), like
      # parse_bet_import: only a signed-in reader may log a bet, and the
      # function asks Supabase Auth who the token is before anything else.
      # --no-verify-jwt on grade_user_bets IS LOAD-BEARING: pg_cron sends the
      # x-cron-secret header, not a JWT. A POST without the secret is refused
      # by the function itself.
      - name: Deploy log_user_bet and grade_user_bets
        if: ${{ inputs.deploy_functions && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy log_user_bet --project-ref "$PROJECT_REF"
          supabase functions deploy grade_user_bets --project-ref "$PROJECT_REF" --no-verify-jwt

      # A deploy is verified by what the function SERVES, not by the CLI's exit
      # code: a bundle that fails leaves the previous version serving.
      - name: Each function serves this build
        if: ${{ inputs.deploy_functions && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -eu
          # log_user_bet keeps JWT verification ON, so the gateway wants a JWT
          # even on its health probe: the PUBLIC anon key (the one every page
          # ships, games/data/config.json) is one. It grants nothing here.
          ANON=$(node -e "process.stdout.write(require('./games/data/config.json').supabase_anon_key||'')")
          for fn in log_user_bet grade_user_bets; do
            want=$(sed -n "s/^export const BUILD = '\([^']*\)';.*/\1/p" "supabase/functions/$fn/index.ts" | head -1)
            got=""
            for i in $(seq 1 24); do
              got=$(curl -sS -m 15 -H "apikey: $ANON" -H "authorization: Bearer $ANON" "https://$PROJECT_REF.supabase.co/functions/v1/$fn" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).build||'')}catch(_){}})" || true)
              [ "$got" = "$want" ] && break
              sleep 5
            done
            if [ "$got" != "$want" ]; then echo "::error::$fn is serving '${got:-nothing}', not '$want', two minutes after the deploy"; exit 1; fi
            echo "$fn is serving $want"
          done

      - name: Apply bet_checker.sql
        if: ${{ inputs.apply_sql && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          # one transaction: a statement that fails rolls the whole file back
          # (the suites apply it the same way, applyFileAtomic)
          out=$(psql "$PGURL" --single-transaction -v ON_ERROR_STOP=1 -f supabase/bet_checker.sql)
          echo "== supabase/bet_checker.sql"; echo "$out" | tail -14
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::bet_checker.sql: a report row says CHECK THIS"; exit 1; fi

      # Before the cron: the poke sends the Vault value, so it must exist and the function must accept it.
      - name: The cron secret exists in Vault and on the function, and they agree
        if: ${{ inputs.set_cron_secret && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' && steps.creds.outputs.have_db == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          set -eu
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          FN="https://$PROJECT_REF.supabase.co/functions/v1/grade_user_bets"
          supabase secrets list --project-ref "$PROJECT_REF" > "$RUNNER_TEMP/names.txt" 2>"$RUNNER_TEMP/err.txt" || { cat "$RUNNER_TEMP/err.txt"; echo "::error::supabase secrets list failed: is SUPABASE_ACCESS_TOKEN still valid?"; exit 1; }
          fn_has=no; grep -qw BET_CHECKER_CRON_SECRET "$RUNNER_TEMP/names.txt" && fn_has=yes; rm -f "$RUNNER_TEMP/names.txt"
          vault=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "select decrypted_secret from vault.decrypted_secrets where name = 'bet_checker_cron_secret' limit 1")
          if [ -n "$vault" ]; then echo "::add-mask::$vault"; fi
          setfn() { umask 077; f="$RUNNER_TEMP/bc.env"; printf 'BET_CHECKER_CRON_SECRET=%s\n' "$1" > "$f"; supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f" >/dev/null || { rm -f "$f"; echo "::error::supabase secrets set failed"; exit 1; }; rm -f "$f"; }
          if [ -z "$vault" ]; then
            vault=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
            echo "::add-mask::$vault"
            echo "select vault.create_secret(:'sec', 'bet_checker_cron_secret');" | psql "$PGURL" -q -v ON_ERROR_STOP=1 -v sec="$vault" >/dev/null
            setfn "$vault"
            echo "Vault had no bet_checker_cron_secret: a new one was generated on this runner and set in Vault and on the function (never printed)."
          elif [ "$fn_has" = no ]; then
            setfn "$vault"
            echo "The function had no BET_CHECKER_CRON_SECRET: it was set to the Vault value."
          else
            echo "Vault and the function both hold a cron secret: checking that they agree."
          fi
          # a probe with the Vault value: 401 means the two disagree; {"probe":true} is authenticated and grades nothing
          probe() { curl -sS -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' -X POST "$FN" -H 'content-type: application/json' -H "x-cron-secret: $vault" -d '{"probe":true}' || true; }
          ok=no; code=000
          for i in $(seq 1 15); do
            code=$(probe)
            if [ "$code" = 200 ] && grep -q '"probe":true' "$RUNNER_TEMP/probe.json"; then ok=yes; break; fi
            if [ "$code" = 401 ] && [ "$i" = 4 ]; then setfn "$vault"; echo "The function refused the Vault value: its secret was set to it."; fi
            sleep 6
          done
          vault=""
          if [ "$ok" != yes ]; then echo "::error::grade_user_bets did not accept the cron secret (last answer HTTP $code)"; head -c 400 "$RUNNER_TEMP/probe.json"; echo; exit 1; fi
          echo "grade_user_bets accepts the cron secret."
          rm -f "$RUNNER_TEMP/probe.json"

      - name: Apply the cron (grade_user_bets every fifteen minutes, after the close)
        if: ${{ inputs.apply_cron && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/bet_checker_cron.sql)
          echo "== supabase/bet_checker_cron.sql"; echo "$out" | tail -6
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::bet_checker_cron.sql: a report row says CHECK THIS"; exit 1; fi
