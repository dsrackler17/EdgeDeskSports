# Switch Signal Center between shadow and live (docs/signal-center/DEPLOYMENT.md §3).
#
# MANUAL ON PURPOSE (workflow_dispatch). It is the owner's switch: it calls
# public.sc_owner_set_mode(mode, sports, reason) with the connection string,
# a door no API role can reach. An operator signed in to /admin/signals/
# has the same switch (sc_admin_set_mode); both are logged in sc_config_log.
#
# Going LIVE also publishes the signals already stored in shadow that clear
# the publication rule now (VERIFIED, active, not a fixture, a live sport, at
# or above publish.min_label). Held and withdrawn signals are never touched.
# Going SHADOW publishes nothing new; what is already published stays
# published until an operator holds or withdraws it.
#
# sports: comma-separated registry keys (lib/edgedesk_signal_registry.js),
# or "all" for every sport the registry lists. A key the registry does not
# know is refused before anything is written.
#
# SECRETS: SB_DB_URL (the pooled Postgres connection string).
name: Signal Center mode
run-name: Signal Center mode · ${{ inputs.mode }} · ${{ inputs.sports }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'shadow (publish nothing new) or live'
        type: choice
        options: [live, shadow]
        default: live
      sports:
        description: 'Sports that may publish: comma-separated keys (nfl,cfb,…) or "all"'
        type: string
        default: 'nfl,cfb'
      reason:
        description: 'Why (kept in sc_config_log)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: signal-center-mode
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve the sports against the registry
        id: sports
        env:
          SPORTS: ${{ inputs.sports }}
        run: |
          node -e '
            const R = require("./lib/edgedesk_signal_registry.js");
            const known = R.sports().map((s) => s.key);
            const raw = String(process.env.SPORTS || "").trim().toLowerCase();
            const want = raw === "all" ? known : raw.split(",").map((s) => s.trim()).filter(Boolean);
            const bad = want.filter((k) => known.indexOf(k) < 0);
            if (!want.length || bad.length) { console.log("::error::unknown sport key(s): " + (bad.join(", ") || "(none given)") + ". Known: " + known.join(", ")); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "list=" + want.join(",") + "\n");
            console.log("sports: " + want.join(", "));
          '
      - name: Check the credential exists before claiming anything
        env:
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          # Presence only. No value is ever printed.
          if [ -z "$DBURL" ]; then echo "::error::SB_DB_URL is not set (Settings > Secrets and variables > Actions)."; exit 1; fi
      - name: Switch (public.sc_owner_set_mode)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
          MODE: ${{ inputs.mode }}
          SPORTS: ${{ steps.sports.outputs.list }}
          REASON: ${{ inputs.reason }}
        run: |
          # psql variables are quoted by psql itself (:'name'), so an input can never become SQL
          psql "$PGURL" -X -q -t -A -v ON_ERROR_STOP=1 -v mode="$MODE" -v sports="$SPORTS" -v reason="$REASON" <<'SQL'
          select public.sc_owner_set_mode(:'mode', string_to_array(:'sports', ','), :'reason');
          select 'status: ' || public.sc_status()::text;
          SQL
