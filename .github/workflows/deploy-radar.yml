# Deploy Prediction Radar: the polymarket_sync edge function and (optionally)
# its SQL, in the runbook's order (docs/prediction-radar.md, Operator runbook):
# supabase/radar.sql, supabase/radar_registry.sql, supabase/radar_record.sql,
# then the cron secret, then the switch, then supabase/polymarket_sync_cron.sql.
#
# MANUAL ON PURPOSE, as every deploy-*.yml here: tests first, then the
# function, then the SQL in dependency order. A report row that says CHECK THIS
# fails the job (radar.sql's "pending: off" and "pending: apply ..." rows are
# not one: they are the switch and the registry, set by the later steps).
#
# SECRETS (the same ones the other deploy-*.yml use):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF   to deploy the function
#   SB_DB_URL                                     to apply the SQL (optional;
#                                                 or paste the files into the SQL editor)
# THE CRON SECRET (set_cron_secret, on by default): polymarket_sync's
# POLYMARKET_SYNC_SECRET and the Vault secret polymarket_sync_cron_secret are
# one value. This run makes them exist and agree, the deploy-bet-checker.yml
# way: generated on this runner when Vault has none, masked, sent only to
# Supabase, never printed or stored in GitHub; then a probe proves the function
# accepts it. NEVER SET ONE SIDE BY HAND.
# THE SWITCH (data_enabled, "leave" by default): POLYMARKET_DATA_ENABLED has two
# halves, public.radar_config and the function's environment, and Radar asks
# Polymarket nothing unless both say on. "on" sets both and records
# enable_note (who read Polymarket's terms, when, and the clause) in
# radar_config, whose audit log keeps every change. "off" turns both off.
# RUN NOW (run_now, off by default): the overnight work at once instead of
# 06:07-10:17 UTC: the pool, then the wallets (3 a call) until none is due,
# then the grade. ONE CALL AT A TIME, each answer awaited before the next, as
# pg_cron's 5-minute spacing does overnight: two wallet calls at once would
# pick the same wallets. Each call answers within its 75 s time budget and
# may finish only part of a wallet; the next call carries on. The wallet calls stop while fewer than
# run_now_reserve of today's Polymarket requests remain, so the 10-minute
# tonight runs keep theirs; the 06:10 UTC schedule takes the wallets left.
# A grade runs after every 25 good wallet calls as well as at the end, and the
# wallet calls stop after 5 hours, so the last grade runs inside GitHub's
# 6-hour job limit. Then ONE tonight run, so the holders and the cards are
# current at once instead of at the next 10-minute schedule.
# THE REPORT (report, on by default): last, whatever happened before it, where
# Radar stands stage by stage (tools/radar/sql/radar_pipeline_report.sql,
# read-only): the rules and the hypothesis, the sync state, the runs of the
# last 24 hours, discovery and the exclusions by reason, the grade, the
# covered games matched, the positions, the cards, and the first stage where
# the count reaches zero; and the four schedules with their last run.
name: Deploy Prediction Radar

on:
  workflow_dispatch:
    inputs:
      deploy_function:
        description: 'Deploy supabase/functions/polymarket_sync (JWT verification OFF: pg_cron sends no JWT)'
        type: boolean
        default: true
      apply_sql:
        description: 'Apply radar.sql, radar_registry.sql and radar_record.sql (needs has_active_sub() and the research registry)'
        type: boolean
        default: false
      set_cron_secret:
        description: 'Make the sync''s cron secret exist in Vault and on the function, and prove they agree'
        type: boolean
        default: true
      data_enabled:
        description: 'POLYMARKET_DATA_ENABLED, both halves: leave as it is, on, or off'
        type: choice
        options: ['leave', 'on', 'off']
        default: 'leave'
      enable_note:
        description: 'Required for on: who read Polymarket''s terms of use, when, and the clause that permits display'
        type: string
        default: ''
      apply_cron:
        description: 'Apply polymarket_sync_cron.sql (the four schedules; needs pg_cron, pg_net and the cron secret)'
        type: boolean
        default: false
      run_now:
        description: 'Run the overnight work now, one call at a time: the pool, the wallets (3 a call) until none is due, then the grade'
        type: boolean
        default: false
      run_now_reserve:
        description: 'For run_now: stop the wallet calls while fewer than this many of today''s Polymarket requests remain (kept for the tonight runs)'
        type: string
        default: '8000'
      report:
        description: 'Last, print where Radar stands stage by stage (read-only): discovery, exclusions, histories, the grade, games, positions, cards, the schedules'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-radar
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # the deployed function is imported by sync_fn.test.js (type stripping),
      # against the shipped SQL: what ships is what was tested
      - name: The grading core, the gateway, the SQL, the function and the pages must pass before anything ships
        env:
          RADAR_SQL_REQUIRED: '1'
        run: |
          sudo apt-get install -y -qq postgresql >/dev/null 2>&1 || true
          node tools/radar/core.test.js
          node tools/radar/fixtures.test.js
          node tools/radar/gateway.test.js
          node tools/radar/no_bypass.test.js
          node tools/radar/inline_core.js --check
          node research/radar/run_validation.js --check
          node tools/radar/build_registry_sql.js --check
          node tools/radar/radar_ui.test.js
          node tools/radar/radar_sql.test.js
          node tools/radar/sync_fn.test.js

      - name: Check the credentials and the inputs before claiming anything
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DBURL: ${{ secrets.SB_DB_URL }}
          WANT_FN: ${{ inputs.deploy_function }}
          WANT_SQL: ${{ inputs.apply_sql }}
          WANT_SECRET: ${{ inputs.set_cron_secret }}
          WANT_SWITCH: ${{ inputs.data_enabled }}
          NOTE: ${{ inputs.enable_note }}
          WANT_CRON: ${{ inputs.apply_cron }}
          WANT_NOW: ${{ inputs.run_now }}
          RESERVE: ${{ inputs.run_now_reserve }}
          WANT_REPORT: ${{ inputs.report }}
        run: |
          # Presence only. No value is ever printed.
          echo "have_token=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "have_ref=$([ -n "$REF" ] && echo yes || echo no)"     >> "$GITHUB_OUTPUT"
          echo "have_db=$([ -n "$DBURL" ] && echo yes || echo no)"    >> "$GITHUB_OUTPUT"
          # A part that was asked for and cannot run fails the run: a green run
          # that deployed nothing would be a false claim (AGENTS.md §4).
          bad=0
          if { [ "$WANT_FN" = "true" ] || [ "$WANT_SECRET" = "true" ] || [ "$WANT_SWITCH" != "leave" ]; } && { [ -z "$TOKEN" ] || [ -z "$REF" ]; }; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not set — the function cannot be deployed or configured from CI."; bad=1; fi
          if { [ "$WANT_SQL" = "true" ] || [ "$WANT_SECRET" = "true" ] || [ "$WANT_SWITCH" != "leave" ] || [ "$WANT_CRON" = "true" ]; } && [ -z "$DBURL" ]; then
            echo "::error::SB_DB_URL is not set — paste radar.sql, radar_registry.sql, radar_record.sql, then polymarket_sync_cron.sql, into the SQL editor instead."; bad=1; fi
          if [ "$WANT_NOW" = "true" ] && { [ -z "$REF" ] || [ -z "$DBURL" ]; }; then
            echo "::error::run_now needs SUPABASE_PROJECT_REF and SB_DB_URL (the function's address, and Vault's cron secret and the request budget)."; bad=1; fi
          if [ "$WANT_REPORT" = "true" ] && [ -z "$DBURL" ]; then
            echo "::error::report needs SB_DB_URL (it reads the database)."; bad=1; fi
          if [ "$WANT_NOW" = "true" ] && ! printf '%s' "$RESERVE" | grep -Eq '^[0-9]+$'; then
            echo "::error::run_now_reserve must be a whole number of requests, not '$RESERVE'."; bad=1; fi
          if [ "$WANT_SWITCH" = "on" ] && [ -z "$(printf '%s' "$NOTE" | tr -d '[:space:]')" ]; then
            echo "::error::data_enabled = on needs enable_note: who read Polymarket's terms of use, when, and the clause. It is recorded in radar_config."; bad=1; fi
          exit $bad

      - name: Install the Supabase CLI
        if: ${{ (inputs.deploy_function || inputs.set_cron_secret || inputs.data_enabled != 'leave') && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt IS LOAD-BEARING: pg_cron sends the x-cron-secret header,
      # not a JWT. A POST without the secret is refused by the function itself;
      # a GET is its public health probe (the build only).
      - name: Deploy polymarket_sync
        if: ${{ inputs.deploy_function && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy polymarket_sync --project-ref "$PROJECT_REF" --no-verify-jwt

      # A deploy is verified by what the function SERVES, not by the CLI's exit
      # code: a bundle that fails leaves the previous version serving.
      - name: The function serves this build
        if: ${{ inputs.deploy_function && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -eu
          ANON=$(node -e "process.stdout.write(require('./games/data/config.json').supabase_anon_key||'')")
          want=$(sed -n 's/^export const BUILD = "\([^"]*\)";.*/\1/p' supabase/functions/polymarket_sync/index.ts | head -1)
          got=""
          for i in $(seq 1 24); do
            got=$(curl -sS -m 15 -H "apikey: $ANON" -H "authorization: Bearer $ANON" "https://$PROJECT_REF.supabase.co/functions/v1/polymarket_sync" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).build||'')}catch(_){}})" || true)
            [ "$got" = "$want" ] && break
            sleep 5
          done
          if [ "$got" != "$want" ]; then echo "::error::polymarket_sync is serving '${got:-nothing}', not '$want', two minutes after the deploy"; exit 1; fi
          echo "polymarket_sync is serving $want"

      - name: Apply radar.sql, radar_registry.sql and radar_record.sql
        if: ${{ inputs.apply_sql && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          for f in supabase/radar.sql supabase/radar_registry.sql supabase/radar_record.sql; do
            # one transaction a file: a statement that fails rolls that file back
            # (the suites apply it the same way, applyFileAtomic)
            out=$(psql "$PGURL" --single-transaction -v ON_ERROR_STOP=1 -f "$f") || { echo "$out" | tail -20; echo "::error::$f did not apply"; exit 1; }
            echo "== $f"; echo "$out" | tail -14
            if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::$f: a report row says CHECK THIS"; exit 1; fi
          done

      # Before the cron: the poke sends the Vault value, so it must exist and the function must accept it.
      - name: The cron secret exists in Vault and on the function, and they agree
        if: ${{ inputs.set_cron_secret && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' && steps.creds.outputs.have_db == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          set -eu
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          FN="https://$PROJECT_REF.supabase.co/functions/v1/polymarket_sync"
          supabase secrets list --project-ref "$PROJECT_REF" > "$RUNNER_TEMP/names.txt" 2>"$RUNNER_TEMP/err.txt" || { cat "$RUNNER_TEMP/err.txt"; echo "::error::supabase secrets list failed: is SUPABASE_ACCESS_TOKEN still valid?"; exit 1; }
          fn_has=no; grep -qw POLYMARKET_SYNC_SECRET "$RUNNER_TEMP/names.txt" && fn_has=yes; rm -f "$RUNNER_TEMP/names.txt"
          vault=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "select decrypted_secret from vault.decrypted_secrets where name = 'polymarket_sync_cron_secret' limit 1")
          if [ -n "$vault" ]; then echo "::add-mask::$vault"; fi
          setfn() { umask 077; f="$RUNNER_TEMP/rd.env"; printf 'POLYMARKET_SYNC_SECRET=%s\n' "$1" > "$f"; supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f" >/dev/null || { rm -f "$f"; echo "::error::supabase secrets set failed"; exit 1; }; rm -f "$f"; }
          if [ -z "$vault" ]; then
            vault=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
            echo "::add-mask::$vault"
            echo "select vault.create_secret(:'sec', 'polymarket_sync_cron_secret');" | psql "$PGURL" -q -v ON_ERROR_STOP=1 -v sec="$vault" >/dev/null
            setfn "$vault"
            echo "Vault had no polymarket_sync_cron_secret: a new one was generated on this runner and set in Vault and on the function (never printed)."
          elif [ "$fn_has" = no ]; then
            setfn "$vault"
            echo "The function had no POLYMARKET_SYNC_SECRET: it was set to the Vault value."
          else
            echo "Vault and the function both hold a cron secret: checking that they agree."
          fi
          # a probe with the Vault value: 401 means the two disagree. A dry run
          # writes no market, trade or bet; while the switch is off it asks
          # Polymarket nothing. A run_id in the answer means the secret was accepted.
          probe() { curl -sS -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' -X POST "$FN" -H 'content-type: application/json' -H "x-cron-secret: $vault" -d '{"mode":"tonight","dry":true}' || true; }
          ok=no; code=000
          for i in $(seq 1 15); do
            code=$(probe)
            if { [ "$code" = 200 ] || [ "$code" = 500 ]; } && grep -q '"run_id"' "$RUNNER_TEMP/probe.json"; then ok=yes; break; fi
            if [ "$code" = 401 ] && [ "$i" = 4 ]; then setfn "$vault"; echo "The function refused the Vault value: its secret was set to it."; fi
            sleep 6
          done
          vault=""
          if [ "$ok" != yes ]; then echo "::error::polymarket_sync did not accept the cron secret (last answer HTTP $code)"; head -c 400 "$RUNNER_TEMP/probe.json"; echo; exit 1; fi
          echo "polymarket_sync accepts the cron secret (probe answered HTTP $code):"
          node -e "const j=require(process.argv[1]);console.log(JSON.stringify({ok:j.ok,build:j.build,mode:j.mode,dry:j.dry,status:j.status,message:j.message}))" "$RUNNER_TEMP/probe.json" || true
          rm -f "$RUNNER_TEMP/probe.json"

      # Both halves, the function's first: Radar asks nothing unless both say on,
      # so turning on is safe in this order and turning off takes effect at the
      # database half at once.
      - name: Set POLYMARKET_DATA_ENABLED (both halves)
        if: ${{ inputs.data_enabled != 'leave' && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' && steps.creds.outputs.have_db == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGURL: ${{ secrets.SB_DB_URL }}
          VAL: ${{ inputs.data_enabled }}
          NOTE: ${{ inputs.enable_note }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          supabase secrets set --project-ref "$PROJECT_REF" "POLYMARKET_DATA_ENABLED=$VAL" >/dev/null
          note="${NOTE:-turned $VAL} (deploy-radar.yml, $RUN)"
          out=$(echo "update public.radar_config set value = :'val', note = :'note', updated_at = now() where key = 'POLYMARKET_DATA_ENABLED' returning key, value;" \
            | psql "$PGURL" -qAt -v ON_ERROR_STOP=1 -v val="$VAL" -v note="$note")
          if [ "$out" != "POLYMARKET_DATA_ENABLED|$VAL" ]; then echo "::error::radar_config has no POLYMARKET_DATA_ENABLED row (apply supabase/radar.sql first): got '$out'"; exit 1; fi
          now=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "select public.radar_enabled()")
          echo "POLYMARKET_DATA_ENABLED is $VAL on the function and in radar_config (radar_enabled() = $now)."

      - name: Apply the cron (the four schedules)
        if: ${{ inputs.apply_cron && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/polymarket_sync_cron.sql) || { echo "$out" | tail -20; echo "::error::polymarket_sync_cron.sql did not apply"; exit 1; }
          echo "== supabase/polymarket_sync_cron.sql"; echo "$out" | tail -8
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::polymarket_sync_cron.sql: a report row says CHECK THIS"; exit 1; fi

      # The overnight work, now. Each call is awaited before the next (curl waits
      # for the function's answer), so no two wallet calls ever overlap.
      - name: Run the pool, the wallets and the grade now (one call at a time)
        if: ${{ inputs.run_now && steps.creds.outputs.have_ref == 'yes' && steps.creds.outputs.have_db == 'yes' }}
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGURL: ${{ secrets.SB_DB_URL }}
          RESERVE: ${{ inputs.run_now_reserve }}
        run: |
          set -eu
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          FN="https://$PROJECT_REF.supabase.co/functions/v1/polymarket_sync"
          sec=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "select decrypted_secret from vault.decrypted_secrets where name = 'polymarket_sync_cron_secret' limit 1")
          if [ -z "$sec" ]; then echo "::error::Vault has no polymarket_sync_cron_secret: run this workflow with set_cron_secret first"; exit 1; fi
          echo "::add-mask::$sec"
          # one call, awaited: prints one line, leaves the answer in run.json, succeeds on HTTP 200
          call() {
            code=$(curl -sS -m 420 -o "$RUNNER_TEMP/run.json" -w '%{http_code}' -X POST "$FN" -H 'content-type: application/json' -H "x-cron-secret: $sec" -d "{\"mode\":\"$1\"}" || echo 000)
            node -e "let j={};try{j=require(process.argv[1])}catch(_){};const d=j.details||{},g=d.gateway||{};console.log([process.argv[2],'HTTP '+process.argv[3],j.status||'no answer',d.wallets?d.wallets.length+' wallet(s)':'',g.requests!=null?g.requests+' request(s)':'',(j.alerts||[]).map((a)=>a.severity+':'+a.code).join(' '),j.message||''].filter(Boolean).join(' · '))" "$RUNNER_TEMP/run.json" "$1" "$code"
            [ "$code" = 200 ]
          }
          field() { node -e "let j={};try{j=require(process.argv[1])}catch(_){};const v=process.argv[2].split('.').reduce((o,k)=>o==null?o:o[k],j);process.stdout.write(Array.isArray(v)?String(v.length):String(v==null?'':v))" "$RUNNER_TEMP/run.json" "$1"; }
          # today's Polymarket requests not yet granted (the gateway's own ledger, the UTC day it keeps)
          left() { psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "select (public.radar_rules() ->> 'daily_request_ceiling')::int - coalesce((select granted from public.poly_api_days where day = (now() at time zone 'utc')::date), 0)"; }

          echo "== the pool"
          call pool || { echo "::error::the pool call did not answer 200"; exit 1; }
          case "$(field status)" in ok|warn) ;; *) echo "::error::the pool run ended '$(field status)': $(field message)"; exit 1;; esac

          echo "== the wallets, 3 a call, one call at a time"
          # A call that fails (a wallet ran it out of compute: HTTP 546) leaves that wallet set aside by the
          # function's attempt mark, so the next call goes on with the rest; three failures in a row stop the
          # calls. The grade runs either way, and the step ends red if any call failed.
          # A grade also runs after every 25 good wallet calls (it asks Polymarket nothing), so the site shows
          # what is synced so far, and the wallet calls stop after 5 hours, so the last grade runs well inside
          # GitHub's 6-hour job limit: a long run never loses its grade.
          n=0; failed=0; streak=0; good=0; gfailed=0; t0=$(date +%s); stop_after=$((300 * 60)); grade_every=25
          while :; do
            if [ $(($(date +%s) - t0)) -ge "$stop_after" ]; then echo "Stopping the wallet calls after 5 hours, so the grade runs inside GitHub's 6-hour job limit. The 06:10 UTC schedule takes the wallets still due."; break; fi
            l=$(left)
            if [ "$l" -lt "$RESERVE" ]; then echo "Stopping the wallet calls: $l of today's requests are left, under the $RESERVE kept for the tonight runs. The 06:10 UTC schedule takes the wallets still due."; break; fi
            n=$((n + 1))
            if call wallets && [ "$(field status)" != error ]; then streak=0; good=$((good + 1)); else
              failed=$((failed + 1)); streak=$((streak + 1))
              echo "::warning::wallet call $n failed (HTTP $code). The wallet it died on is set aside; the next call goes on."
              if [ "$streak" -ge 3 ]; then echo "::error::three wallet calls in a row failed: stopping the wallet calls"; break; fi
              continue
            fi
            if [ "$(field status)" = skipped ]; then echo "Stopping the wallet calls: call $n was skipped ($(field message))."; break; fi
            if [ "$(field details.wallets)" = 0 ]; then sk=$(field details.skipped); echo "No wallet is due now (${sk:-0} set aside after a failed run; each is read again later)."; break; fi
            if [ "$n" -ge 300 ]; then echo "Stopping after 300 wallet calls."; break; fi
            if [ $((good % grade_every)) -eq 0 ]; then
              echo "== a grade along the way, after $good good wallet calls"
              if ! { call grade && [ "$(field status)" != error ]; }; then gfailed=$((gfailed + 1)); echo "::warning::the grade after $good wallet calls did not finish (HTTP $code): the wallet calls go on, and the grade runs again"; fi
            fi
          done

          echo "== the grade"
          call grade || { echo "::error::the grade call did not answer 200"; exit 1; }
          if [ "$(field status)" = error ]; then echo "::error::the grade ended in error: $(field message)"; exit 1; fi
          echo "== the holders and the cards (tonight), once, now"
          tfailed=0
          if ! { call tonight && [ "$(field status)" != error ]; }; then
            echo "::error::the tonight run did not finish (HTTP $code): $(field message)"; tfailed=1; fi
          sec=""
          echo "== where it stands"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "select (select count(*) from public.poly_wallets where in_pool) as pool_wallets, (select count(*) from public.poly_wallets where in_pool and activity_synced_at is not null) as synced, (select count(*) from public.poly_wallets where in_pool and activity_cursor ? 'attempt_at') as set_aside, g.wallets as graded, g.ranked, g.top_directional, g.finished_at as graded_at from public.poly_grade_runs g order by g.finished_at desc limit 1"
          if [ "$gfailed" -gt 0 ]; then echo "::error::$gfailed grade(s) along the way did not finish (the last grade above still ran)"; fi
          if [ "$failed" -gt 0 ]; then echo "::error::$failed wallet call(s) failed (the grade above still ran)"; fi
          if [ "$failed" -gt 0 ] || [ "$gfailed" -gt 0 ] || [ "$tfailed" -gt 0 ]; then exit 1; fi

      - name: Where Radar stands, stage by stage (read-only)
        if: ${{ always() && inputs.report && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          set -eu
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          psql "$PGURL" -v ON_ERROR_STOP=1 -P pager=off -f tools/radar/sql/radar_pipeline_report.sql
          echo "== the schedules (pg_cron), and how each ran in the last 24 hours"
          psql "$PGURL" -v ON_ERROR_STOP=1 -P pager=off -c "select j.jobname, j.schedule, j.active, (select d.status || ' ' || to_char(d.start_time at time zone 'utc', 'MM-DD HH24:MI') || ' UTC' from cron.job_run_details d where d.jobid = j.jobid order by d.start_time desc limit 1) as last_run, (select count(*) from cron.job_run_details d where d.jobid = j.jobid and d.start_time > now() - interval '24 hours') as runs_24h, (select count(*) from cron.job_run_details d where d.jobid = j.jobid and d.start_time > now() - interval '24 hours' and d.status <> 'succeeded') as not_succeeded_24h from cron.job j where j.jobname like 'polymarket_sync%' order by j.jobname"
          # pg_cron only queues the call (pg_net); what the function answered, while pg_net keeps it (6 hours)
          echo "== what polymarket_sync answered the schedules (pg_net, while it keeps the responses)"
          psql "$PGURL" -v ON_ERROR_STOP=1 -P pager=off -c "select coalesce(status_code::text, 'none') as http, coalesce(left(error_msg, 80), '') as error, timed_out, count(*) as calls, to_char(max(created) at time zone 'utc', 'MM-DD HH24:MI') as latest_utc from net._http_response where created > now() - interval '24 hours' and (content like '%polymarket_sync@%' or content like '%POLYMARKET%' or status_code in (500, 502, 503, 504, 546) or error_msg is not null or timed_out) group by 1, 2, 3 order by calls desc limit 12" \
            || echo "(net._http_response could not be read with this connection)"
          # the grade's style query (radar_style_stats), timed for the pool wallet with the most trades: read-only
          w=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "select wallet from public.poly_trades where wallet in (select wallet from public.poly_wallets where in_pool) and traded_at > now() - interval '365 days' group by wallet order by count(*) desc limit 1")
          if [ -n "$w" ]; then
            echo "== radar_style_stats for the pool wallet with the most trades (${w:0:6}…): its plan, run read-only with a 60 s limit"
            psql "$PGURL" -v ON_ERROR_STOP=1 -P pager=off -c "set statement_timeout = '60s'; explain (analyze, buffers, costs off, timing on) select * from public.radar_style_stats('$w', now() - interval '365 days')" \
              -c "set statement_timeout = '60s'; explain (analyze, buffers, costs off) select t.condition_id, count(*) from public.poly_trades t join public.poly_markets m on m.condition_id = t.condition_id where t.wallet = '$w' and t.traded_at >= now() - interval '365 days' and m.league in (select jsonb_array_elements_text(public.radar_rules() -> 'leagues')) and m.market_type in (select jsonb_array_elements_text(public.radar_rules() -> 'market_types')) group by t.condition_id" \
              || echo "(the style query did not finish within 60 s)"
          fi
