# EdgeDesk Portfolio — the checks that gate every change to the reader's own
# betting and prediction-market ledger.
#
#   suites      the calculation engine (exact decimals, sportsbook and
#               prediction-market P&L, aggregation), the CSV importer and the
#               connector contract, and the page rendered in Node — offline.
#   migration   supabase/portfolio.sql applied TWICE to a throwaway PostgreSQL
#               on the runner, attacked as another reader, as anon and as the
#               service role; every derived figure held in parity with the
#               browser's engine; the import pipeline end to end.
#   browser     app.html in Chromium (1280 px and a 390 px phone) against that
#               real migration through a PostgREST stand-in.
#
# Nothing here deploys or writes anywhere. Deploying is
# .github/workflows/deploy-portfolio.yml, run by hand.
name: Portfolio tests

on:
  pull_request:
    paths:
      - 'lib/edgedesk_portfolio*.js'
      - 'lib/edgedesk_bet_history.js'
      - 'lib/edgedesk_portfolio.css'
      - 'lib/edgedesk_decision_record.js'
      - 'lib/edgedesk_decision_ui.js'
      - 'lib/edgedesk_decision.css'
      - 'lib/edgedesk_workspace_ui.js'
      - 'lib/edgedesk_personal_ui.js'
      - 'tools/portfolio/**'
      - 'tools/personal/_pg.js'
      - 'tools/games/sql/supabase_shim.sql'
      - 'tools/sql/split_sql.js'
      - 'supabase/portfolio.sql'
      - 'supabase/portfolio_journal.sql'
      - 'supabase/portfolio_connect.sql'
      - 'supabase/portfolio_decision.sql'
      - 'supabase/portfolio_aggregator.sql'
      - 'supabase/portfolio_model_context.sql'
      - 'supabase/model_pnl*.sql'
      - 'supabase/personal_research.sql'
      - 'supabase/parts/portfolio.part*.sql'
      - 'supabase/parts/portfolio_journal.part*.sql'
      - 'supabase/parts/portfolio_connect.part*.sql'
      - 'supabase/parts/portfolio_decision.part*.sql'
      - 'supabase/parts/portfolio_aggregator.part*.sql'
      - 'supabase/functions/portfolio_connect/**'
      - 'supabase/functions/sharpsports-webhook/**'
      - 'app.html'
      - 'package.json'
      - '.github/workflows/portfolio-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/edgedesk_portfolio*.js'
      - 'lib/edgedesk_bet_history.js'
      - 'lib/edgedesk_decision_record.js'
      - 'tools/portfolio/**'
      - 'supabase/portfolio.sql'
      - 'supabase/portfolio_journal.sql'
      - 'supabase/portfolio_connect.sql'
      - 'supabase/portfolio_decision.sql'
      - 'supabase/portfolio_aggregator.sql'
      - 'supabase/portfolio_model_context.sql'
      - 'supabase/functions/portfolio_connect/**'
      - 'supabase/functions/sharpsports-webhook/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The calculation engine (exact money, both instruments, the whole book)
        run: node tools/portfolio/portfolio_calc.test.js
      - name: The CSV importer (including leg rows) and the connector contract
        run: node tools/portfolio/portfolio_import.test.js
      - name: Bet-history intelligence (EDBETS) — tickets from leg rows, exact figures, 200 generated sets, the answer and its language guard
        run: node tools/portfolio/bet_history.test.js
      - name: The Decision Grade and the Process Coach (statistics, evidence levels, banned words)
        run: node tools/portfolio/process.test.js
      - name: The page in Node, and its wiring in app.html
        run: node tools/portfolio/portfolio_ui.test.js
      - name: The Decision Grade, Calendar, Journal, Coach and pre-bet views in Node
        run: node tools/portfolio/journal_ui.test.js
      - name: The connector core (registry, contract, vault, Kalshi signing and netting, Polymarket, reconciliation)
        run: node tools/portfolio/connect_core.test.js
      - name: The Decision Record in Node (the record, Card → Record Position, process memory, the baseline, Ask about this decision)
        run: node tools/portfolio/decision_record.test.js
      - name: The app's navigation still holds (seven seats, More, deep links)
        run: node tools/app/navigation.test.js

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The runner image ships PostgreSQL; the suite starts its own throwaway cluster.
      - name: supabase/portfolio.sql against a real PostgreSQL, as real readers
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/portfolio_sql.test.js
      - name: supabase/portfolio_journal.sql — the journal, the grade, the calendar and the cache, as real readers
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/journal_sql.test.js
      - name: supabase/portfolio_connect.sql — the registry switch, the service-only ingest and the vault, as the service role and as readers
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/connect_sql.test.js
      - name: The connectors end to end (fake Kalshi and Polymarket that check signatures → the shipped orchestration → the real migrations), all ten smoke stages
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/connect_sync.test.js
      - name: supabase/functions/portfolio_connect/index.ts, the shipped file, in a stub Deno runtime
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/connect_function.test.js
      - name: SharpSports BetSync end to end — both shipped functions (portfolio_connect, sharpsports-webhook) over the real migrations, against a fake SharpSports
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/sharpsports.test.js
      - name: supabase/portfolio_model_context.sql — EdgeDesk's model on a bet, only as recorded before it was placed
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/model_context_sql.test.js
      - name: supabase/portfolio_decision.sql — immutable snapshots, the market path, lineage, experiments, export and delete, as real readers
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/decision_sql.test.js
      - name: Leg rows through the real import pipeline, and EDBETS over RLS-read rows (parity with the CSV)
        env:
          PORTFOLIO_SQL_REQUIRED: '1'
        run: node tools/portfolio/bet_history_sql.test.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: The Portfolio page in Chromium against the real migrations (portfolio, journal, connect and decision)
        env:
          PORTFOLIO_UI_REQUIRED: '1'
        run: node tools/portfolio/portfolio_ui.e2e.js
      - name: What cost you money, in Chromium — a leg-row import, then Analytics at 1280 px and 390 px
        env:
          PORTFOLIO_UI_REQUIRED: '1'
        run: node tools/portfolio/bet_history.e2e.js
      - name: BetSync in Chromium — Connect a sportsbook, SharpSports' page and back, the linked account, its bets, the bankroll trend
        env:
          PORTFOLIO_UI_REQUIRED: '1'
        run: node tools/portfolio/sharpsports_ui.e2e.js
