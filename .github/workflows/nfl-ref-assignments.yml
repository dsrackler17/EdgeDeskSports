# EdgeDesk Football — the coming week's NFL referee assignments, pulled
# automatically (data/refs/README.md, data/refs/fetch_assignments.py).
#
# The NFL announces each week's crew chiefs on Wednesday or Thursday and
# Football Zebras posts them ("Week N referee assignments"). This job reads
# the post, matches every game of the coming week by its two teams, and writes
# the referees into data/refs/manual_assignments.json (source footballzebras).
# The research snapshots read that file on their next hourly build
# (tools/football/game_context.js), so the matchup graphic names the crew
# chief, his flags per game and his over/under record; then the referee sync
# is dispatched so the NFL card's Officiating block has him too.
#
# WHEN. Wednesday to Friday at 15:17 and 23:17 UTC, Saturday at 13:17 UTC,
# in season. A run that finds the week already assigned, or no post yet,
# changes nothing. A game nflverse or the file already assigns is never
# overwritten; nflverse wins in every build.
#
# BY HAND (Actions -> NFL referee assignments -> Run workflow): pick a week
# to re-read, tick dry to see what it would write.
name: NFL referee assignments

on:
  schedule:
    - cron: '17 15,23 * 9-12,1 3,4,5'   # Wednesday to Friday, in season
    - cron: '17 13 * 9-12,1 6'          # Saturday morning, before the Sunday slate
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to read (empty = the coming week)'
        required: false
        default: ''
      dry:
        description: 'Dry run: read and report, write nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: nfl-ref-assignments
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The rules must pass before they are allowed to write
        run: |
          pip install --quiet pandas pyarrow
          python3 -m unittest discover -s data/refs/tests

      - name: Download nflverse games.csv
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/games.csv" \
            https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv

      - name: Pull the week's referees from Football Zebras
        id: pull
        env:
          WEEK: ${{ inputs.week }}
          DRY: ${{ inputs.dry }}
        run: |
          args=(--games "$RUNNER_TEMP/games.csv" --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python3 data/refs/fetch_assignments.py "${args[@]}"
          if git diff --quiet -- data/refs/manual_assignments.json; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --stat -- data/refs/manual_assignments.json; fi

      - name: The file still reads (snapshots and the referee build)
        if: steps.pull.outputs.changed == 'true'
        run: |
          python3 -c "import json; json.load(open('data/refs/manual_assignments.json'))"
          node tools/football/game_context.test.js

      - name: Publish
        if: steps.pull.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/ci/push_generated.sh main \
            'refs: the coming week'"'"'s NFL referee assignments (Football Zebras)' -- \
            data/refs/manual_assignments.json

      - name: Load them into Supabase (the NFL card's Officiating block)
        if: steps.pull.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ref-sync.yml --ref main || echo "::warning::could not dispatch the referee sync; Tuesday's run will load them"
