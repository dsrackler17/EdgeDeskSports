# EdgeDesk — the personal research job: slate state, alerts, journal grades.
#
# Boots the real football module headlessly (the same host the article
# generator uses), asks it for every upcoming game's research state, and
# writes the result to public.game_research_state. The database's own
# trigger keeps the history of every distinct state. Readers watching a game
# whose state changed get the research-condition alerts they asked for
# (in-app; nothing is emailed). Wagered journal entries whose game has kicked
# off get their close, CLV and — once the committed record has the final —
# their result. The affiliate ledger is reconciled against the Stripe ledger.
#
# It reads CAPTURED quotes only (public.signals, through a read-only reader
# the job supplies), so it spends no odds-provider credit.
#
# Secrets: SB_URL and SB_SERVICE_ROLE, the same two the ingestion jobs use.
# Without them the job refuses to run rather than pretending it wrote.
# Requires supabase/personal_research.sql (and, for the affiliate step,
# supabase/affiliates.sql) to have been run once in the SQL editor.
#
# WHO RUNS IT. GitHub's hourly cron alone ran this every five to eight hours
# (2026-09-28/29: 01:09, 07:34, 15:55, 22:15, 02:16, 08:59, 16:06, 21:00 UTC),
# and the landing page's game lines are only as fresh as the last run. So:
#
#   pg_cron (5 min) ─► supabase/functions/research_cron ─► workflow_dispatch
#                      (dispatches when the newest research state is older
#                       than 55 min, or 25 min inside 24 h of a kickoff;
#                       never twice inside one cadence)
#   the schedule below ─────────────────────────────────► (backup)
#
# Installed by supabase/research_state_cron.sql and the Deploy research
# scheduler workflow. The run name says which one woke a run.
name: Personal research state
run-name: Personal research state · ${{ inputs.source || github.event_name }}

on:
  schedule:
    # THE BACKUP. Thirty-eight past the hour: after the capture day tier has
    # landed new quotes and before the next one.
    - cron: '38 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one step only: states, alerts, grade or affiliates (blank = all)'
        required: false
        default: ''
      source:
        description: 'Who asked for this run (research_cron sends supabase_cron)'
        required: false
        default: 'manual'

permissions:
  contents: read

concurrency:
  group: research-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # room for research_state.js to ride out a database outage of up to 12 min
    # (it retries a transient 5xx / timeout rather than failing the run)
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The alert wording, thresholds, CLV and grading must pass before anything is written
        run: node tools/personal/personal.test.js

      - name: Build states, alert, grade, reconcile
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_SERVICE_ROLE" ]; then
            echo "::error::SB_URL / SB_SERVICE_ROLE are not set — nothing can be written."
            exit 1
          fi
          if [ -n "$ONLY" ]; then
            node tools/personal/research_state.js --network --only "$ONLY"
          else
            node tools/personal/research_state.js --network
          fi
