# EdgeDesk Football — College football availability sync.
#
# College football has no universal injury report, so EdgeDesk builds its own
# availability layer out of public evidence and says exactly how good that
# evidence is. This job reads football/availability/sources.json, collects
# every configured source for every FBS program, resolves each report to a
# real roster player, ranks the evidence and commits the canonical dataset the
# card, the brief, the Full picture and the AI narration all read.
#
# ONE FAILED SOURCE NEVER FAILS THE RUN. A team EdgeDesk could not read is
# recorded as "no verified data", which is a different statement from "no
# reported injuries", and the dataset carries the difference.
#
# Cadence follows the football week (UTC; ET is four hours behind):
#   Sat            hourly            game day
#   Sun 00-05 UTC  hourly            Saturday night ET games finishing
#   Sun, Mon       every six hours   the week resets
#   Tue-Thu        every three hours practice reports land
#   Fri            every two hours   the report firms up
name: Availability sync

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (default: current, Jan/Feb -> prior year)'
        required: false
        default: ''
      teams:
        description: 'Limit to the first N programs (a smoke run)'
        required: false
        default: ''
  schedule:
    - cron: '5 * * * 6'          # Saturday, hourly
    - cron: '5 0-5 * * 0'        # Saturday night ET, hourly
    - cron: '5 6,12,18 * * 0,1'  # Sunday and Monday, every six hours
    - cron: '5 */3 * * 2,3,4'    # Tuesday to Thursday, every three hours
    - cron: '5 */2 * * 5'        # Friday, every two hours

permissions:
  contents: write

concurrency:
  group: availability-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The rules must pass before anything is allowed to write
        run: node football/availability/availability.test.js

      - name: Refresh the source registry
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            node football/availability/build_sources.js --season "${{ github.event.inputs.season }}"
          else
            node football/availability/build_sources.js
          fi

      # A REGISTERED SOURCE THAT DOES NOT ANSWER LOOKS EXACTLY LIKE A TEAM WITH
      # NOBODY HURT. The collector returns zero reports for a 404, for a page
      # that renders its table in JavaScript, and for a school whose whole
      # roster is fit — and only the third of those is good news. This says
      # which. It writes nothing and never fails the sync: a source that
      # stopped answering is worth seeing in the log, and yesterday's dataset
      # is better than no run.
      - name: Prove the registered official sources still answer
        run: node football/availability/fetch_availability.js --verify || true

      - name: Collect availability
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then ARGS="$ARGS --season ${{ github.event.inputs.season }}"; fi
          if [ -n "${{ github.event.inputs.teams }}" ]; then ARGS="$ARGS --teams ${{ github.event.inputs.teams }}"; fi
          node football/availability/fetch_availability.js $ARGS

      # THE CONFERENCE FILINGS, WHICH IS THE PART THAT CHANGED IN 2025.
      #
      # College football has no LEAGUE-WIDE injury report and every sentence in
      # this repository said so. It now has CONFERENCE reports: the SEC, Big
      # Ten, ACC, Big 12, Mountain West, Conference USA and the Sun Belt each
      # require one for conference games, with their own scope, cadence and
      # status vocabulary, and football/availability/policy.js carries which is
      # which. This step asks that registry which fixtures on the current slate
      # have a report REQUIRED and inside its filing window, and fetches only
      # those — so a request that comes back empty is a real failure rather
      # than a question nobody was obliged to answer.
      #
      # A FAILED READ IS RECORDED AS A FAILED READ and never as a report
      # naming nobody, so this step does not fail the sync.
      - name: Ingest the conference availability reports that are due
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then ARGS="$ARGS --season ${{ github.event.inputs.season }}"; fi
          node football/availability/sync_reports.js $ARGS || true

      # Operator corrections are committed by hand; this only reports on them,
      # so a half-filled entry is visible in the log instead of sitting inert.
      - name: Operator corrections on file
        run: node football/availability/record_correction.js --list || true

      - name: Commit the dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # ONE pathspec, and a directory rather than a list. `git add a b c`
          # stages NOTHING AT ALL if any single path is missing, and the
          # `|| true` then swallowed the error: every run wrote the dataset,
          # staged none of it, reported 'availability unchanged', and went
          # green. That is why football/availability/current.json was never in
          # the repo despite a successful sync. -A picks up new, changed and
          # deleted files under the directory and cannot fail on a path that
          # does not exist yet.
          git add -A -- football/availability/
          if git diff --cached --quiet; then
            echo 'availability unchanged — nothing to commit'
            exit 0
          fi
          git commit -m 'availability sync: college football player availability'
          for i in 1 2 3 4; do
            git push origin "${{ github.ref_name }}" && exit 0
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((2 ** i))
          done
          echo 'could not push the availability dataset after 4 attempts'
          exit 1
