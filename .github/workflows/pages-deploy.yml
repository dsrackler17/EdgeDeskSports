# EdgeDesk — publish the site (edgedesksports.com) to GitHub Pages.
#
# Why this replaces Pages' own "Deploy from a branch" build: that build runs
# for every push to main and CANCELS the one in progress. The data jobs push
# every few minutes and a build takes about four, so on 2026-10-28 23 builds
# in a row were cancelled (19:54 to 20:38 UTC) and the site kept serving a
# 19:49 copy through three merges. Here the deploy in progress always
# finishes (cancel-in-progress: false). Of the runs waiting behind it GitHub
# keeps only the newest (the others show as cancelled), so the newest main
# always goes out next.
#
# When it runs:
#   - a merge to main (push);
#   - when any workflow that pushes to main finishes (workflow_run). The data
#     jobs push with GITHUB_TOKEN, which starts no workflow, and GitHub's own
#     cron fires about once every 4 to 7 hours in this repository (the data
#     jobs themselves are dispatched by Supabase pg_cron), so their finishing
#     is the signal. tools/ci/pages_deploy.test.js fails when a workflow that
#     pushes to main is missing from the list;
#   - hourly, as a backstop GitHub may skip;
#   - by hand (workflow_dispatch).
#
# This is the only workflow that deploys the site. The Pages settings screen
# offers starter workflows ("Configure"); adding one makes two deploys race
# in the same queue (jekyll-gh-pages.yml and static.yml, added 2026-10-28; the
# second uploading the repository without the Jekyll build). The test fails
# on any other workflow that deploys Pages or uses the "pages" group.
#
# The same build as before: actions/jekyll-build-pages over the repository
# root, as Pages' branch build did (the repository has no .nojekyll), so the
# site's files and paths do not change.
#
# Inert until Settings > Pages > Source is "GitHub Actions": the first job
# reads the Pages source and, while it is still the branch, deploys nothing
# and says so in the run's summary (Pages refuses an Actions deploy then).
# docs/ci/README.md, "Publishing the site".
name: Pages deploy

on:
  push:
    branches: [main]
  workflow_run:
    # every workflow that pushes to main, by its name:
    workflows:
      - "App version"
      - "Availability sync"
      - "CFB Model Lab"
      - "CFB referee sync"
      - "CFB SP+ weekly sync"
      - "CFB V2 shadow"
      - "CLV live tracking"
      - "CLV opening lines"
      - "College baseball prices"
      - "College baseball research build"
      - "College baseball research validate"
      - "Collegiate backfill (daily)"
      - "Collegiate probe"
      - "Collegiate rosters and portal (weekly)"
      - "EdgeDesk features run"
      - "Editorial system"
      - "Football enrichment refresh"
      - "Football feature validation"
      - "Football model record"
      - "Football regrade (football-v2)"
      - "Football situational pipeline"
      - "Football weekly build"
      - "Games challenge board"
      - "Grade published briefs"
      - "Independent projections build"
      - "Injury sync"
      - "Learning loop"
      - "Linemaker build"
      - "Linemaker calibrate"
      - "MLB historical archives (pitching and offense)"
      - "Model health & daily learning"
      - "Model loop basketball (weekly)"
      - "Model loop CFB (weekly)"
      - "Model loop college baseball (weekly)"
      - "Model loop engines (weekly report)"
      - "Model loop health"
      - "Model loop MLB (weekly)"
      - "Model loop NFL (weekly)"
      - "Model loop UFC (per event)"
      - "Model performance"
      - "Multi-sport lab build"
      - "Multi-sport lab validate"
      - "NBA engine build"
      - "NBA engine validate"
      - "NCAAM forecast (daily)"
      - "NCAAM forecast (weekly challengers)"
      - "NCAAW forecast (daily)"
      - "NCAAW forecast (weekly challengers)"
      - "NFL Coaching Staff validation"
      - "NFL market structure"
      - "NFL referee assignments"
      - "NFL referee sync"
      - "NFL weekly loop"
      - "NHL engine build"
      - "NHL engine validate"
      - "Player props"
      - "Props factory"
      - "Publish research articles"
      - "Rating sync"
      - "Record P&L"
      - "Research newsletter"
      - "Roster sync"
      - "Settle finished games"
      - "Simulator sports data"
      - "Starter context and research profiles"
      - "Today's Games slate"
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pages: read
    outputs:
      actions: ${{ steps.src.outputs.actions }}
    steps:
      - name: Read the Pages source
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          type=$(gh api "repos/$REPO/pages" --jq '.build_type')
          if [ "$type" = "workflow" ]; then
            echo "actions=true" >> "$GITHUB_OUTPUT"
          else
            echo "actions=false" >> "$GITHUB_OUTPUT"
            echo "Nothing deployed: Pages still builds from the branch (build_type: $type). Set Settings > Pages > Source to GitHub Actions (docs/ci/README.md, Publishing the site)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: source
    if: needs.source.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build with Jekyll, as Pages' branch build did
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
