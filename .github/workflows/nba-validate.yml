# NBA engine — the weekly validation (see nba.yml for what it does).
# Its own workflow, split from nba.yml (which keeps the tests), so a pull
# request or a push never lists this scheduled job as Skipped. The job is
# unchanged; it runs on its schedule or by hand (Actions → Run workflow).
name: NBA engine validate
run-name: NBA engine validate · ${{ github.event_name }}

on:
  schedule:
    - cron: '37 12 * * 3'   # validate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    concurrency:
      group: nba-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyarrow
      - uses: actions/cache@v4
        with:
          path: |
            .cache/nba_src
            .cache/nba_work
          key: nba-work-${{ github.run_id }}
          restore-keys: nba-work-
      - name: Every season since 2002-03 (≈550 MB of public parquet; cached between runs)
        run: node --max-old-space-size=6144 nba/ingest/season.js --season all
      - name: The SEALED walk-forward record (selection window), the props record, the live parameters
        run: |
          node --max-old-space-size=12000 nba/model/walkforward.js
          # the props record keeps its scored test window while its specification (state.js, model.js,
          # walkforward.js) is the one logged at the unsealing; a changed specification is re-run sealed
          if node -e "const fs=require('fs'),c=require('crypto'),p=require('path');const h=c.createHash('sha256').update(['state.js','model.js','walkforward.js'].map((f)=>fs.readFileSync(p.join('nba/props',f),'utf8')).join('\n')).digest('hex');let l=null;try{l=JSON.parse(fs.readFileSync('nba/validation/holdout_log.json','utf8')).unsealings.filter((u)=>u.scope==='props').pop();}catch(_){}process.exit(l&&l.spec_hash===h?0:1)"; then
            echo "props specification unchanged since its logged unsealing: the props record is kept"
          else
            node --max-old-space-size=12000 nba/props/walkforward.js
          fi
          node --max-old-space-size=12000 nba/model/live.js
      - name: Rebuild the slate and the props on the new parameters
        run: node --max-old-space-size=12000 nba/build_slate.js && node --max-old-space-size=12000 nba/props/build_props.js && node nba/grade_ledger.js
      - name: The checks pass on the new record before anything commits
        run: node nba/model/walkforward.js --check && node nba/props/walkforward.js --check && node nba/build_slate.js --check && node tools/nba/nba.test.js
      - name: Commit (tools/ci/push_generated.sh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # build_slate.js rewrites nba/roster_inputs.json with the slate; the two
          # are committed together, or nba_injury_sync prices against a stale
          # baseline (and build_slate.js --check fails on main)
          bash tools/ci/push_generated.sh main "nba: weekly walk-forward record and live parameters" -- \
            nba/data nba/params nba/validation nba/slate.json nba/recent.json nba/props_slate.json nba/ledger nba/roster_inputs.json
