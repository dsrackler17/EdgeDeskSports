# Deploy the MLB offensive promote gate fix: supabase/fix_slow_promote_mlb.sql.
#
# WHY THIS EXISTS. "MLB historical archives" (mlb-pitchers.yml) rebuilds,
# validates and stages the offensive dataset every night and then dies in the
# gate: RPC mlbhist.promote_offense_import -> 500 {"code":"57014", "canceling
# statement due to statement timeout"} (red on every run from 2026-10-18, and
# from 2026-10-06 before that). supabase/fix_slow_promote_mlb.sql (2026-10-11)
# is the fix, and its header has the plan, the timings and the proof, but it
# was never applied to production: the job stayed red and the site kept
# serving the previous offensive dataset. Same root cause as
# deploy-record-pnl.yml's header: "merged" and "running" were two different
# facts with nothing connecting them.
#
# MANUAL ON PURPOSE (workflow_dispatch), like every deploy-*.yml: applying SQL
# to production is a decision a person makes.
#   apply: false (default)  read only: says whether production runs the old
#                           gate, the new one, or none
#   apply: true             the two suites that prove the fix must pass against
#                           a throwaway PostgreSQL (neither may skip); then the
#                           file is applied in one transaction with
#                           ON_ERROR_STOP, a report row reading CHECK THIS fails
#                           the run, and the check runs again
# The file replaces one function, re-states its grants and clears only staging
# left by offensive imports that never promoted (opened over six hours ago). No
# live table is written. The next scheduled MLB run (or Run workflow on "MLB
# historical archives", commit checked) then promotes.
#
# SECRETS (the ones the other deploy workflows already use):
#   SB_DB_URL    the pooled Postgres connection string
name: Deploy MLB offensive gate fix

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply supabase/fix_slow_promote_mlb.sql to production (idempotent, no live table written). Unchecked: a read-only check'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-mlb-offense-gate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check the credentials exist before claiming anything
        env:
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          # Presence only. No value is ever printed.
          if [ -z "$DBURL" ]; then echo "::error::SB_DB_URL is not set: the fix cannot be checked or applied from CI. Add it in Settings > Secrets and variables > Actions, or paste supabase/parts/fix_slow_promote_mlb.part1-of-3.sql and the parts after it, in order, into the SQL editor."; exit 1; fi

      - name: Which gate does production run? (read only)
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: bash tools/mlb/offense_gate_state.sh

      - name: The fix must pass against a throwaway PostgreSQL before it touches production
        if: ${{ inputs.apply }}
        env:
          PGPASSWORD: postgres
          EDGD_PG: -h 127.0.0.1 -p 5432 -U postgres
        run: |
          set -o pipefail
          node tools/mlb/mlb_offense_sql.test.js | tee sql.log
          node tools/mlb/offense_import.test.js | tee import.log
          # both suites SKIP and pass without PostgreSQL; here that would prove nothing
          for f in sql.log import.log; do
            if grep -q '^SKIP' "$f" || ! grep -q '^PASS' "$f"; then echo "::error::$f: the suite did not run against PostgreSQL"; exit 1; fi
          done

      - name: Apply supabase/fix_slow_promote_mlb.sql (one transaction)
        if: ${{ inputs.apply }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/fix_slow_promote_mlb.sql 2>&1); then
            echo "$out" | tail -20
            echo "::error::supabase/fix_slow_promote_mlb.sql did not apply (rolled back; production is unchanged)"
            exit 1
          fi
          echo "$out" | tail -14
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::a report row says CHECK THIS"; exit 1; fi

      - name: Which gate does production run now?
        if: ${{ inputs.apply }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: bash tools/mlb/offense_gate_state.sh
