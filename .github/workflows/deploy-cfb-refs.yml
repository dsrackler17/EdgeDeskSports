# Deploy CFB referee flags: supabase/cfb_refs.sql (tables, merge rules, views) and
# the seed, data/refs/cfb/cfb_ref_game_penalties.csv (2,366 games, upsert on
# game_id) with the ESPN backfill in data/refs/cfb/backfill/espn_backfill.csv laid
# over it. Display only (README §CFB referee flags).
#
# MANUAL ON PURPOSE, as every deploy-*.yml here: tests first, then the SQL, then
# the seed, then the report again. A report row that says CHECK THIS fails the
# job; row 7 says pending until the seed has run. The seed also checks every ESPN
# game id against cfb.games (the CFB module's ids) and logs the misses, and ends
# with referee coverage by season.
#
# SECRETS (the same ones the other deploys use):
#   SB_DB_URL                    to apply the SQL (or paste supabase/cfb_refs.sql
#                                into the SQL editor and untick apply_sql)
#   SB_URL, SB_SERVICE_ROLE      to seed (cfb_ref_merge_games, service role only)
name: Deploy CFB refs

on:
  workflow_dispatch:
    inputs:
      apply_sql:
        description: 'Apply supabase/cfb_refs.sql (idempotent)'
        type: boolean
        default: true
      seed:
        description: 'Seed the 2,366 games and the ESPN backfill (upsert on game_id)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-cfb-refs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas requests

      - name: The tool, the migration and the card must pass before anything ships
        env:
          CFB_REFS_SQL_REQUIRED: '1'
        run: |
          python3 -I tools/refs/test_cfb_refs.py
          node tools/refs/cfb_refs_sql.test.js
          node tools/refs/cfb_refs_ui.test.js

      - name: Check the credentials exist before claiming anything
        id: creds
        env:
          DBURL: ${{ secrets.SB_DB_URL }}
          URL: ${{ secrets.SB_URL }}
          KEY: ${{ secrets.SB_SERVICE_ROLE }}
        run: |
          # Presence only. No value is ever printed.
          echo "have_db=$([ -n "$DBURL" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "have_rest=$([ -n "$URL" ] && [ -n "$KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          if [ -z "$DBURL" ]; then echo "::warning::SB_DB_URL is not set — paste supabase/cfb_refs.sql into the SQL editor instead."; fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::SB_URL / SB_SERVICE_ROLE are not set — the seed cannot run from CI."; fi

      - name: Apply the SQL
        if: ${{ inputs.apply_sql && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/cfb_refs.sql)
          echo "$out" | tail -10
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::cfb_refs.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Seed (dataset + ESPN backfill), game-id check, coverage by season
        if: ${{ inputs.seed && steps.creds.outputs.have_rest == 'yes' }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: python3 -I tools/refs/cfb_refs.py seed

      - name: The report, after the seed
        if: ${{ steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/cfb_refs.sql)
          echo "$out" | tail -10
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::cfb_refs.sql: a report row says CHECK THIS"; exit 1; fi
