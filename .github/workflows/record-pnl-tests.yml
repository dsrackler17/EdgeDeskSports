# EdgeDesk Record P&L — the suites a pull request must pass.
#
# The P&L section answers "if I had followed every EdgeDesk recommendation,
# how much would I be up or down?" A change that assumes −110 for a price that
# was never captured, mixes flat and recommended staking, computes ROI as
# anything but net ÷ risked, double-counts a settlement, lets a corrected
# result slip in silently, rewrites a recorded recommendation or exposes a
# reader's bankroll has to fail on the PR that makes it.
name: Record P&L tests

on:
  pull_request:
    paths:
      - 'lib/edgedesk_pnl*.js'
      - 'lib/edgedesk_pnl.css'
      - 'tools/record/pnl*'
      - 'supabase/model_pnl*.sql'
      - 'record/pnl/**'
      - 'football/props/grade.js'
      - 'football/props/verify_ledger.js'
      - 'app.html'
      - 'record.html'
      - '.github/workflows/record-pnl*.yml'
  push:
    branches: [main]
    paths:
      - 'lib/edgedesk_pnl*.js'
      - 'tools/record/pnl*'
      - 'supabase/model_pnl*.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-pnl-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The arithmetic (American odds, flat vs staked, ROI, drawdown, streaks, CLV, calibration, sample labels)
        run: node tools/record/pnl.test.js
      - name: The ledger (every source, idempotent rebuilds, corrected scores and stats, frozen recommendations, nothing deleted)
        run: node tools/record/pnl_ledger.test.js
      - name: The database (idempotent upsert, derived P&L, corrections, RLS, SQL/kernel parity, a reader's own dollars)
        env:
          PNL_SQL_REQUIRED: '1'
        run: node tools/record/pnl_sql.test.js
      - name: Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: The Record's P&L section in a real browser (record.html and the app, 375 / 390 / 430 / 768 / 1440 px)
        run: node tools/record/pnl_ui.test.js
