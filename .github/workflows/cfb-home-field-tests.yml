# EdgeDesk CFB one home field — run its suite on the pull request.
#
# The CFB engine learns every home result against the same home field every
# projection adds (football/cfb_p4/home_field.js, GENERATED by
# football/cfb_p4/research/hfa_unify.js). A change that splits the two values
# again, applies the file to a params.js it was not built for, loses the
# version stamp on new projections, or drops the file from the board, the
# board's test harness, the pricing-path freeze or the Model Lab has to fail
# on the PR that makes it.
#
# Offline: the suite reads committed files only; nothing is fetched and
# nothing is written.
name: CFB home field tests

on:
  pull_request:
    paths:
      - 'football/cfb_p4/engine.js'
      - 'football/cfb_p4/params.js'
      - 'football/cfb_p4/home_field.js'
      - 'football/cfb_p4/home_field.test.js'
      - 'football/cfb_p4/research/hfa_unify.js'
      - 'football/validation/cfb_home_field.json'
      - 'football/fbs/build_coverage.js'
      - 'football/cfb_validation/freeze.js'
      - 'football/cfb_validation/versions.jsonl'
      - 'football/cfb_lab/models.js'
      - 'tools/football/_module.js'
      - 'app.html'
      - '.github/workflows/cfb-home-field-tests.yml'
  push:
    branches: [main]
    paths:
      - 'football/cfb_p4/home_field.js'
      - 'football/cfb_p4/params.js'
      - '.github/workflows/cfb-home-field-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-home-field-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: One value, the file is the record, applies only where built, the change is visible
        run: node football/cfb_p4/home_field.test.js
      - name: The rating recursion still matches the python trainer
        run: node football/cfb_p4/tests.js
