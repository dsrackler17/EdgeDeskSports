# Deploy the college basketball forecast's database layer:
# supabase/ncaam_forecast.sql, then optionally the research registration
# supabase/ncaam_forecast_registry.sql.
#
# MANUAL ON PURPOSE (workflow_dispatch). Applying SQL to production is a
# decision a person makes (docs/ncaam-forecast/README.md, "Deploy").
#
# IN ORDER, STOPPING AT THE FIRST PROBLEM
#   1. the SQL suite against a throwaway PostgreSQL (RLS, the premium
#      entitlement failing closed, atomic publication, immutability, the
#      champion pointer, the live gate, the registration);
#   2. refuses unless supabase/simulator.sql is already applied (the premium
#      gate public.sim_viewer_entitled() lives there: deploy-simulator.yml);
#   3. applies supabase/ncaam_forecast.sql in one transaction with
#      ON_ERROR_STOP (idempotent, additive: no table is dropped, no row
#      deleted; a CHECK THIS report row fails the job);
#   4. optionally applies supabase/ncaam_forecast_registry.sql (NCAAM-FORECAST
#      1.0.0 and SIM-NCAAM-TOURNAMENT 0.1.0, EXPERIMENTAL, T3; never promoted).
# Nothing is published here: ncaam-forecast.yml publishes, and only with the
# repository variable NCAAM_FC_PUBLISH = on. Live forecasts stay disabled
# (ncaam_fc_config.live_enabled = 'false').
#
# SECRETS: SB_DB_URL (the pooled Postgres connection string).
name: Deploy NCAAM forecast SQL

on:
  workflow_dispatch:
    inputs:
      apply_registry:
        description: 'Also register NCAAM-FORECAST 1.0.0 and SIM-NCAAM-TOURNAMENT 0.1.0 (EXPERIMENTAL, T3) in the research registry'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-ncaam-forecast
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
      - name: Add postgres to PATH
        run: ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"
      - name: The SQL must pass against a throwaway PostgreSQL before it touches production
        env:
          NCAAM_SQL_REQUIRED: '1'
        run: |
          node basketball/ncaam_forecast/tests/sql.test.js
          node simulator/src/research/build_ncaam_registry_sql.ts --check
          cmp supabase/ncaam_forecast.sql supabase/migrations/20261023180000_ncaam_forecast.sql
      - name: Check the credential exists before claiming anything
        env:
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          # presence only; no value is ever printed
          if [ -z "$DBURL" ]; then echo "::error::SB_DB_URL is not set — paste supabase/ncaam_forecast.sql (then supabase/ncaam_forecast_registry.sql) into the SQL editor instead"; exit 1; fi
      - name: The simulator layer must already be in production
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          has=$(psql "$PGURL" -X -A -t -c "select to_regprocedure('public.sim_viewer_entitled()') is not null" 2>&1) || { echo "::error::could not query the database"; exit 1; }
          if [ "$has" != "t" ]; then echo "::error::public.sim_viewer_entitled() is missing: run 'Deploy simulator SQL' first"; exit 1; fi
      - name: Apply supabase/ncaam_forecast.sql
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/ncaam_forecast.sql 2>&1); then
            echo "$out" | tail -20; echo "::error::supabase/ncaam_forecast.sql did not apply (rolled back)"; exit 1
          fi
          echo "$out" | tail -12
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/ncaam_forecast.sql: a report row says CHECK THIS"; exit 1; fi
      - name: Apply supabase/ncaam_forecast_registry.sql
        if: ${{ inputs.apply_registry }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if ! out=$(psql "$PGURL" -X -q -1 -v ON_ERROR_STOP=1 -f supabase/ncaam_forecast_registry.sql 2>&1); then
            echo "$out" | tail -20; echo "::error::supabase/ncaam_forecast_registry.sql did not apply (rolled back)"; exit 1
          fi
          echo "$out" | tail -10
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::supabase/ncaam_forecast_registry.sql: a report row says CHECK THIS"; exit 1; fi
