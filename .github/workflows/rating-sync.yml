# EdgeDesk Football — canonical FBS power-rating publication.
#
# The national rankings/ETSR build owns the team-strength arithmetic. This job
# only republishes that same rating through football/rating/current.json, the
# legacy contract app.html already reads. One team, one power rating, no second
# cron job quietly recomputing a rival answer from a different model.
#
# Cadence follows the football week (UTC; ET is four hours behind):
#   Sun 09:00 UTC  the week's results are all in — the full weekly rebuild
#   Wed 09:00 UTC  midweek, to pick up roster and availability movement
#   Sat 13:00 UTC  before kickoff, so game day reads a current number
name: Rating sync

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (default: current, Jan/Feb -> prior year)'
        required: false
        default: ''
      seasons:
        description: 'How many seasons of results to read (default 5)'
        required: false
        default: ''
      week:
        description: 'Week number to stamp on the dataset'
        required: false
        default: ''
  schedule:
    - cron: '0 9 * * 0'   # Sunday morning UTC — every result is in
    - cron: '0 9 * * 3'   # Wednesday — roster and availability movement
    - cron: '0 13 * * 6'  # Saturday before kickoff

permissions:
  contents: write

concurrency:
  group: rating-sync
  cancel-in-progress: false

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The rules come before the write: an opponent-adjusted rating that does
      # not adjust for opponent, or a carryover weight that stopped being
      # measured, must never reach the app.
      - name: The rules must pass before anything is allowed to write
        run: node football/rating/edr.test.js

      - name: Publish ETSR through the app rating contract
        run: |
          node football/rating/sync_rankings.js
          node football/rating/sync_rankings.test.js

      # The dataset that just got written has to survive the same rules again —
      # the shipped-file checks in the suite read football/rating/current.json.
      - name: The dataset that was written must itself pass
        run: node football/rating/edr.test.js

      - name: Commit the rating
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # one directory pathspec, not a list: `git add a b` stages nothing
          # at all when either path is missing, which is how the availability
          # sync went green for weeks while committing nothing
          git add -A -- football/rating/
          if git diff --cached --quiet; then
            echo 'rating unchanged — nothing to commit'
            exit 0
          fi
          git commit -m 'rating sync: publish canonical ETSR power rating'
          for i in 1 2 3 4; do
            git push origin "${{ github.ref_name }}" && exit 0
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((2 ** i))
          done
          echo 'could not push the rating dataset after 4 attempts'
          exit 1
