# EdgeDesk — the Sports Media Content Engine.
#
# TWO JOBS
#   tests   on a pull request that touches the engine (or by hand): the core
#           library against the committed research, the database on a real
#           PostgreSQL, the Edge Function as deployed, the weekly job against
#           the database as the service role, and the whole owner flow in
#           Chromium. Nothing here deploys, writes or sends.
#   weekly  Tuesday and Wednesday mornings (and by hand): discover this week's
#           college football and NFL topics from EdgeDesk's committed research
#           and the public RSS headlines, score them, and draft at most
#           `drafts_per_run` (default 2) of the best into the OWNER'S REVIEW
#           QUEUE. It never approves, sends or publishes: the database refuses
#           those doors to the service role. The same week runs once (a lease
#           in the database); `force` re-runs it without duplicating anything.
#           The owner switches it off in /admin/content/ → Settings.
#
# SECRETS (all already used by other workflows; nothing new is required)
#   SB_URL, SB_SERVICE_ROLE   the job's door into the database
#                             (tools/lib/pgrest.js). Missing: a named warning,
#                             nothing done.
#   ANTHROPIC_API_KEY         optional. With it, Claude improves each draft and
#                             the version is kept only if it passes every check.
#                             Without it, EdgeDesk's deterministic writer drafts.
# VARIABLES (optional)
#   CONTENT_ENGINE_MODEL      defaults to claude-opus-5-5
name: Content engine

on:
  schedule:
    # 13:23 UTC Tue/Wed: morning in the US, in time for Thursday CFB and the
    # weekend's NFL. Not on the hour: GitHub's scheduler drops runs there.
    - cron: '23 13 * * 2,3'
  workflow_dispatch:
    inputs:
      run_weekly:
        description: 'Run the weekly discovery and drafting now'
        type: boolean
        default: true
      force:
        description: 'Run again even if this week already ran (nothing is duplicated)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'lib/content_engine.js'
      - 'tools/content/**'
      - 'admin/content/**'
      - 'supabase/content_engine.sql'
      - 'supabase/functions/content_engine/**'
      - 'tools/growth/outbound_auth.js'
      - 'lib/edgedesk_admin_session.js'
      - '.github/workflows/content-engine.yml'

permissions:
  contents: read

concurrency:
  group: content-engine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.run_weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The core — research, discovery, drafts, every check, exports, the page's static guards
        run: node tools/content/content.test.js
      - name: The Edge Function carries the owner check and the core verbatim
        run: node tools/content/inline.js --check
      - name: The database on a real PostgreSQL
        run: node tools/content/content_engine_sql.test.js
      - name: The Edge Function, as deployed, against the database
        run: node tools/content/content_engine_fn.test.js
      - name: The weekly job, as the service role
        run: node tools/content/run.test.js
      - name: Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: The owner's whole flow in a browser — discover, write, review, approve, export, send
        run: node tools/content/content_engine.e2e.js

  weekly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The core's own checks first
        run: node tools/content/content.test.js
      - name: Discover and draft into the owner's review queue
        env:
          EDGD_SB_URL: ${{ secrets.SB_URL }}
          EDGD_SB_SERVICE: ${{ secrets.SB_SERVICE_ROLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_ENGINE_MODEL: ${{ vars.CONTENT_ENGINE_MODEL }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # An empty secret is a loud, named state, never a silent green run.
          missing=""
          [ -n "$EDGD_SB_URL" ] || missing="$missing SB_URL"
          [ -n "$EDGD_SB_SERVICE" ] || missing="$missing SB_SERVICE_ROLE"
          if [ -n "$missing" ]; then
            echo "::warning::Content engine not configured, nothing done. Missing secret(s):$missing (docs/content-engine/README.md)."
            echo "**Content engine:** not configured. Missing secret(s):$missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::notice::ANTHROPIC_API_KEY is not set: drafts are EdgeDesk's deterministic writer only."
          args="weekly --network"
          [ "$FORCE" = "true" ] && args="$args --force"
          node tools/content/run.js $args | tee -a "$GITHUB_STEP_SUMMARY"
