name: Learning loop

# Nightly and unattended: refresh the archives the pricer grades against,
# re-run the pricing and movement validations, grade every quoted price
# against its close, and publish the scorecard. Nothing here promotes a
# tier, a coefficient or a prompt.
#
# Secrets (names only): the repository's SB_URL and SB_SERVICE_ROLE, the same
# pair every other Supabase-reading workflow uses, let the loop read the
# research_packet_pricing view. Without them the scorecard reads
# NO_DATABASE_ACCESS and the archive-only parts still run.

on:
  schedule:
    - cron: '35 9 * * *'   # 09:35 UTC daily, after the overnight nflverse and sportsdataverse refreshes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: NFL feeds (games, team-week, player-week)
        run: node tools/football/fetch_nfl_feeds.js || true

      - name: Closing-line archive and opener ledger (NFL)
        run: node tools/football/build_lines_archive.js || true

      - name: Closing-line archive with openers (CFB)
        run: node tools/football/build_lines_archive.js --sport cfb || true

      - name: Injury archive
        run: node tools/football/build_injury_archive.js || true

      - name: Pricing validation
        run: node tools/football/validate_pricing.js && node tools/football/validate_pricing.js --sport cfb
        continue-on-error: true

      - name: Movement validation
        run: node tools/football/validate_movement.js --sport cfb && node tools/football/validate_movement.js --sport nfl
        continue-on-error: true

      - name: Grade the desk's quotes and publish the scorecard
        env:
          SUPABASE_URL: ${{ secrets.SB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SERVICE_ROLE }}
        run: node tools/intelligence/learning_loop.js

      - name: Commit what changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/ci/push_generated.sh "${GITHUB_REF_NAME}" \
            "learning loop: archives, validations and the scorecard" -- \
            football/pricing football/validation
