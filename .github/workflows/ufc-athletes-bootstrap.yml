# One-off bootstrap for the UFC model's age curve: ESPN answers GitHub's
# runners but not every development sandbox, so the first fighters.csv
# (model_loop/data/ufc/fighters.csv: each fighter's date of birth; espn_fight_history.json.gz:
# each fighter's dated pro fight history) is fetched
# here and committed back to the branch that triggered it. After the first
# run the weekly UFC loop (model-loop-ufc.yml) keeps the file current; this
# workflow is removed before merge.
name: UFC athletes bootstrap

on:
  push:
    branches: ['claude/youthful-goldberg-b4rfsz']
    paths: ['.github/workflows/ufc-athletes-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  athletes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fight histories (ESPN athlete overview)
        run: python3 -m model_loop.adapters.ufc.ingest history
      - name: Dates of birth (fighters not on file yet)
        run: python3 -m model_loop.adapters.ufc.ingest athletes
      - name: Commit the fighter data to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model_loop/data/ufc/fighters.csv model_loop/data/ufc/espn_fight_history.json.gz
          git commit -m "ufc data: fighters' fight histories and dates of birth (ESPN athlete documents)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((2**i)); done
          exit 1
