# The scheduled jobs run from their own workflows (college-baseball-research-build.yml, college-baseball-research-validate.yml),
# so a pull request or a push lists only the tests here, never a Skipped job.
name: College baseball research engine
run-name: College baseball research · ${{ github.event_name }}

# The NCAA Division I baseball research engine (college_baseball/): the
# warehouse, the coverage ledger and data-quality audit, the walk-forward
# validation, the adversarial auditor, the release gates and the board the
# terminal reads (Research → Baseball → NCAA engine).
#
# Every source is free and keyless (sportsdataverse/baseballr-data on
# raw.githubusercontent.com, through engine/http.js: cache, quota, breaker).
# Nothing here spends an odds credit: there is no authorised college-baseball
# market feed, and the no-bypass suite proves these files cannot reach one.
#
# Separate stages (Phase 13): ingestion and pricing run daily in season;
# validation weekly; TUNING ONLY BY HAND (mode=tune), never on a schedule.

on:
  pull_request:
    paths:
      - 'college_baseball/**'
      - 'lib/edgedesk_cbase_ui.js'
      - 'lib/edgedesk_cbase.css'
      - 'tools/college_baseball/**'
      - '.github/workflows/college-baseball-research.yml'
      - '.github/workflows/college-baseball-research-validate.yml'
      - '.github/workflows/college-baseball-research-build.yml'
      - '.github/workflows/college-baseball-prices.yml'
      - 'supabase/cbase_odds_sport.sql'
      - 'supabase/migrations/20261021200000_cbase_odds_sport_row.sql'
      - 'tools/odds/no_bypass.test.js'
  push:
    branches: [main]
    paths:
      - 'college_baseball/lib/**'
      - 'college_baseball/*.js'
      - 'tools/college_baseball/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The engine's tests (synthetic, then the committed artifacts)
        run: node tools/college_baseball/college_baseball.test.js && node tools/college_baseball/loop.test.js && node tools/college_baseball/school_results.test.js && node tools/college_baseball/school_box.test.js && node tools/college_baseball/starters.test.js && node tools/college_baseball/market.test.js
      - name: College baseball's odds row on a real PostgreSQL (registered disabled; nothing bought until authorised)
        env: { CBASE_SQL_REQUIRED: '1' }
        run: node tools/college_baseball/cbase_sql.test.js
      - name: Every committed record reproduces and passes its check
        run: |
          node college_baseball/coverage.js --check
          node college_baseball/rules_evidence.js --check
          node college_baseball/walkforward.js --check
          node college_baseball/build_slate.js --check
      - name: No path to a paid odds provider
        run: node tools/odds/no_bypass.test.js
      - name: The rest of EdgeDesk still works
        run: node tools/app/sports_config.test.js && node tools/site/nav.test.js && node tools/lab/lab.test.js && node tools/engine/engine.test.js
