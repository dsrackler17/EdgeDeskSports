# EdgeDesk Football — the feature walk-forward.
#
# SEPARATE FROM THE WEEKLY BUILD ON PURPOSE. This is the job that decides
# whether a new football feature has earned the right to move a projected
# number, and running that on a schedule would quietly turn "does this predict
# football" into "does this fit the last few months".
#
# So: manual by default. The monthly run is REPORT-ONLY — it recomputes the
# arms and prints them, without writing the registry, so drift is visible
# without anything being promoted behind your back. Promotion happens when a
# human dispatches this with `write: true` and reviews the diff.
#
# TWO KINDS OF ARM, ONE GATE. Most arms are rebuilt inside the walk-forward
# below. The quarterback EPA experiment cannot be — it needs its own cold
# replay of thirteen seasons and its own corpus — so it runs separately,
# publishes football/cfb_p4/research/qb_epa.json, and this job folds that
# artifact through the SAME promote.js rules rather than letting it grade
# itself. `--external` refreshes only those arms and leaves every measured
# verdict alone, which is what makes it safe to run without the full cache.
name: Football feature validation

on:
  workflow_dispatch:
    inputs:
      first: { description: 'First season', required: false, default: '2024' }
      last:  { description: 'Last season',  required: false, default: '2025' }
      tune:  { description: 'Tune seasons, comma separated',    required: false, default: '2024' }
      hold:  { description: 'Holdout seasons, comma separated', required: false, default: '2025' }
      coaching_first: { description: 'CFB coaching first season', required: false, default: '2021' }
      coaching_last:  { description: 'CFB coaching last season', required: false, default: '2025' }
      coaching_tune:  { description: 'CFB coaching tune seasons', required: false, default: '2021,2022,2023' }
      coaching_hold:  { description: 'CFB coaching holdout seasons', required: false, default: '2024,2025' }
      write:
        description: 'Write football/validation/feature-status.json (a promotion decision)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 6 1 * *'    # the first of the month, report-only

permissions:
  contents: write

concurrency:
  group: football-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pyarrow
      - uses: actions/cache@v4
        with:
          path: .cache/football
          key: football-feeds-${{ github.run_id }}
          restore-keys: |
            football-feeds-

      # The quarterback EPA experiment, re-run against the corpus if one is
      # cached. Without a corpus it is skipped and the previously published
      # artifact is what the gate reads — an absent experiment is an absent
      # arm, never a pass.
      - name: Re-run the quarterback EPA experiment, if its corpus is available
        run: |
          if [ -d football/data/cache/fbs_epa/corpus ]; then
            node football/cfb_p4/research/fit_qb_epa.js
          else
            echo 'no FBS EPA corpus cached — the published qb_epa.json is what the gate will read'
          fi

      - name: Walk forward
        run: |
          node --max-old-space-size=8192 football/validation/validate_features.js \
            --first ${{ github.event.inputs.first || '2024' }} \
            --last  ${{ github.event.inputs.last  || '2025' }} \
            --tune  ${{ github.event.inputs.tune  || '2024' }} \
            --hold  ${{ github.event.inputs.hold  || '2025' }} \
            --cache .cache/football \
            ${{ github.event.inputs.write == 'true' && '--write' || '' }}

      - name: CFB Coaching / Program cap walk-forward
        run: |
          node --max-old-space-size=8192 football/rankings/validate_coaching_program.js \
            --first ${{ github.event.inputs.coaching_first || '2021' }} \
            --last  ${{ github.event.inputs.coaching_last  || '2025' }} \
            --tune  ${{ github.event.inputs.coaching_tune  || '2021,2022,2023' }} \
            --hold  ${{ github.event.inputs.coaching_hold  || '2024,2025' }} \
            --cache .cache/football \
            ${{ github.event.inputs.write == 'true' && '--write' || '' }}

      # The published experiments, through the same gate. Runs whether or not
      # the heavy walk-forward above could rebuild its own arms, because it
      # needs neither the cache nor the corpus — only the artifacts.
      - name: Fold the external experiments into the registry
        run: |
          node football/validation/validate_features.js --external \
            ${{ github.event.inputs.write == 'true' && '--write' || '' }}

      - name: Commit the registry, if this run was allowed to write one
        if: ${{ github.event.inputs.write == 'true' }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add football/validation/feature-status.json football/cfb_p4/research/qb_epa.json football/rankings/coaching_program_validation.json
          if git diff --cached --quiet; then echo 'registry unchanged'; exit 0; fi
          git commit -m "football: feature promotion registry"
          git push
