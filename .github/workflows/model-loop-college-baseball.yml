# EdgeDesk model loop, college baseball: the weekly learning loop for the
# served run model (college_baseball/loop.js; research/PROTOCOL.md, amendment
# 2026-10-21). All year: the off-season is when the record has the most to
# teach before February.
#
#   research (Thursday)  catalogue changes walked forward over SELECTION +
#                        VALIDATION (2014-2024); one that lowers log loss by
#                        >= 0.0002 with its 95% interval below zero, Brier and
#                        VALIDATION no worse, is STAGED. The HOLDOUT is never
#                        read.
#   release (by hand)    the owner serves the staged version: walkforward.js
#                        --holdout takes its one look (kept by configuration in
#                        validation/holdout_looks.json) and the record says
#                        what the holdout said.
name: Model loop college baseball (weekly)

# WHO WAKES IT. pg_cron (supabase/cbase_cron.sql) on Thursday at 13:13 UTC, to research
# only. GitHub's own schedule does not fire reliably here, so the one below is the
# BACKUP, the same evening; a research run on a day that already has its record
# (docs/model-loop/college_baseball/weekly/<date>.json) does nothing unless forced.
on:
  schedule:
    - cron: '13 19 * * 4'        # the backup, Thursday 19:13 UTC (pg_cron is primary, 13:13)
  workflow_dispatch:
    inputs:
      mode:
        description: 'research (stage a change) or release (serve the staged version after its holdout look)'
        required: false
        default: 'research'
      force:
        description: 'research again even if today already has its record (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: model-loop-college-baseball
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The engine's and the loop's checks first
        run: node tools/college_baseball/college_baseball.test.js && node tools/college_baseball/loop.test.js
      - name: Research (stage) or release (serve after the holdout look)
        run: |
          today="docs/model-loop/college_baseball/weekly/$(date -u +%F).json"
          if [ "${{ inputs.mode }}" = "release" ]; then
            node --max-old-space-size=6000 college_baseball/loop.js release
          elif [ -f "$today" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "today's research already ran ($today): nothing to do (dispatch with force=true to run it again)"
          else
            node --max-old-space-size=6000 college_baseball/loop.js all
          fi
      # a release rewrites college_baseball/validation/walkforward.json, which engine/registry.json reads
      # college baseball's state from: the registry and board go out with it (on 2026-10-26 the weekly
      # validation pushed that record alone, and every pull request failed until another job rebuilt them)
      - name: The cross-sport registry and board, rebuilt from the released record, and checked (release only)
        if: inputs.mode == 'release'
        run: node engine/build_registry.js && node engine/build_board.js && node engine/build_registry.js --check && node engine/build_board.js --check
      - name: Publish (tools/ci/push_generated.sh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths="docs/model-loop/college_baseball"
          if [ "${{ inputs.mode }}" = "release" ]; then
            paths="$paths college_baseball/validation college_baseball/research/experiments.jsonl engine/registry.json engine/board.json"
            # the registry and board are computed from every sport's record: on a rejected push they are
            # rebuilt on the new tip, never carried from this run (the same step in editorial.yml says why)
            export PUSH_REBUILD='node engine/build_registry.js && node engine/build_board.js'
          fi
          bash tools/ci/push_generated.sh main "model loop: college baseball ${{ inputs.mode || 'research' }}" -- $paths
