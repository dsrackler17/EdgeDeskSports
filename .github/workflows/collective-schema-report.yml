# Print the Collective schema exactly as production serves it: every relation
# with its column names and every routine. No row is read and no value is
# printed. This is the answer to "what IS there?" when a settle or sync run
# refuses because a table or column it expected is not in the schema.
name: Collective schema report
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collective-schema-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ask the database what it holds
        env:
          EDGD_SB_SERVICE: ${{ secrets.SB_SERVICE_ROLE }}
          EDGD_SB_URL: ${{ secrets.SB_URL }}
        run: |
          set -o pipefail
          node tools/collective/schema_report.js | tee schema.txt
          {
            echo '## Collective schema (production)'
            echo '```'
            cat schema.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
