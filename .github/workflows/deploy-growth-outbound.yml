# Deploy the outbound Edge Functions:
#   growth_outbound_send     sends APPROVED drafts, when the owner asks
#   growth_outbound_webhook  relays Resend's events (the DATABASE checks the
#                            signature; the function holds no secret)
#   growth_outbound_optout   every email's opt-out link and its RFC 8058
#                            one-click endpoint (a GET changes nothing)
#   growth_outbound_research the research engine: finds, reads and verifies
#                            (never approves or sends); the owner presses it
#   growth_outbound_draft    the drafting engine: writes drafts the database
#                            accepts into the review queue (never approves or
#                            sends); the owner presses it
#
# MANUAL ON PURPOSE (workflow_dispatch). Shipping the code that can send email
# to real people is a decision a person makes. This workflow never touches the
# database: supabase/growth_outbound.sql is applied by hand in the SQL editor.
#
# WHAT IT DOES, IN ORDER, STOPPING AT THE FIRST PROBLEM
#   1. the functions' own tests — the DEPLOYED files, imported under Node's
#      type stripping against a mocked GoTrue, PostgREST and Resend
#      (tools/growth/outbound_send.test.js, tools/growth/outbound_events.test.js)
#      — and the owner check the send function carries
#      (tools/growth/outbound_auth.test.js), which must be a verbatim copy of
#      tools/growth/outbound_auth.js (tools/growth/inline_outbound_auth.js --check);
#   2. deploys all three with --no-verify-jwt: the send function verifies the
#      owner itself (GoTrue, then growth_outbound_is_owner() asked as the
#      caller) and the browser's CORS preflight carries no token; Resend and a
#      person opting out have no Supabase token at all — their proofs are
#      Resend's signature and the send's own token, checked in the database.
#
# SECRETS (the ones the other deploy workflows already use):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
# And on the Supabase side, usually already set for the newsletter (Supabase
# secrets are shared by every function in the project):
#   RESEND_API_KEY   (the send function only)
#   BRAVE_SEARCH_API_KEY, HUNTER_API_KEY, ANTHROPIC_API_KEY   (the research
#                    function; each optional: without one, that provider is
#                    said to be not set up and nothing is faked)
#   ANTHROPIC_API_KEY (the drafting function too; without it, every draft is
#                    the template)
# None of the three holds a service-role key, and none needs one. The webhook
# signing secret is NOT a function secret: it lives in the database
# (select growth_outbound.set_webhook_secret('whsec_...'), in the SQL editor).
name: Deploy outbound Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-growth-outbound
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The functions and the owner check must pass before they ship
        run: |
          node tools/growth/inline_outbound_auth.js --check
          node tools/growth/outbound_auth.test.js
          node tools/growth/outbound_send.test.js
          node tools/growth/outbound_events.test.js
          OUTBOUND_PG_REQUIRED=1 node tools/growth/outbound_research.test.js
          OUTBOUND_PG_REQUIRED=1 node tools/growth/outbound_draft.test.js

      - name: Check the credentials exist before claiming anything
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Presence only. No value is ever printed.
          echo "have_token=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "have_ref=$([ -n "$REF" ] && echo yes || echo no)"     >> "$GITHUB_OUTPUT"
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not set — the outbound functions cannot be deployed from CI. Deploy them from a terminal instead: supabase functions deploy growth_outbound_send --no-verify-jwt (and growth_outbound_webhook, growth_outbound_optout, growth_outbound_research, growth_outbound_draft)"
            exit 1
          fi

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the outbound functions (send, webhook, opt-out, research, draft)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for fn in growth_outbound_send growth_outbound_webhook growth_outbound_optout growth_outbound_research growth_outbound_draft; do
            supabase functions deploy "$fn" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt
          done
