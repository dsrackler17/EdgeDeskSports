# EdgeDesk Intelligence — is it actually deployed?
#
# THIS REPOSITORY DEPLOYS NOTHING AUTOMATICALLY. Every edge function carries a
# manual `supabase functions deploy <name>` in its header and every .sql file is
# applied by hand, so a merged pull request and a green CI run say nothing at
# all about what is answering at the other end. A report that calls merged code
# "shipped" is guessing.
#
# So this asks the deployment. It reads the function's own ?probe=1, checks the
# ledger table against PostgREST, and fetches the two artifacts the desk reads
# over HTTP. Nothing is written, nothing is deployed, and no secret value is
# printed — credential presence is reported as a boolean, exactly as the
# function's own probe does.
#
# SECRETS: the ones the newsletter workflow already holds.
#   SB_URL           optional; defaults to the project the rest of the repo uses
#   SB_SERVICE_ROLE  optional; without it the ledger check reports UNKNOWN
#                    rather than guessing. The anon key is enough for the rest.
#
# The job fails when something needs doing, so a scheduled run is a standing
# answer to "is the thing I merged the thing that is running".
name: Intelligence doctor

on:
  workflow_dispatch:
    inputs:
      probe_answer:
        description: "Also send ONE real question to the deployment and report the shape of the reply"
        type: boolean
        default: false
      question:
        description: "The question to send (blank = the reported North Texas / Texas State one)"
        type: string
        required: false
  schedule:
    # Once a day, off the hour for the reason editorial.yml documents.
    - cron: '17 14 * * *'

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ask the deployment what it is running
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: |
          node tools/intelligence/deploy_doctor.js | tee doctor.txt
        continue-on-error: true

      - name: Put the answer in the run summary
        if: always()
        run: |
          {
            echo '## Intelligence deployment'
            echo '```'
            cat doctor.txt 2>/dev/null || echo 'the doctor produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # WHAT IT IS RUNNING IS NOT WHAT IT ANSWERS.
      # The doctor above establishes the build. This asks the deployment the
      # question a customer asked and reports the SHAPE of the reply — did the
      # writing model answer, did the four sections arrive, did any internal
      # label leak into the prose, and was a deterministic read served when
      # narration failed. No secret is printed and the answer is summarised,
      # never dumped, so a public run log is not a copy of someone's research.
      - name: Ask the deployment the customer's question
        if: ${{ inputs.probe_answer }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: |
          node tools/intelligence/probe_live.js \
            ${{ inputs.question && format('--question "{0}"', inputs.question) || '' }} | tee probe.txt
        continue-on-error: true

      - name: Put the answer's shape in the run summary
        if: ${{ always() && inputs.probe_answer }}
        run: |
          {
            echo '## What the deployment answered'
            echo '```'
            cat probe.txt 2>/dev/null || echo 'the probe produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if something needs deploying
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: node tools/intelligence/deploy_doctor.js > /dev/null
