# EdgeDesk Model Collective — the suites that guard the posting path.
#
# These already existed and already gate the jobs that write (sync-schedule
# and settle-finals each run their own suite before they are allowed to touch
# the Collective). Nothing ran them on a change, so a break in the posting
# path was only discovered by the next scheduled write — or, for app.html's
# Sync to Collective button, by a creator finding they could not post at all.
#
# No network, no credentials, nothing written: every suite here is offline.
name: Collective suites

on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'index.html'
      - 'collective/index.html'
      - 'collective/embed.js'
      - 'collective/admin.html'
      # The page's own suites now RUN here, so a change to one of them has to
      # be able to trigger the job that runs it. Without these two lines a PR
      # touching only a test file went green without executing it.
      - 'collective/tests.js'
      - 'collective/tests_render.js'
      - 'tools/collective/**'
      - 'brief.html'
      - 'record.html'
      - 'supabase/functions/edgedesk_ai/**'
      - 'tools/presentation/**'
      - 'tools/record/**'
      - 'football/injuries/**'
      - 'football/availability/**'
      - 'football/rating/**'
      # The player quality layer's own modules and the app.html panel that
      # renders them. The panel suite reads the renderer out of app.html
      # rather than a copy, so a change to either has to be able to trigger it.
      - 'football/players/**'
      - 'football/rankings/**'
      - 'football/data/**'
      - 'football/validation/**'
      - 'tools/football/**'
      # The capture edge function and its suites. Before this, a change to the
      # single function that decides what EdgeDesk calls a bet triggered no CI
      # at all — it was not in either path list, because until v9 it was not in
      # the repository.
      - 'supabase/functions/capture/**'
      - 'tools/capture/**'
      - 'supabase/*.sql'
      - '.github/workflows/collective-tests.yml'
  pull_request:
    paths:
      - 'app.html'
      - 'index.html'
      - 'collective/index.html'
      - 'collective/embed.js'
      - 'collective/admin.html'
      # The page's own suites now RUN here, so a change to one of them has to
      # be able to trigger the job that runs it. Without these two lines a PR
      # touching only a test file went green without executing it.
      - 'collective/tests.js'
      - 'collective/tests_render.js'
      - 'tools/collective/**'
      - 'brief.html'
      - 'record.html'
      - 'supabase/functions/edgedesk_ai/**'
      - 'tools/presentation/**'
      - 'tools/record/**'
      - 'football/injuries/**'
      - 'football/availability/**'
      - 'football/rating/**'
      # The player quality layer's own modules and the app.html panel that
      # renders them. The panel suite reads the renderer out of app.html
      # rather than a copy, so a change to either has to be able to trigger it.
      - 'football/players/**'
      - 'football/rankings/**'
      - 'football/data/**'
      - 'football/validation/**'
      - 'tools/football/**'
      # The capture edge function and its suites. Before this, a change to the
      # single function that decides what EdgeDesk calls a bet triggered no CI
      # at all — it was not in either path list, because until v9 it was not in
      # the repository.
      - 'supabase/functions/capture/**'
      - 'tools/capture/**'
      - 'supabase/*.sql'
      - '.github/workflows/collective-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Node 22: the whole job, including the .ts contract suite, which needs
      # native type stripping. Node 20 is past end of life and its action
      # runtime is being retired from the runners.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The Collective page's own two suites. This workflow already ran on
      # every change to collective/index.html and then tested everything
      # except collective/index.html — so the suite written BECAUSE a
      # finished slate showed no grades at all was not gating the file it
      # guards, and a change that emptied every record again would have gone
      # green. Both are offline and take seconds.
      - name: The upload path and the page's pure functions
        run: node collective/tests.js

      - name: The record appears when the game ends
        run: node collective/tests_render.js

      # Reads the real functions out of app.html rather than a copy, so it
      # fails loudly if the block it slices moves instead of testing nothing.
      - name: The research boards can still post to the Collective
        run: node tools/collective/app_sync.test.js

      # The player quality + scheme matchup layer: the rules its ratings are
      # not allowed to break (a missing input never becoming a zero, no rating
      # ever knowing the future, a reproducible simulation, no model call
      # anywhere in the rating path).
      - name: The player ratings obey their own rules
        run: node football/players/players.test.js

      # The research page's player panel, cut out of app.html and run against
      # the REAL committed datasets — so this holds the thing users see.
      - name: The player quality panel says what it can and cannot see
        run: node tools/football/player_quality_ui.test.js

      # The national rankings, the enrichment layer and the promotion gate that
      # decides whether any of it is allowed to move a projected number.
      - name: The rankings and the enrichment obey their own rules
        run: node football/rankings/rankings.test.js

      - name: The rankings panel shows unranked as unranked and research as research
        run: node tools/football/rankings_ui.test.js

      # The product hierarchy the chrome claims: Research first and default,
      # Edges beside it, Faults reachable without a tab of its own.
      - name: The navigation says what the product is
        run: node tools/app/navigation.test.js

      # The workbook the boards download, rebuilt from a real cleaned file.
      - name: The download is the format the operator cleaned up by hand
        run: node tools/collective/app_export.test.js

      # Writer and reader together: what app.html emits, the uploader opens.
      - name: An exported workbook still uploads
        run: node tools/collective/slate_upload.test.js

      # A credential the host page hands over, and the rules it travels under.
      - name: The embed only vouches for a real reader, and only to us
        run: node tools/collective/embed_auth.test.js

      # The Collective tab renders itself now, from collective_public.
      - name: Every sport reaches the board, and a lock says why
        run: node tools/collective/app_collective.test.js

      # The landing page's Collective panel, which is the first thing a
      # stranger sees and now makes network requests to be it.
      - name: The landing page shows the real Collective, and cannot break trying
        run: node tools/collective/landing_collective.test.js

      # The founder pool is divided by a CONFIGURED count, not by a count of
      # people; these hold the screen that has to say when the two disagree.
      - name: The founder split says when its divisor is stale
        run: node tools/collective/founder_split.test.js

      - name: Schedule matching
        run: node tools/collective/sync_schedule.test.js

      - name: Settle matching
        run: node tools/collective/settle_finals.test.js

      # DEEP ENGINE, SIMPLE ANSWER. The presentation layer that turns the
      # deterministic verdict into the 5-second card and the publisher brief.
      # One canonical library is inlined into three hosts; drift fails here.
      - name: Presentation library is identical in every host
        run: node tools/presentation/presentation_sync.test.js

      - name: Verdicts survive translation, AI copy is gated, snapshots hold their prices
        run: node tools/presentation/presentation.test.js

      # THE FIVE-SECOND TEST. Every public surface, every market shape and
      # every verdict, checked for words a football fan cannot be expected to
      # know — and checked that an underdog price never reads as a prediction.
      - name: A football fan can read every public surface
        run: node tools/presentation/public_language.test.js

      # CLOSE THE LOOP. Every published brief is graded against the close and
      # the final by tools/record/grade_briefs.js (its own scheduled workflow
      # commits record/grades.json). Nothing invented: no close means waiting,
      # contested finals grade nothing, a graded pick is never re-graded.
      - name: Published briefs grade against the close, deterministically
        run: node tools/record/grade_briefs.test.js

      - name: The public record page lists every published call, graded
        run: node tools/record/record_page.test.js

      # The NFL injury report: nflverse's public CSV reduced to the latest
      # week per team. Never inferred, never last season's shown as this one's.
      - name: The injury sync reduces the report honestly
        run: node football/injuries/fetch_injuries.test.js

      # College football has no universal injury report, so EdgeDesk builds its
      # own availability layer. Nothing invented, no status stronger than its
      # source, no low-tier report overwriting an official one, and "no data"
      # never rendered as "no injuries".
      - name: CFB availability never invents a status, a player or a source
        run: node football/availability/availability.test.js

      # EdgeDesk's own team rating. The recursion must actually adjust for
      # opponent, home advantage and the season-on-season carryover must stay
      # MEASURED rather than assumed (that measured slope is the portal/NIL
      # question answered with arithmetic), roster and availability must stay
      # bounded, a team with no evidence must get no rating at all, and the
      # app must read the rating file rather than manufacturing timestamps.
      - name: The EdgeDesk Rating measures what it claims to measure
        run: node football/rating/edr.test.js

      # CAPTURE. The single most consequential function in EdgeDesk: it decides
      # what becomes a signal. Imported here as the DEPLOYED file under Node's
      # type stripping with a Deno shim and a mocked network — which is only
      # possible because it has no imports. All 27 adversarial cases from the
      # capture brief, plus the de-vig, partition and freshness-boundary
      # properties. No network, nothing written.
      - name: Capture qualifies a signal only on evidence it can name
        run: node tools/capture/capture.test.js

      # THE BOARD CONTRACT. An unqualified row with edge > 0 must not render as
      # an Edge on any surface. Sliced out of the real app.html and the real
      # edgedesk_ai, so a regression fails here and not on a board someone is
      # reading.
      - name: An unqualified positive-edge row cannot reach a user as an Edge
        run: node tools/capture/board_contract.test.js

      # VERDICT AUTHORITY. capture-v9 decides whether a market signal is
      # actionable; the frontend does not get a vote. Before this the app had
      # two independent verdict engines — eqsCompute() and EDAI.evidence() —
      # neither of which consulted capture, so one selection could read WATCH on
      # Today's Desk and BET in the Top 10 at the same instant. The seven cases
      # here include the one that matters: an EQS score of 100 saying BET cannot
      # promote a row capture refused.
      - name: EQS can downgrade capture and can never upgrade it
        run: node tools/capture/verdict_authority.test.js

      # CLV is entry_dec x closing_fair - 1, and the two halves come from two
      # different pricers: capture computes the entry, close computes the fair.
      # Wherever they disagree the difference lands in the record looking exactly
      # like market movement. This pins the disagreements that exist today —
      # close cannot reach Pinnacle, and its devig returns a non-distribution on
      # an underround book — so they cannot widen unnoticed.
      - name: close and capture are compared as the two halves of every CLV
        run: node tools/capture/pricer_parity.test.js

      # The football slate joins a schedule table to the odds feed by team name,
      # and a wrong join puts a real price under the wrong fixture on a screen
      # someone publishes from. Two heuristics were tried and both were caught
      # here: containment matched "usc" inside "wisconsinbadgers", and prefix
      # matched Kansas to Kansas State. The join is now on resolved school
      # identity, and these cases are the reason it has to stay that way.
      - name: the slate never puts a price under the wrong fixture
        run: node tools/capture/slate_join.test.js

      # The backtest harness itself. A backtest is a machine for producing a
      # number nobody can check, so the machine is checked: the leakage guard
      # throws, the folds never look forward, and every metric is verified
      # against a value worked out by hand.
      - name: The backtest cannot see the future and its arithmetic is right
        run: node tools/capture/backtest.test.js

      # THE MIGRATION, RUN FOR REAL. It shipped with `as check` — a reserved
      # keyword — so the whole file died at its last statement and the report
      # that exists to tell you it worked never ran. Nothing here had ever
      # executed a line of its SQL. This starts a throwaway postgres, builds a
      # pre-v9 schema, runs the migration three times, and checks that the
      # freeze freezes and that every column capture writes exists afterwards.
      # The runner ships PostgreSQL; if it is ever absent the suite says so and
      # falls back to the static layer rather than passing quietly.
      - name: Add postgres to PATH for the migration suite
        run: ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"
      - name: The migration runs, twice, and freezes what it promises to freeze
        run: node tools/capture/migration.test.js

      # The deployed edge function, imported under Node's native type stripping
      # with a Deno shim and a mocked network: old callers, the additive
      # presentation contract, and the deterministic card surviving AI failure.
      # Node 22 strips TypeScript types natively and unflagged from 22.18, so
      # this needs no second toolchain and no --experimental flag.
      - name: edgedesk_ai keeps its contract and never lets the model own the verdict
        run: node tools/presentation/edgedesk_ai.test.js

      # The card and the publisher desk as wired into app.html.
      - name: The decision card leads every surface and mobile keeps it above the fold
        run: node tools/presentation/app_presentation.test.js

      # FULL PICTURE. Key players from the stored stat leaders and starter
      # feeds, every priced market on the game, every book on the line — one
      # panel per edge, nothing invented.
      - name: Full picture names only stored players and lists every priced side
        run: node tools/presentation/app_picture.test.js
