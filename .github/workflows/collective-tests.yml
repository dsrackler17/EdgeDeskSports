# EdgeDesk Model Collective — the suites that guard the posting path.
#
# These already existed and already gate the jobs that write (sync-schedule
# and settle-finals each run their own suite before they are allowed to touch
# the Collective). Nothing ran them on a change, so a break in the posting
# path was only discovered by the next scheduled write — or, for app.html's
# Sync to Collective button, by a creator finding they could not post at all.
#
# No network, no credentials, nothing written: every suite here is offline.
name: Collective suites

on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'index.html'
      - 'collective/index.html'
      - 'collective/embed.js'
      - 'collective/admin.html'
      # The page's own suites now RUN here, so a change to one of them has to
      # be able to trigger the job that runs it. Without these two lines a PR
      # touching only a test file went green without executing it.
      - 'collective/tests.js'
      - 'collective/tests_render.js'
      - 'tools/collective/**'
      - 'brief.html'
      - 'supabase/functions/edgedesk_ai/**'
      - 'tools/presentation/**'
      - '.github/workflows/collective-tests.yml'
  pull_request:
    paths:
      - 'app.html'
      - 'index.html'
      - 'collective/index.html'
      - 'collective/embed.js'
      - 'collective/admin.html'
      # The page's own suites now RUN here, so a change to one of them has to
      # be able to trigger the job that runs it. Without these two lines a PR
      # touching only a test file went green without executing it.
      - 'collective/tests.js'
      - 'collective/tests_render.js'
      - 'tools/collective/**'
      - 'brief.html'
      - 'supabase/functions/edgedesk_ai/**'
      - 'tools/presentation/**'
      - '.github/workflows/collective-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Collective page's own two suites. This workflow already ran on
      # every change to collective/index.html and then tested everything
      # except collective/index.html — so the suite written BECAUSE a
      # finished slate showed no grades at all was not gating the file it
      # guards, and a change that emptied every record again would have gone
      # green. Both are offline and take seconds.
      - name: The upload path and the page's pure functions
        run: node collective/tests.js

      - name: The record appears when the game ends
        run: node collective/tests_render.js

      # Reads the real functions out of app.html rather than a copy, so it
      # fails loudly if the block it slices moves instead of testing nothing.
      - name: The research boards can still post to the Collective
        run: node tools/collective/app_sync.test.js

      # The workbook the boards download, rebuilt from a real cleaned file.
      - name: The download is the format the operator cleaned up by hand
        run: node tools/collective/app_export.test.js

      # Writer and reader together: what app.html emits, the uploader opens.
      - name: An exported workbook still uploads
        run: node tools/collective/slate_upload.test.js

      # A credential the host page hands over, and the rules it travels under.
      - name: The embed only vouches for a real reader, and only to us
        run: node tools/collective/embed_auth.test.js

      # The Collective tab renders itself now, from collective_public.
      - name: Every sport reaches the board, and a lock says why
        run: node tools/collective/app_collective.test.js

      # The landing page's Collective panel, which is the first thing a
      # stranger sees and now makes network requests to be it.
      - name: The landing page shows the real Collective, and cannot break trying
        run: node tools/collective/landing_collective.test.js

      # The founder pool is divided by a CONFIGURED count, not by a count of
      # people; these hold the screen that has to say when the two disagree.
      - name: The founder split says when its divisor is stale
        run: node tools/collective/founder_split.test.js

      - name: Schedule matching
        run: node tools/collective/sync_schedule.test.js

      - name: Settle matching
        run: node tools/collective/settle_finals.test.js

      # DEEP ENGINE, SIMPLE ANSWER. The presentation layer that turns the
      # deterministic verdict into the 5-second card and the publisher brief.
      # One canonical library is inlined into three hosts; drift fails here.
      - name: Presentation library is identical in every host
        run: node tools/presentation/presentation_sync.test.js

      - name: Verdicts survive translation, AI copy is gated, snapshots hold their prices
        run: node tools/presentation/presentation.test.js

      # The deployed edge function, imported under Node's native type stripping
      # with a Deno shim and a mocked network: old callers, the additive
      # presentation contract, and the deterministic card surviving AI failure.
      - name: edgedesk_ai keeps its contract and never lets the model own the verdict
        run: node tools/presentation/edgedesk_ai.test.js

      # The card and the publisher desk as wired into app.html.
      - name: The decision card leads every surface and mobile keeps it above the fold
        run: node tools/presentation/app_presentation.test.js
