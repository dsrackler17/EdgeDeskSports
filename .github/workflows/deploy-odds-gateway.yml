# Deploy the Odds API gateway and the callers rewired to it.
#
# 2026-10-10 (docs/odds-api-incident-2026-10/INCIDENT.md). MANUAL ON PURPOSE:
# turning paid retrieval back on is a person's decision, and this workflow
# does NOT do it. Applying the gateway SQL creates the switch OFF with a zero
# budget; the re-enable runbook in the incident document is the only way on.
#
# ORDER IS LOAD-BEARING: the SQL first (the control plane every function asks),
# then odds_gateway (the only holder of the provider key), then its callers.
# A caller deployed before the gateway fails CLOSED: it has no provider code
# left, so it serves what is stored and buys nothing.
#
# SECRETS (the same ones Deploy intelligence uses):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF   to deploy the functions
#   SB_DB_URL                                     to apply the SQL (optional:
#                                                 paste the files into the SQL
#                                                 editor instead)
# And ON THE SUPABASE SIDE, set once by the account owner (never in GitHub):
#   supabase secrets set ODDS_GATEWAY_PROVIDER_KEY=<the The Odds API key>
#   supabase secrets unset ODDS_API_KEY THE_ODDS_API_KEY   (after the gateway is live)
name: Deploy odds gateway

on:
  workflow_dispatch:
    inputs:
      apply_emergency_stop:
        description: 'Apply supabase/odds_api_emergency_stop.sql — PAUSES every paid odds job (again, if already resumed). For the fastest stop paste it into the SQL editor instead.'
        type: boolean
        default: false
      apply_gateway_sql:
        description: 'Apply supabase/odds_api_gateway.sql (control plane, ledger, budget; idempotent; leaves the breaker as it is)'
        type: boolean
        default: true
      deploy_gateway:
        description: 'Deploy supabase/functions/odds_gateway (JWT verification OFF: it checks the service role / gateway secret itself)'
        type: boolean
        default: true
      deploy_callers:
        description: 'Deploy capture, close, collective_odds_ingest and props_cron as rewired to the gateway'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-odds-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The gateway suites must pass before anything ships (mock provider, zero credits)
        env:
          ODDS_SQL_REQUIRED: '1'
        run: |
          node tools/odds/no_bypass.test.js
          node tools/odds/gateway_sql.test.js
          node tools/odds/gateway_fn.test.js
          node tools/capture/capture.test.js
          node tools/props/props_cron.test.js

      - name: Check the credentials exist before claiming anything
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DBURL: ${{ secrets.SB_DB_URL }}
        run: |
          echo "have_token=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "have_ref=$([ -n "$REF" ] && echo yes || echo no)"     >> "$GITHUB_OUTPUT"
          echo "have_db=$([ -n "$DBURL" ] && echo yes || echo no)"    >> "$GITHUB_OUTPUT"
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not set — the functions cannot be deployed from CI."; fi
          if [ -z "$DBURL" ]; then echo "::warning::SB_DB_URL is not set — the SQL cannot be applied from CI (paste the files into the SQL editor instead)."; fi

      - name: Apply supabase/odds_api_emergency_stop.sql
        if: ${{ inputs.apply_emergency_stop && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/odds_api_emergency_stop.sql)
          echo "$out" | tail -8
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::odds_api_emergency_stop.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Apply supabase/odds_api_gateway.sql
        if: ${{ inputs.apply_gateway_sql && steps.creds.outputs.have_db == 'yes' }}
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/odds_api_gateway.sql)
          echo "$out" | tail -12
          if echo "$out" | grep -q 'CHECK THIS'; then echo "::error::odds_api_gateway.sql: a report row says CHECK THIS"; exit 1; fi

      - name: Install the Supabase CLI
        if: ${{ (inputs.deploy_gateway || inputs.deploy_callers) && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt IS LOAD-BEARING, as for capture in deploy-intelligence.yml:
      # the gateway's callers are edge functions and runners holding the
      # service role (or ODDS_GATEWAY_SECRET), which the gateway checks itself
      # in the first statement of its handler. It refuses everything else.
      - name: Deploy odds_gateway
        if: ${{ inputs.deploy_gateway && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy odds_gateway \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy the callers (capture, close, collective_odds_ingest, props_cron)
        if: ${{ inputs.deploy_callers && steps.creds.outputs.have_token == 'yes' && steps.creds.outputs.have_ref == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in capture close collective_odds_ingest props_cron; do
            supabase functions deploy "$fn" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
              --no-verify-jwt
          done
