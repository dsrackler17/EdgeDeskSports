# EdgeDesk college basketball (NCAA Division I men's) — the WEEKLY challenger
# run with guarded promotion (basketball/ncaam_forecast/weekly.js).
#
#   schedule Monday 11:07 UTC (after the basketball model loop, 10:23)
#     1 the season in progress is ingested and the suites pass
#     2 the registry verifies (pointer, model record and history agree)
#     3 weekly.js: up to four changes from a FIXED catalogue, each walked
#       forward over every season with calibration fitted causally inside the
#       walk; gates G1-G8 from config/promotion_v1.json (fixed before any
#       candidate is seen); an immutable report and a history line for EVERY
#       candidate; at most one PROMOTE, only with every gate passed and a
#       reproducible artifact
#     4 the registry, the reports and the data are committed
#     5 the database copy of the champion and the reports is synced ONLY when
#       NCAAM_FC_PUBLISH is "on" (ncaam_fc_set_champion refuses a PROMOTE
#       without a stored PROMOTE report for exactly that model)
#
# A FAILED run (any stage) is recorded in registry/history.jsonl, fails this
# job and never moves the champion. Rollback is a person's decision:
#   node basketball/ncaam_forecast/registry.js rollback --reason "..."
# (docs/ncaam-forecast/README.md, "Rollback").
#
# SECRETS: SB_URL, SB_SERVICE_ROLE (only with NCAAM_FC_PUBLISH = on).
name: NCAAM forecast (weekly challengers)

on:
  schedule:
    - cron: '7 11 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated catalogue ids (empty = the weekly rotation of four)'
        type: string
        default: ''
      dry_run:
        description: 'Evaluate and report, never promote'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ncaam-forecast
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyarrow
      - name: Ingest the season in progress
        run: node --max-old-space-size=6144 basketball/ncaam_forecast/ingest.js --season current
      - name: The suites pass and the registry verifies before any evaluation
        run: |
          node --max-old-space-size=6144 basketball/ncaam_forecast/tests/model.test.js
          node basketball/ncaam_forecast/select.js --check
          node basketball/ncaam_forecast/validate.js --check
          node basketball/ncaam_forecast/registry.js verify
      - name: Challengers, gates, reports, at most one promotion
        id: weekly
        env:
          ONLY: ${{ inputs.only }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--max 4)
          if [ -n "$ONLY" ]; then
            if ! [[ "$ONLY" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then echo "::error::only must be comma-separated catalogue ids"; exit 2; fi
            args=(--only "$ONLY")
          fi
          [ "$DRY" = "true" ] && args+=(--dry-run)
          node --max-old-space-size=6144 basketball/ncaam_forecast/weekly.js "${args[@]}" | tee "$RUNNER_TEMP/weekly.json"
      - name: The registry still verifies
        if: ${{ always() }}
        run: node basketball/ncaam_forecast/registry.js status
      - name: Commit the registry, the reports and the data (failed runs too, the history records them)
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/ci/push_generated.sh main "ncaam forecast: weekly challengers" -- \
            basketball/ncaam_forecast/registry basketball/ncaam_forecast/reports basketball/ncaam_forecast/data
      - name: Sync the champion and the reports to the database (NCAAM_FC_PUBLISH = on)
        if: ${{ vars.NCAAM_FC_PUBLISH == 'on' }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: node basketball/ncaam_forecast/publish.js --sync
