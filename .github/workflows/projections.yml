name: Independent projections
run-name: Independent projections · ${{ github.event_name }}

# Model first, market second. After each sport engine publishes its slate
# (nhl.yml at :41, nba.yml at :23 every three hours, lab.yml daily, the football
# builds), this job reads every engine artifact through EDPROJ
# (lib/edgedesk_projections.js), freezes the independent projections with a
# SHA-256 per projection and per snapshot, and commits:
#   engine/projections.json                    the current frozen snapshot, the per-sport
#                                              build summary and the capability matrix
#   engine/projections_ledger/<YYYY-MM>.jsonl  append-only: every new projection hash, on
#                                              record BEFORE any price is compared with it
# NO PRICE IS READ: the build's reader refuses any path that is not an engine
# artifact (quotes, signals, scoreboard prices). Nothing here spends an odds
# credit, and it runs the same whether the odds integrations are on or off.

on:
  pull_request:
    paths:
      - 'lib/edgedesk_projections.js'
      - 'lib/edgedesk_market_compare.js'
      - 'lib/edgedesk_multisport.js'
      - 'engine/build_projections.js'
      - 'tools/quant/**'
      - 'tools/intelligence/multisport*.test.js'
      - 'tools/intelligence/fixtures/quant_oct15_2026.json'
      - '.github/workflows/projections.yml'
  schedule:
    - cron: '55 */3 * * *'   # after the NHL (:41) and NBA (:23) builds of the same hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The projection contract, the market comparison and the cross-sport ranking
        run: node tools/intelligence/multisport.test.js
      - name: The 2026-10-15 regression, the model-first order and the desk with every odds integration off (real handler)
        run: node tools/intelligence/multisport_host.test.js
      - name: The build reads no price and is reproducible
        run: node engine/build_projections.js --check || echo "::notice::engine/projections.json differs from a fresh build (the slates moved since it was committed)"

  build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: projections-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The rules must pass before anything is written
        run: node tools/intelligence/multisport.test.js
      - name: Freeze every operational engine's projections (no price is read)
        run: node engine/build_projections.js
      - name: Commit (tools/ci/push_generated.sh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/ci/push_generated.sh main "projections: independent projections frozen before any price" -- \
            engine/projections.json engine/projections_ledger
