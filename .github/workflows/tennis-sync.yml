# EdgeDesk Tennis — the background sync.
#
# Every six hours: discover the ATP and WTA tournaments in the window from
# ESPN's public scoreboard, store tournaments and matches with their provider
# ids, register every athlete the draw names in the provider directory,
# resolve every SINGLES side to a player (the licensed record where it has
# one, the directory otherwise) and say which ones did not resolve, keep
# every DOUBLES pair whole as a team, link each
# match to its odds-feed fixture only when both participants match, write the
# pre-match price history, mark a draw that never closed as stale, and rebuild
# the baselines for every player in the window. Mondays it rebuilds every
# player on file.
#
# NO EDGE FUNCTION IS INVOLVED. The job writes over PostgREST with the service
# role this repository already holds (SB_SERVICE_ROLE / SB_URL — the same
# secrets the settle, schedule and UFC jobs use). The browser reads the result
# through the anon/RLS door like every other research table.
#
# It is IDEMPOTENT: a tournament already on file is updated in place by its
# provider id, a price already captured is not captured again, and a run on
# which nothing changed writes what it read.
name: Tennis sync

on:
  schedule:
    - cron: '23 */6 * * *'     # the draw, the players, the market
    - cron: '53 8 * * 1'       # Mondays: every player's baseline, not just the ones in the window
  # A pull request that touches the tennis pipeline runs the suites and PROBES
  # THE SOURCE on a real runner, writing nothing. This is not decoration: the
  # UFC adapter shipped correct-looking code that ESPN's edge answered 403 to
  # from GitHub's runners, and only a runner could show it. A source shape that
  # changed under us is worth seeing in review rather than at 3am.
  pull_request:
    paths:
      - 'lib/tennis_research.js'
      - 'tools/tennis/**'
      - 'tools/lib/**'
      - 'supabase/tennis_live_center.sql'
      - 'supabase/tennis_player_directory.sql'
      - '.github/workflows/tennis-sync.yml'
      - '.github/workflows/tennis-live.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Write to the database. Unchecked is a dry run that says what it would do.'
        type: boolean
        required: false
        default: true
      baselines:
        description: 'Which player baselines to rebuild'
        type: choice
        options: [upcoming, all, none]
        required: false
        default: upcoming
      tour:
        description: 'Limit to one tour (atp or wta). Blank = both.'
        required: false
        default: ''
      verify_only:
        description: 'Only prove the source answers. Writes nothing at all.'
        type: boolean
        required: false
        default: false

concurrency:
  # Two syncs writing the same draw race each other into the same upsert. A
  # pull-request probe writes nothing, so it gets its own group per branch
  # rather than queueing behind the scheduled writer.
  group: tennis-sync-${{ github.event_name == 'pull_request' && github.ref || 'write' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: The matching, market and first-point rules must pass before anything is written
        run: node tools/tennis/tennis.test.js

      # A probe failure is worth seeing in the log but must not stop the sync:
      # the sync reports each tour's own failure, one tour answering is a
      # usable day, and a draw already on file is better than no run at all.
      - name: Prove the source answers before anything is written
        if: ${{ github.event_name != 'pull_request' }}
        run: node tools/tennis/sync_events.js --verify || echo "::warning::the source probe did not come back clean — the sync will report what it could read"

      # On a pull request the probe is the point, so its outcome is not
      # swallowed: every discovery shape is tried and printed per tour, a
      # source that answers nothing at all fails the job, and a window that
      # genuinely holds no tournament is a warning rather than a failure.
      - name: Probe the source on a runner (writes nothing)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set +e
          node tools/tennis/sync_events.js --verify
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the source answered but carried no tournament in the window"
            exit 0
          fi
          exit $code

      # A step cannot end a job, so this only SAYS what happened; the write
      # steps below carry the guard that actually keeps them out.
      - name: Say plainly that nothing will be written
        if: ${{ github.event_name == 'pull_request' || inputs.verify_only == true }}
        run: echo "This run probed the source. Nothing is written to the database."

      - name: Sync tournaments, matches, players and markets
        if: ${{ github.event_name != 'pull_request' && inputs.verify_only != true }}
        env:
          EDGD_SB_SERVICE: ${{ secrets.SB_SERVICE_ROLE }}
          EDGD_SB_URL: ${{ secrets.SB_URL }}
        run: |
          if [ -z "$EDGD_SB_SERVICE" ] || [ -z "$EDGD_SB_URL" ]; then
            echo "::error::SB_SERVICE_ROLE and SB_URL are not both set — nothing can be written."
            exit 1
          fi
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.commit }}" = "true" ]; then ARGS="$ARGS --commit"; fi
          if [ -n "${{ inputs.tour }}" ]; then ARGS="$ARGS --tour ${{ inputs.tour }}"; fi
          node tools/tennis/sync_events.js $ARGS

      # The draw is discovered before the players are, because the players are
      # DERIVED FROM THE DRAW: every side the scoreboard publishes carries an
      # athlete id, and this turns those into rows. It never writes the
      # licensed tennis.players record — that stays empty until a cleared feed
      # is loaded, and the resolver prefers it the moment it has rows.
      - name: Register the players the provider published
        if: ${{ github.event_name != 'pull_request' && inputs.verify_only != true }}
        env:
          EDGD_SB_SERVICE: ${{ secrets.SB_SERVICE_ROLE }}
          EDGD_SB_URL: ${{ secrets.SB_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.commit }}" = "true" ]; then ARGS="$ARGS --commit"; fi
          if [ -n "${{ inputs.tour }}" ]; then ARGS="$ARGS --tour ${{ inputs.tour }}"; fi
          node tools/tennis/sync_players.js $ARGS

      # …and then the sides that had nowhere to resolve to when the draw was
      # written are resolved against the directory that now exists. No source
      # request is made here; it reads and writes the database only.
      - name: Resolve the sides that can now be resolved
        if: ${{ github.event_name != 'pull_request' && inputs.verify_only != true }}
        env:
          EDGD_SB_SERVICE: ${{ secrets.SB_SERVICE_ROLE }}
          EDGD_SB_URL: ${{ secrets.SB_URL }}
        run: |
          ARGS="--resolve-only"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.commit }}" = "true" ]; then ARGS="$ARGS --commit"; fi
          node tools/tennis/sync_events.js $ARGS

      - name: Rebuild player baselines
        if: ${{ github.event_name != 'pull_request' && inputs.verify_only != true }}
        env:
          EDGD_SB_SERVICE: ${{ secrets.SB_SERVICE_ROLE }}
          EDGD_SB_URL: ${{ secrets.SB_URL }}
        run: |
          MODE="${{ inputs.baselines }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "53 8 * * 1" ]; then MODE=all; else MODE=upcoming; fi
          fi
          if [ -z "$MODE" ]; then MODE=upcoming; fi
          if [ "$MODE" = "none" ]; then echo "baselines skipped by request"; exit 0; fi
          ARGS="--$MODE"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.commit }}" = "true" ]; then ARGS="$ARGS --commit"; fi
          node tools/tennis/build_baselines.js $ARGS
