# EdgeDesk — refresh and publish the research articles.
#
# The research already exists: the terminal prices every game on the board.
# This turns that into public, indexable pages, and it does it by ASKING the
# terminal rather than by modelling anything itself — tools/articles/ boots
# the real football module out of app.html and calls the same
# fbBriefGame() / fbNflBriefGame() a browser calls. No number on a published
# page was computed by this job.
#
# WHAT A RUN DOES
#   1. refresh every game on the board into an article record. An unchanged
#      projection produces no change, so a quiet week is a quiet commit.
#   2. auto-publish anything that passes every publication check, IF the
#      operator has turned auto-publish on. Malformed, thin or incomplete
#      research is held as `ready` and the failing check is recorded.
#   3. render every PUBLISHED record to static HTML, rebuild the hubs and
#      rewrite sitemap-articles.xml. Drafts produce no page and no sitemap
#      line, ever.
#   4. commit, so every publication and every correction is a diff.
#
# NO SECRETS. The two schedule feeds are public and keyless, the same ones
# the board itself reads.
name: Publish research articles

on:
  schedule:
    # Ten past every third hour: often enough that a projection that moves
    # before kickoff reaches the page the same morning, rare enough that the
    # repository is not rewritten on the hour for nothing.
    - cron: '10 */3 * * *'
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Publish everything that passes its checks, regardless of the stored setting'
        type: boolean
        default: false
      limit:
        description: 'Only refresh the first N games on the board (0 = all)'
        type: string
        default: '0'

permissions:
  contents: write

concurrency:
  group: publish-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The article system must pass before it is allowed to write a page.
      # A generator that has stopped agreeing with the research is worse than
      # one that did not run.
      - name: The article system must pass before it publishes
        run: |
          node tools/articles/articles.test.js
          node tools/articles/sync.test.js

      # WHAT THE OPERATOR PUBLISHED FROM A BROWSER, first. Publication is
      # decided in the article manager and on the game brief, and written to
      # public.site_articles; the page is a committed file built from the
      # store. This is the only thing that joins them, and it runs before the
      # refresh so a just-published article is refreshed and built in the same
      # pass rather than waiting three hours for the next one.
      #
      # No secret: it reads through the anon key every page ships, and RLS
      # returns published rows and nothing else.
      - name: Pull what was published from a browser
        run: node tools/articles/sync.js --write

      - name: Refresh every article record from the research
        run: |
          node tools/articles/generate.js --network \
            ${{ (github.event.inputs.auto_publish == 'true') && '--auto' || '' }} \
            ${{ (github.event.inputs.limit != '' && github.event.inputs.limit != '0') && format('--limit {0}', github.event.inputs.limit) || '' }}

      # The live half of the suite, now that the feeds are warm: it holds the
      # records against the terminal they came from.
      - name: Hold the records against the research they came from
        run: node tools/articles/pipeline.test.js

      - name: Build the public pages, the hubs and the sitemap
        run: node tools/articles/build_articles.js

      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A concurrent push to main loses the race politely, not the work.
          #
          # This used to be `git push` with `git pull --rebase` as the retry,
          # and on 2026-09-18 20:50 that cost a whole run. The editorial job
          # pushed to main between our checkout and our push; the rebase
          # conflicted on articles/data/index.json and sitemap.xml — generated
          # files both jobs rewrite — and stopped with unmerged paths. `|| true`
          # swallowed that, so the three remaining attempts each died on
          # "Pulling is not possible because you have unmerged files". Every
          # test had passed and 13 published articles were built and thrown
          # away.
          #
          # Nothing this step commits needs merging. Every path here is a
          # generated artifact, rebuilt from the research on each run, so two
          # runs that both regenerated them do not disagree about intent and
          # the newer generation is the current truth. The shared helper puts
          # this run's artifacts on top of the remote tip instead of replaying
          # a commit through it, and never attempts a rebase.
          bash tools/ci/push_generated.sh main \
            'articles: refresh research articles from the model' \
            -- articles sitemap.xml sitemap-articles.xml
