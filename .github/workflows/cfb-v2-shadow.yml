# EdgeDesk CFB V2 — the weekly learning and rating refresh engine
# (docs/cfb-weekly/DESIGN.md, RUNBOOK.md).
#
# V2 runs BESIDE V1 and replaces nothing. Each run is ONE tracked pipeline run
# (football/cfb_weekly/<season>/runs.jsonl): it rebuilds the live season's
# point-in-time state with the same code the backtest used, validates the
# finals and the play-by-play, updates team / QB / unit state, projects the
# next week with the FROZEN artifact of the current model version (verified
# against its MANIFEST; no refit), and publishes only when the release gate
# passes. Outputs:
#   football/cfb_v2/current.json          upcoming games, FROZEN or PROVISIONAL
#   football/cfb_v2/snapshots/<season>/   write-once pregame snapshots (Tuesday 12:00 UTC)
#   football/cfb_weekly/<season>/         run records, team/QB/unit state, feature
#                                         snapshots, projections, changes, reports
#
# Modes (pg_cron's cfb_weekly_poke dispatches them; the schedule below is the
# backup clock):
#   weekly   Sun/Mon: finalize the source week, state, provisional projections
#   freeze   Tue: the EARLY freeze at 12:00 UTC, market comparison, lab hand-off
#   daily    Wed-Sat: refresh; a new football projection only if inputs changed
#   retrain  offseason only: a NEW challenger version for review (never
#            auto-promoted, never overwrites the champion or the production
#            artifact)
name: CFB V2 shadow

on:
  schedule:
    - cron: '5 10 * 8-12,1 0,1'    # Sun + Mon 10:05 — weekly state after the Saturday slate
    - cron: '17 12 * 8-12,1 2'     # Tue 12:17 — the EARLY freeze (pg_cron fires at 12:07)
    - cron: '47 10 * 8-12,1 3-6'   # Wed-Sat 10:47 — daily football-change check
  workflow_dispatch:
    inputs:
      mode:
        description: 'weekly | daily (default) | freeze | retrain (offseason; produces a new challenger for review). "live" is an alias of daily.'
        required: false
        default: 'daily'
      challenger_version:
        description: 'retrain only: the NEW challenger model_version (default edgedesk_cfb_challenger_<run id>). A released artifact is never overwritten.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write          # to dispatch the Model Lab after a freeze

concurrency:
  group: cfb-v2-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # one id across every step and every structured log line of this run
      # (docs/cfb-production/JOBS.md §5)
      CFB_CORRELATION_ID: cfb-v2-shadow-${{ github.run_id }}-${{ github.run_attempt }}
      # set the repository variable to 1 once supabase/cfb_production.sql is
      # applied: from then on a missing job lock fails closed
      CFB_REQUIRE_JOB_LOCK: ${{ vars.CFB_REQUIRE_JOB_LOCK }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Python deps (pinned; an upgrade is a governed change)
        run: pip install --quiet -r football/cfb_v2/research/requirements.txt
      - name: Mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            # a scheduled run: the day decides (UTC)
            case "$(date -u +%u)" in
              7|1) M=weekly ;;
              2)   M=freeze ;;
              *)   M=daily ;;
            esac
          fi
          [ "$M" = "live" ] && M=daily
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The production gate (football/cfb_production/gate.js): the frozen V2.1
      # artifact must verify and be the tuple compatibility.json pins (else the
      # job FAILS here, before any state is computed); the kill switch
      # cfb_weekly_engine_enabled must be on; ONE weekly refresh holds
      # cfb_job_lock('cfb_weekly_refresh', <season>) — a second run (pg_cron and
      # the GitHub backup both firing, a manual dispatch) exits cleanly; the
      # lease is exported so the mirror below re-enters it. Heartbeat STARTED.
      - name: Production gate (compatibility, kill switch, weekly lock, heartbeat)
        if: ${{ steps.mode.outputs.mode != 'retrain' }}
        id: gate
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: node football/cfb_production/gate.js start --job cfb_weekly_refresh --key auto
      - name: Cache raw data (one cache per ISO week; the live season is re-fetched every run)
        uses: actions/cache@v4
        with:
          path: football/cfb_v2/research/data
          key: cfb-v2-data-${{ steps.mode.outputs.week }}
          restore-keys: cfb-v2-data-

      - name: Weekly engine
        if: ${{ steps.mode.outputs.mode != 'retrain' && steps.gate.outputs.proceed == 'true' }}
        id: engine
        working-directory: football/cfb_v2/research
        env:
          CFB_V2_DATA: ${{ github.workspace }}/football/cfb_v2/research/data
          CFB_V2_OUT: ${{ github.workspace }}/football/cfb_v2/research/out
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set +e
          python3 -m v2.weekly.run --mode "${{ steps.mode.outputs.mode }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # a gate failure is a recorded outcome, not a crash: the run record is
          # still published below, and the job is marked failed at the end
          exit 0

      - name: Engine and weekly-engine tests
        if: ${{ steps.mode.outputs.mode != 'retrain' && steps.gate.outputs.proceed == 'true' }}
        working-directory: football/cfb_v2/research
        env:
          CFB_V2_DATA: ${{ github.workspace }}/football/cfb_v2/research/data
          CFB_V2_OUT: ${{ github.workspace }}/football/cfb_v2/research/out
        run: |
          node ../tests.js
          python3 -m v2.weekly.tests_weekly --fast

      - name: Publish
        if: ${{ steps.mode.outputs.mode != 'retrain' && steps.gate.outputs.proceed == 'true' }}
        run: |
          git config user.name "edgedesk-bot"
          git config user.email "edgedesk-bot@users.noreply.github.com"
          tools/ci/push_generated.sh main "cfb weekly engine: ${{ steps.mode.outputs.mode }} run" -- \
            football/cfb_v2/current.json football/cfb_v2/snapshots football/cfb_v2/shadow \
            football/cfb_v2/learning football/cfb_v2/monitoring.json football/cfb_weekly

      - name: Hand the freeze to the Model Lab
        if: ${{ steps.mode.outputs.mode == 'freeze' && steps.gate.outputs.proceed == 'true' && steps.engine.outputs.status == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cfb-lab.yml -f mode=hourly --ref main || echo "::warning::could not dispatch cfb-lab.yml; its hourly schedule will import the freeze"

      # The mirror runs AFTER the publish and the Model Lab hand-off (as in
      # cfb-lab.yml): a Supabase outage must never cost the git publish of a
      # freeze. A mirror failure still turns the run red; the next run re-sends
      # everything (insert-only, idempotent).
      - name: Insert-only copy to Supabase (when secrets are configured)
        if: ${{ steps.mode.outputs.mode != 'retrain' && steps.gate.outputs.proceed == 'true' }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: |
          node football/cfb_v2/sync_supabase.js
          node football/cfb_weekly/sync_supabase.js

      - name: Fail the run if the engine did not publish
        if: ${{ steps.mode.outputs.mode != 'retrain' && steps.gate.outputs.proceed == 'true' && steps.engine.outputs.status != '0' }}
        run: |
          echo "the weekly engine did not publish (gate failed or a stage failed); see football/cfb_weekly/*/runs/" >&2
          exit 1

      # Always: release the weekly lease, send the OK / FAILED heartbeat
      # (deadline 26 h) and open a CRITICAL incident on failure (RUNBOOK.md:
      # MONDAY REFRESH FAILED). It never fails the job itself.
      - name: Production gate finish (lock, heartbeat, incident)
        if: ${{ always() && steps.mode.outputs.mode != 'retrain' }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: node football/cfb_production/gate.js finish --job cfb_weekly_refresh --status "${{ job.status }}" --proceeded "${{ steps.gate.outputs.proceed }}"

      # ------------------------------------------------------------ retrain
      - name: Retrain (offseason; a new challenger version, never auto-promoted)
        if: ${{ steps.mode.outputs.mode == 'retrain' }}
        working-directory: football/cfb_v2/research
        env:
          # export.py refuses to write over a released (manifested) artifact
          CFB_V2_MODEL_VERSION: ${{ github.event.inputs.challenger_version || format('edgedesk_cfb_challenger_{0}', github.run_id) }}
        run: bash run_all.sh retrain
      - name: Keep the retrain for review (never auto-promoted)
        if: ${{ steps.mode.outputs.mode == 'retrain' }}
        uses: actions/upload-artifact@v4
        with:
          name: cfb-v2-retrain
          path: |
            football/cfb_v2/artifacts
            football/cfb_v2/params.js
            football/cfb_v2/research/report
            docs/cfb-v2
