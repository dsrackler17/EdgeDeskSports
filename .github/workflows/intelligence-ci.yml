# EdgeDesk Intelligence — the checks that gate every change to the research desk.
#
# Runs on pull requests and pushes that touch the edge function, its kernels,
# the intelligence suites, the migrations they depend on, or the panel. Three
# jobs, each fast, each offline:
#
#   lint       syntax of every intelligence file, the edge function parsed
#              under Node 22's type stripping, the inlined kernels byte-identical
#              to their canonical files, and no secret-shaped string.
#   suites     the research kernel unit tests, the evaluation harness, and the
#              existing intelligence suites — all through the real handler with
#              a fixture network and a stubbed writing model.
#   migrations every intelligence migration applied TWICE to a real PostgreSQL
#              and attacked (edit, delete, look-ahead), on the runner's own
#              throwaway cluster.
#
# Nothing here deploys. Deploying is .github/workflows/deploy-intelligence.yml,
# and it is manual on purpose.
name: Intelligence CI

on:
  pull_request:
    paths:
      - 'supabase/functions/edgedesk_ai/**'
      - 'lib/edgedesk_sports.js'
      - 'lib/edgedesk_fairodds.js'
      - 'lib/edgedesk_sport_adapters.js'
      - 'lib/edgedesk_calibration.js'
      - 'lib/edgedesk_evidence_graph.js'
      - 'lib/edgedesk_disagreement.js'
      - 'lib/edgedesk_research_budget.js'
      - 'lib/edgedesk_bet_history.js'
      - 'lib/edgedesk_portfolio.js'
      - 'lib/edgedesk_portfolio_import.js'
      - 'lib/edgedesk_orchestrator.js'
      - 'lib/edgedesk_evidence.js'
      - 'lib/edgedesk_quant_verify.js'
      - 'supabase/research_intel.sql'
      - 'supabase/quant_desk.sql'
      - 'football/validation/calibration_props_*.json'
      - 'supabase/recommendation_ledger.sql'
      - 'supabase/research_packets.sql'
      - 'tools/intelligence/**'
      - 'tools/presentation/inline.js'
      - 'tools/presentation/presentation_sync.test.js'
      - 'football/fbs/fbs.js'
      - 'football/pricing/**'
      - 'football/validation/pricing_*.json'
      - 'tools/football/build_lines_archive.js'
      - 'tools/football/validate_pricing.js'
      - 'tools/football/pricing_validation.test.js'
      - 'tools/football/data_builds.test.js'
      - 'tools/football/validate_movement.js'
      - 'tools/intelligence/learning_loop.js'
      - 'football/validation/movement_*.json'
      - 'tools/football/verify_nfl_stadiums.js'
      - 'tools/football/nfl_venues.js'
      - 'tools/football/build_injury_archive.js'
      - 'tools/football/add_note.js'
      - 'football/venues/nfl_stadiums.json'
      - 'football/notes/**'
      - 'football/availability/import_corrections.js'
      - 'tools/intelligence/pricing.test.js'
      - 'tools/intelligence/clv.js'
      - 'tools/intelligence/clv.test.js'
      - 'supabase/functions/edgedesk_ai/_pricing.js'
      - 'supabase/functions/edgedesk_ai/_board.js'
      - 'tools/intelligence/board.test.js'
      - 'football/fbs/slate.json'
      - 'football/availability/current.json'
      - 'football/matchup/metrics.json'
      - 'football/nfl/**'
      - 'football/identity/**'
      - 'tools/football/build_team_identity.js'
      - 'tools/football/team_identity.test.js'
      - 'football/venues/forecasts.json'
      - 'tools/football/build_matchup_metrics.js'
      - 'tools/football/build_nfl_slate.js'
      - 'tools/football/matchup_metrics.test.js'
      - 'tools/football/nfl_slate.test.js'
      - 'tools/football/nfl_regime.test.js'
      - 'football/research/nfl_regime.py'
      - 'football/research/nfl_neutral_site.js'
      - 'football/research/report/nfl_*.json'
      - 'football/engine.js'
      - 'tools/football/_module.js'
      - 'app.html'
      - 'package.json'
      - '.github/workflows/intelligence-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/edgedesk_ai/**'
      - 'lib/edgedesk_sports.js'
      - 'lib/edgedesk_fairodds.js'
      - 'lib/edgedesk_sport_adapters.js'
      - 'lib/edgedesk_calibration.js'
      - 'lib/edgedesk_evidence_graph.js'
      - 'lib/edgedesk_disagreement.js'
      - 'lib/edgedesk_research_budget.js'
      - 'lib/edgedesk_bet_history.js'
      - 'lib/edgedesk_portfolio.js'
      - 'lib/edgedesk_portfolio_import.js'
      - 'lib/edgedesk_orchestrator.js'
      - 'lib/edgedesk_evidence.js'
      - 'lib/edgedesk_quant_verify.js'
      - 'supabase/research_intel.sql'
      - 'supabase/quant_desk.sql'
      - 'football/validation/calibration_props_*.json'
      - 'supabase/research_packets.sql'
      - 'tools/intelligence/**'
      - '.github/workflows/intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax, type-stripped import, kernel sync, no secrets
        run: node tools/intelligence/lint.js

  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The research kernel (tools, calculators, packet, labels, critic)
        run: node tools/intelligence/research.test.js
      - name: The evaluation harness, through the real handler
        run: node tools/intelligence/evals.test.js
      - name: Intelligence tells the truth about the slate, the price and the model
        run: node tools/intelligence/intelligence.test.js
      - name: A retired sport gets the support boundary, not research
        run: node tools/intelligence/support_boundary.test.js
      - name: The matchup research layer against the real artifacts
        run: node tools/intelligence/matchup.test.js
      - name: The acceptance conversation
        run: node tools/intelligence/acceptance.test.js
      - name: A follow-up keeps the matchup, the sport and the price
        run: node tools/intelligence/conversation.test.js
      - name: The edge function keeps its contract
        run: node tools/presentation/edgedesk_ai.test.js
      - name: The panel renders the structured answer
        run: node tools/intelligence/structured_ui.test.js
      - name: The analyst kernel (interactions, form, sensitivity, scenarios, follow-ups)
        run: node tools/intelligence/analyst.test.js
      - name: Before and after on the same questions and evidence cutoff
        run: node tools/intelligence/analyst_evals.test.js
      - name: The postmortem separates data, analytical, model and variance misses
        run: node tools/intelligence/postmortem.test.js
      - name: The pricing kernel (fair line, bet-to, status, ranked board, sizing gate)
        run: node tools/intelligence/pricing.test.js
      - name: The board kernel (time zone, eligible slate, qualification, follow-ups, records, critic)
        run: node tools/intelligence/board.test.js
      - name: The staking kernel (the conservative probability, Kelly under every cap, the portfolio rules, the critic)
        run: node tools/intelligence/stake.test.js
      - name: The staking validation's own arithmetic, and the sign conventions a backtest cannot get wrong quietly
        run: node tools/intelligence/staking_validation.test.js
      - name: The staking scorecard refuses a reading below its sample floor and never sums the reader's record with the engine's
        run: node tools/intelligence/stake_grades.test.js
      - name: The host adapters carry the forecast without inventing one
        run: node tools/intelligence/stake_host.test.js
      - name: The closing-line-value scorecard grades in points and never claims a profit
        run: node tools/intelligence/clv.test.js
      - name: The deployment doctor never mistakes refused for absent
        run: node tools/intelligence/deploy_doctor.test.js
      - name: Non-QB personnel availability on the desk answers from the measurement and never prices an injury
        run: node tools/intelligence/personnel_desk.test.js
      - name: The fair-odds engine refuses the wrong unit, applies only a venue's own fees and never calls an unverified schedule an edge
        run: node tools/intelligence/fairodds.test.js
      - name: The adversarial auditor re-reads, recomputes independently, rejects the generator and ends its correction loop
        run: node tools/intelligence/audit.test.js
      - name: The quant desk routes the acceptance questions and answers them from deterministic services
        run: node tools/intelligence/quant.test.js
      - name: The quant desk through the real handler — the audited scan, contract checks, coverage and outage
        run: node tools/intelligence/quant_host.test.js
      - name: Calibration is claimed only against the close, profit only with an interval above zero, never with look-ahead
        run: node tools/intelligence/calibration.test.js
      - name: The research agents — evidence graph, disagreement causes, research budget, researcher, oddsmaker, strategist, auditor, communicator critic
        run: node tools/intelligence/research_agents.test.js
      - name: The research system through the real handler — the twelve scenarios, the slate investigation, betting history and the narration critic
        run: node tools/intelligence/research_host.test.js
      - name: The research orchestrator — classification, the cheapest reliable path, datasets, calculations, the external-research decision, planned vs actual
        run: node tools/intelligence/orchestrator.test.js
      - name: The evidence ledger — typed, dated, verified records, freshness, corroboration, contradictions, the prompt-injection screen
        run: node tools/intelligence/evidence.test.js
      - name: The calculation ledger — versioned implied / no-vig / fair / EV / break-even / max price / line gap / calibration records, recomputed independently; the number verifier
        run: node tools/intelligence/quant_verify.test.js

  football-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The matchup metrics artifact copies, never computes
        run: node tools/football/matchup_metrics.test.js
      - name: The committed metrics artifact matches its inputs
        run: node tools/football/build_matchup_metrics.js --check
      - name: The NFL slate builder agrees with the browser engine
        run: node tools/football/nfl_slate.test.js
      - name: The NFL starter, regime signal and neutral site stay honest
        run: node tools/football/nfl_regime.test.js
      - name: The identity profiles copy, date and separate measured from inferred
        run: node tools/football/team_identity.test.js
      - name: The closing-line archive copies and the pricing validation grades honestly
        run: node tools/football/pricing_validation.test.js
      - name: The desk's own data sets refuse what they cannot verify
        run: node tools/football/data_builds.test.js
      - name: The NFL stadium table verifies
        run: node tools/football/verify_nfl_stadiums.js

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The runner image ships PostgreSQL; each suite starts its own throwaway
      # cluster, applies the migration twice, and tears it down.
      - name: A published recommendation cannot be edited, deleted or re-graded
        run: node tools/intelligence/ledger_sql.test.js
      - name: A recorded research packet cannot be edited, deleted or postdate kickoff
        run: node tools/intelligence/research_packets_sql.test.js
      - name: A reader reads only their own research packets, through the table and through every view
        run: node tools/intelligence/research_packets_rls_sql.test.js
      - name: A recorded stake cannot be edited or deleted, a BET cannot be zero units and a PASS cannot carry one
        run: node tools/intelligence/stake_sql.test.js
      - name: The quant desk ledgers are write-once, reader-owned, unit-checked and chronologically separated
        run: node tools/intelligence/quant_sql.test.js
        env:
          QUANT_SQL_REQUIRED: '1'
      - name: Research findings and pregame snapshots are write-once, reader-owned and never postdate kickoff; research quotas are claimed atomically
        run: node tools/intelligence/research_intel_sql.test.js
        env:
          RESEARCH_SQL_REQUIRED: '1'
