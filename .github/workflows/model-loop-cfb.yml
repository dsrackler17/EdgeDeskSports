# EdgeDesk model loop, CFB (FBS): the served model refreshed, scored and
# challenged every week (model_loop/adapters/cfb/weekly.py, docs/model-loop/README.md).
#
#   Sunday night  the full cycle: refresh the ratings with the served version on
#             Saturday's results, grade every published pregame number that
#             settled, find where the misses concentrate, walk-forward test the
#             candidate fixes, promote one only if it improves BOTH margin MAE
#             and log loss on the full 2014-to-date backtest and is no worse on
#             the last full season, then re-publish and write the weekly report.
#   Other days  refresh only (same formula): midweek results, new starters and
#             the current lines reach the cards; nothing about the model changes.
#
# Publishes football/cfb/model_loop/current.json (the served numbers), the
# record, the append-only ledgers and the version history, by commit.
# SB_DB_URL (optional): mirrors snapshots and versions into Supabase; a
# missing secret or table is a warning, never a reason to withhold the cards.
name: Model loop CFB (weekly)

on:
  schedule:
    - cron: '37 23 * 8-12,1 0'          # Sunday 23:37 UTC, after Saturday's games and the sportsdataverse refresh
    - cron: '37 13 * 8-12,1 1-6'        # every other day in season: refresh only
  workflow_dispatch:
    inputs:
      mode:
        description: 'all (refresh, score, research, report) or refresh'
        required: false
        default: 'all'

permissions:
  contents: write

concurrency:
  group: model-loop-cfb
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python deps (pinned)
        run: pip install --quiet -r model_loop/requirements.txt
      - name: Core guarantees before anything is published
        run: python3 -m unittest discover -s model_loop/tests -t .
      # finished seasons never change: cache them; the current season is always refetched
      - uses: actions/cache@v4
        with:
          path: |
            .cache/model_loop/cfb/raw
            .cache/model_loop/cfb/build/market.csv
          key: model-loop-cfb-raw-${{ github.run_id }}
          restore-keys: model-loop-cfb-raw-
      - name: Mode
        id: mode
        run: |
          m="${{ inputs.mode }}"
          if [ -z "$m" ]; then
            if [ "$(date -u +%u)" = "7" ]; then m=all; else m=refresh; fi
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "mode: $m"
      - name: Run the loop
        run: python3 -m model_loop.adapters.cfb.weekly ${{ steps.mode.outputs.mode }}
      - name: The published card reconciles (components sum to the fair line, range centred)
        run: |
          python3 - <<'EOF'
          import json, sys
          c = json.load(open('football/cfb/model_loop/current.json'))
          bad = [g['game_id'] for g in c['games'] if abs(g['reconciliation']['unattributed']) > 1e-6
                 or abs((g['range80']['lo'] + g['range80']['hi']) / 2 - g['fair_home_margin']) > 0.011]
          print(len(c['games']), 'games;', 'bad:', bad)
          sys.exit(1 if bad else 0)
          EOF
      - name: Mirror to Supabase (optional)
        continue-on-error: true
        env:
          PGURL: ${{ secrets.SB_DB_URL }}
        run: |
          if [ -z "$PGURL" ]; then echo "::warning::SB_DB_URL is not set: snapshots and versions stay in the repo only."; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          season=$(python3 -c "import json;print(json.load(open('football/cfb/model_loop/current.json'))['season'])")
          python3 -m model_loop.core.db_sync snapshots "model_loop/ledger/cfb/${season}.jsonl" > /tmp/snapshots.sql
          psql "$PGURL" -X -q -v ON_ERROR_STOP=1 -f /tmp/snapshots.sql 2>&1 | tail -3
          python3 -m model_loop.core.db_sync registry cfb > /tmp/registry.sql
          psql "$PGURL" -X -q -v ON_ERROR_STOP=1 -f /tmp/registry.sql 2>&1 | tail -4
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- football/cfb/model_loop/ model_loop/ledger/cfb/ docs/model-loop/cfb/versions.json \
            docs/model-loop/cfb/candidates.jsonl docs/model-loop/cfb/weekly/ docs/model-loop/cfb/weekly_model_report.md
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          git commit -m "model loop: CFB ${{ steps.mode.outputs.mode }} — served numbers, record and ledgers"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || true
            sleep $((2 ** i))
          done
          echo 'could not push after 4 attempts'; exit 1
