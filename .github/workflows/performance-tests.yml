# EdgeDesk Model Performance — the suites a pull request must pass.
#
# The public record claims that every forecast was locked before its game and
# graded against the verified final, misses included. A change that grades a
# number produced after the start, overwrites a revision, counts a recorded
# import as verified, settles a game its sources disagree on, assumes a price,
# prints a rate from a handful of games, exposes an upcoming forecast, lets a
# client write the ledger, or rewrites a committed ledger line has to fail on
# the PR that makes it.
name: Model performance tests

on:
  pull_request:
    paths:
      - 'lib/edgedesk_performance.js'
      - 'lib/edgedesk_calibration.js'
      - 'lib/edgedesk_projections.js'
      - 'engine/build_projections.js'
      - 'tools/performance/**'
      - 'performance/**'
      - 'supabase/model_performance*.sql'
      - 'tools/articles/article_render.js'
      - 'tools/articles/build_articles.js'
      - 'tools/slate/espn.js'
      - '.github/workflows/performance*.yml'
      - '.github/workflows/deploy-model-performance.yml'
  push:
    branches: [main]
    paths:
      - 'lib/edgedesk_performance.js'
      - 'tools/performance/**'
      - 'supabase/model_performance*.sql'
      - 'performance/index.html'
      - 'performance/performance.js'
      - 'performance/performance.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The kernel, the ledger and the whole lifecycle (grading, pushes and ties, missing odds, the pregame rule, revisions, postponements, corrections, version changes, duplicate runs)
        run: node tools/performance/performance.test.js
      - name: Append-only against the base branch (no committed ledger line rewritten, every chain verifies)
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "${{ github.base_ref || 'main' }}" --depth=200 || true
          node tools/performance/run.js --check --base "$base"
      - name: The database (append-only for every role, the chain, the pregame rule, server stamps, RLS as anon and a reader, the rollback)
        env:
          PERF_SQL_REQUIRED: '1'
        run: |
          sudo apt-get install -y -qq postgresql postgresql-client >/dev/null 2>&1 || true
          node tools/performance/performance_sql.test.js
      - name: The article block and the existing article suites
        run: node tools/articles/articles.test.js
      - name: Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: /performance/ in a real browser (390 and 1280 px; insufficient data, a verified record, a failed load)
        run: node tools/performance/performance_ui.e2e.js
