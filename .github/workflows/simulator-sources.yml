# EdgeDesk Simulator — the primary sources its activation gates name, read
# from GitHub's runners (the build environment cannot reach them).
#
# Read-only: no secret, no database, nothing committed. The job prints each
# source whole (URL, HTTP status, sha256, text) and keeps the files as an
# artifact, so the reviewed commit that marks a fact VERIFIED or adds a
# Kalshi mapping can cite exactly what was read:
#   - the NFL's published tiebreaking procedures, its approved 2026 rules,
#     bylaws and resolutions (and the proposals), NFL support's seeding and
#     playoff scheduling pages, the NFL.com Super Bowl LXI site announcement
#   - Kalshi's NFL futures series (fee_type, fee_multiplier), every open
#     market's full settlement rules and their sha256, the fee schedule
# Runs on a pull request that changes it, or by hand.
name: Simulator source check

on:
  pull_request:
    paths:
      - '.github/workflows/simulator-sources.yml'
      - 'simulator/src/cli/fetch_sources.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-sources-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
      - name: Install pdftotext (for the fee schedule PDF)
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null 2>&1 || echo "::warning::poppler-utils did not install; the PDFs will be kept but not printed"
      - name: Fetch and print the sources
        run: node simulator/src/cli/fetch_sources.ts --out simulator/out/sources
      - name: Keep the fetched files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulator-sources-${{ github.run_id }}
          path: simulator/out/sources
          if-no-files-found: ignore
          retention-days: 30
