<body class="gd-body">

<!-- GAME DAY ------------------------------------------------------------------
     Three rows and nothing else: the scoreboard, the field, the call sheet.
     The field is the product, so it gets every pixel the other two do not
     need. There is no site navigation here on purpose — you are in a game. -->
<div class="gd" id="gd" hidden>
  <div class="sb" id="sb"></div>
  <div class="gd-field" id="fieldWrap">
    <canvas id="fld" class="fld" aria-label="The football field"></canvas>
    <div class="gd-read" id="read" hidden></div>
    <div class="gd-tools">
      <button id="btnArt" type="button" aria-pressed="true" title="Play art" aria-label="Play art">◈</button>
      <button id="btnSound" type="button" aria-pressed="true" title="Sound" aria-label="Sound">♪</button>
      <button id="btnFull" type="button" data-full aria-pressed="false" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      <button id="btnSet" type="button" title="Settings" aria-label="Settings">⚙</button>
      <button id="btnExit" type="button" title="Leave the game" aria-label="Leave the game">✕</button>
    </div>
    <div class="gd-say" id="say" aria-live="polite"></div>
    <!-- the thumbs: a stick, two actions, the receivers, the snap -->
    <div class="pad" id="pad"></div>
  </div>
  <!-- the call sheet, as a drawer that gets out of the way -->
  <div class="drawer" id="drawer"></div>
</div>

<main class="wrap" id="pre">
  <!-- the first thing you see is a football field with two teams on it -->
  <canvas id="preField" class="pre-field" aria-hidden="true"></canvas>
  <div class="sec" style="margin-top:18px"><div class="card" id="preCard">
    <div class="eyebrow">Game Day</div>
    <div class="sk" style="width:55%;margin:16px 0"></div>
    <div class="sk-label" style="text-align:left">Getting the teams ready</div>
  </div></div>
</main>

<script>
/* STALE SCRIPT GUARD. A browser can keep an old copy of a library for longer
   than it keeps this page, and a page built for the new engine then dies on
   the first function the old copy lacks. The asset URLs carry a version token
   so that should not happen; this is the belt for the braces. */
(function(){
  var need=['EDFootball.playbook','EDFootball.defParts','EDFootball.strongSide','EDRoster.units',
    'EDGridiron.createGame','EDGridiron.step','EDGridiron.situation','EDGridiron.boxScore',
    'EDGridironAI.callOffense','EDGridironAI.callDefense','EDGridironAuto.callFor',
    'EDGridironPaint.player','EDGridironPaint.field','EDGridironStage.Stage','EDGridironStage.alignDefense',
    'EDGridironSession.build','EDGridironSession.resume','EDGridironSession.preSnap','EDGridironFlow.create'];
  var miss=need.filter(function(k){var p=k.split('.'),o=window[p[0]];return !o||typeof o[p[1]]!=='function';});
  if(!miss.length)return;
  var host=document.getElementById('preCard');
  if(host)host.innerHTML='<div class="eyebrow">EdgeDesk Games</div>'
    +'<div class="empty">This page needs a newer copy of the game than your browser has kept.<br>'
    +'<a class="btn btn-go" style="margin-top:14px" href="'+location.pathname+'?fresh='+Date.now()+'">Reload the page</a></div>';
  try{console.warn('stale gridiron scripts: '+miss.join(', '));}catch(_){}
})();
</script>
