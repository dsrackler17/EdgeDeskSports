<title>Head-to-Head | EdgeDesk Games</title>
<meta name="description" content="Challenge a friend on a football game. Pick the winner, a side against the line, or price it yourself — their pick stays hidden until you lock yours. Free to play, no real-money wagering.">
<meta name="theme-color" content="#0b0d11">

<!-- A specific challenge is a private page between two people: it is addressed
     by an unguessable token and must never be indexed. The robots tag is static
     because a static host cannot vary it per URL, so the whole route is
     noindex; the public explainer for Head-to-Head lives on /games. -->
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EdgeDesk Games">
<meta property="og:title" content="You've been challenged — EdgeDesk Games">
<meta property="og:description" content="A friend challenged you on a football game. Their pick is hidden until you lock yours. Free to play, no real-money wagering.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="You've been challenged — EdgeDesk Games">
<meta name="twitter:description" content="Their pick is hidden until you lock yours. Free to play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/games.css">
</head>
<body>
<div id="gh"></div>

<main class="wrap">
  <div class="sec" style="margin-top:20px">
    <div class="card" id="stage">
      <div class="eyebrow">Head-to-Head</div>
      <div class="sk" style="width:55%;margin:16px auto"></div>
      <div class="sk" style="width:35%;margin:10px auto"></div>
    </div>
  </div>
  <div id="after"></div>
</main>

<div id="gf"></div>

<script src="/games/lib/week.js"></script>
<script src="/games/lib/scoring.js"></script>
<script src="/games/lib/challenge.js"></script>
<script src="/games/lib/research_state.js"></script>
<script src="/games/lib/attribution.js"></script>
<script src="/games/lib/store.js"></script>
<script src="/games/lib/social.js"></script>
<script src="/games/lib/h2h_grade.js"></script>
<script src="/games/games.js"></script>
<script>
(function(){
  'use strict';
  var G=window.EDGames,S=window.EDGamesSocial,ST=window.EDGamesStore,
      CH=window.EDGamesChallenge,SC=window.EDGamesScoring,RS=window.EDGamesResearchState;
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'),after=$('after');
  var POOL=[],ART=null,TOKEN=null,DRAFT={mode:'spread',game:null,selection:null};
  /* the same selector bounds Price It uses, from the one place that declares them */
  var RANGE=G.SPREAD_RANGE,STEP=G.SPREAD_STEP;

  /* boot() resolves once the social endpoint is configured, so nothing calls an
     RPC against an unconfigured client and reports a false "not deployed". */
  var READY=G.boot('h2h');

  /* The token comes from the pretty path /games/h2h/{token} (rewritten by
     404.html) or from ?c= directly. */
  function param(k){
    var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
    return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null;
  }
  TOKEN=param('c');
  /* Set when the challenge was started from a group member row. An invite is a
     LINK, not a directed message — there is no way to push a challenge at
     somebody — so this only names who the link is meant for, and shapes the
     share text. The opponent is still whoever opens it. */
  var VS=param('vs');

  function initials(n){
    return String(n||'?').trim().split(/\s+/).map(function(w){return w[0];})
      .join('').slice(0,2).toUpperCase()||'?';
  }
  function esc(s){return G.esc(s);}

  /* ── shared pieces ─────────────────────────────────────────────────────── */

  function backendDown(msg){
    stage.innerHTML='<div class="eyebrow">Head-to-Head</div>'
      +'<div class="empty">'+esc(msg||'Head-to-Head is not available right now.')+'<br>'
      +'<a href="/games/">Back to EdgeDesk Games</a> · '
      +'<a href="/games/price-it/">Play Price It</a></div>';
  }

  function phaseBadge(p){
    var cls=p==='FINAL'||p==='DRAW'?'done':p==='IN_PROGRESS'?'live'
      :p==='EXPIRED'||p==='CANCELLED'||p==='MISSING'?'dead':'wait';
    return '<span class="phase '+cls+'"><span class="dot"></span>'
      +esc(S.PHASE_LABEL[p]||p)+'</span>';
  }

  function vsBlock(ch,aName,bName,outcome){
    function side(name,slot,isYou){
      var cls=isYou?' you':'';
      if(outcome){
        var r=slot==='a'?outcome:S.PHASE_LABEL&&outcome;
      }
      return '<div class="vs-p'+cls+'"><div class="vs-av">'+esc(initials(name))+'</div>'
        +'<div class="vs-n">'+esc(name||'Waiting…')+'</div>'
        +(isYou?'<div class="vs-s">you</div>':'')+'</div>';
    }
    return '<div class="vs">'+side(aName,'a',ch&&ch.your_slot==='a')
      +'<div class="vs-mid">VS</div>'+side(bName,'b',ch&&ch.your_slot==='b')+'</div>';
  }

  function matchupLine(ch){
    return '<div style="text-align:center;margin-top:6px">'
      +'<div class="mu-team" style="font-size:19px">'+esc(ch.away_team)
      +' <span style="color:var(--faint)">vs</span> '+esc(ch.home_team)+'</div>'
      +'<div class="mu-when">'+esc(G.kickoffLabel(ch.kickoff))+'</div></div>';
  }

  /* the line each side is getting, from the SNAPSHOT on the challenge */
  function sideLine(ch,side){
    var s=ch.market_snapshot&&ch.market_snapshot.spread;
    if(s==null||!isFinite(s))return '';
    var v=side==='home'?s:-s,r=Math.round(v*10)/10;
    if(r===0)return 'PK';
    return (r<0?'−':'+')+Math.abs(r).toFixed(1);
  }

  function pickLabel(ch,sel){
    if(!sel)return '—';
    if(ch.mode==='price_it')
      return G.line({home_team:ch.home_team,away_team:ch.away_team},sel.spread)||'Pick ’em';
    var team=sel.side==='home'?ch.home_team:ch.away_team;
    return ch.mode==='spread'?(team+' '+sideLine(ch,sel.side)):team;
  }

  function researchLink(ch,where){
    return '<div class="btn-row"><button class="btn" type="button" data-research="'
      +esc(where)+'">Research this game →</button></div>';
  }
  function wireResearch(ch){
    Array.prototype.forEach.call(document.querySelectorAll('[data-research]'),function(b){
      b.addEventListener('click',function(){
        var c=CH.bySlug(POOL,ch.game_slug)||{game_id:ch.canonical_game_id,slug:ch.game_slug,
          research_state:null};
        G.track('research_open_from_h2h',{game_id:ch.canonical_game_id,game_slug:ch.game_slug,
          game_type:'h2h',mode:ch.mode,placement:b.getAttribute('data-research')});
        G.openResearch(c,'h2h_'+b.getAttribute('data-research'));
      });
    });
  }

  /* ── 1. CREATE ─────────────────────────────────────────────────────────── */

  function renderCreate(){
    var live=CH.playable(POOL);
    if(!live.length){ backendDown('No matchup is available to challenge on right now.'); return; }
    DRAFT.game=DRAFT.game||live[0];
    var opts=live.slice(0,30).map(function(c){
      return '<option value="'+esc(c.slug)+'"'+(c.slug===DRAFT.game.slug?' selected':'')+'>'
        +esc(c.away_team+' at '+c.home_team)+'</option>';
    }).join('');

    stage.innerHTML='<div class="eyebrow">Head-to-Head</div>'
      +'<h1 style="font-size:24px;font-family:\'Space Grotesk\',sans-serif">'
      +(VS?('Challenge '+esc(VS)+'.<br>Settle it on the field.'):'Challenge a friend.<br>Settle it on the field.')+'</h1>'
      +'<p style="color:var(--dim);font-size:14px;margin:10px 0 0">Pick a game, make your call, and send '
      +(VS?('the link to '+esc(VS)+'.'):'the link.')+' Your pick stays sealed until they make theirs.</p>'
      +'<div style="margin-top:18px"><div class="eyebrow">The game</div>'
      +'<select id="gamePick" class="btn" style="text-align:left;padding:0 14px" '
      +'aria-label="Choose a matchup">'+opts+'</select></div>'
      +'<div style="margin-top:18px"><div class="eyebrow">The challenge</div>'
      +'<div class="modes" id="modes"></div></div>'
      +'<div id="pickHost"></div>'
      +'<div class="btn-row"><button class="btn btn-go" id="create" type="button" disabled>Create the challenge</button></div>'
      +'<div class="ftp" style="text-align:center;margin-top:12px"><b>Free to play</b> · No real-money wagering</div>';

    paintModes();
    paintPicker();
    $('gamePick').addEventListener('change',function(){
      DRAFT.game=CH.bySlug(POOL,this.value)||DRAFT.game;
      DRAFT.selection=null;
      paintModes(); paintPicker();
    });
    $('create').addEventListener('click',doCreate);
    G.track('h2h_create',{stage:'open',game_type:'h2h'});
  }

  function modeAvailable(m){
    if(m==='spread')return !!(DRAFT.game&&DRAFT.game.market_spread!=null);
    return true;
  }

  function paintModes(){
    var host=$('modes');if(!host)return;
    if(!modeAvailable(DRAFT.mode))DRAFT.mode='winner';
    host.innerHTML=['spread','winner','price_it'].map(function(k){
      var m=S.MODES[k],ok=modeAvailable(k);
      return '<button class="mode" type="button" data-mode="'+k+'"'
        +' aria-pressed="'+(DRAFT.mode===k?'true':'false')+'"'+(ok?'':' disabled')+'>'
        +'<div class="t">'+esc(m.label)+'</div><div class="b">'
        +esc(ok?m.blurb:'No book number on this game yet.')+'</div></button>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('.mode'),function(b){
      b.addEventListener('click',function(){
        DRAFT.mode=b.getAttribute('data-mode');DRAFT.selection=null;
        paintModes();paintPicker();
      });
    });
  }

  function paintPicker(){
    var host=$('pickHost'),ch=DRAFT.game;if(!host||!ch)return;
    var pseudo={home_team:ch.home_team,away_team:ch.away_team,
      market_snapshot:{spread:ch.market_spread},mode:DRAFT.mode};
    if(DRAFT.mode==='price_it'){
      var cur=DRAFT.selection&&DRAFT.selection.spread!=null?DRAFT.selection.spread:0;
      host.innerHTML='<div class="sel" style="margin-top:18px">'
        +'<div class="eyebrow">Your line</div>'
        +'<div class="sel-read" aria-live="polite"><div class="sel-line mono" id="rl">'
        +esc(G.line(ch,cur)||'Pick ’em')+'</div></div>'
        +'<div class="sel-ends"><span>'+esc(ch.away_team)+' −'+RANGE+'</span><span>'
        +esc(ch.home_team)+' −'+RANGE+'</span></div>'
        +'<input class="sel-range" type="range" id="sl" min="'+(-RANGE)+'" max="'+RANGE+'" step="'+STEP+'" value="'
        +(-cur)+'" aria-label="Your line for this game, in points">'
        +'<div class="sel-nudge"><button class="nudge" id="dn" type="button" aria-label="Half a point toward '+esc(ch.away_team)+'">−</button>'
        +'<div class="sel-hint">Half-point steps</div>'
        +'<button class="nudge" id="up" type="button" aria-label="Half a point toward '+esc(ch.home_team)+'">+</button></div></div>';
      var sl=$('sl');
      function paint(){
        var v=-(+sl.value);
        DRAFT.selection={spread:v};
        $('rl').textContent=G.line(ch,v)||'Pick ’em';
        $('create').disabled=false;
      }
      sl.addEventListener('input',paint);
      $('dn').addEventListener('click',function(){sl.value=Math.min(RANGE,(+sl.value)+STEP);paint();});
      $('up').addEventListener('click',function(){sl.value=Math.max(-RANGE,(+sl.value)-STEP);paint();});
      paint();
      return;
    }
    host.innerHTML='<div style="margin-top:18px"><div class="eyebrow">Your pick</div>'
      +'<div class="sides">'
      +sideBtn(pseudo,'away',ch.away_team)+sideBtn(pseudo,'home',ch.home_team)
      +'</div></div>'
      +(DRAFT.mode==='spread'&&ch.market_spread!=null
        ? '<div class="locked-line"><span class="k">Locked line</span><span class="v">'
          +esc(G.line(ch,ch.market_spread))+'</span></div>'
          +'<div class="ftp" style="margin-top:8px">This line is snapshotted now. Your challenge '
          +'settles against it even if the market moves.</div>'
        :'');
    Array.prototype.forEach.call(host.querySelectorAll('.side'),function(b){
      b.addEventListener('click',function(){
        DRAFT.selection={side:b.getAttribute('data-side')};
        Array.prototype.forEach.call(host.querySelectorAll('.side'),function(o){
          o.setAttribute('aria-pressed',o===b?'true':'false');
        });
        $('create').disabled=false;
      });
    });
  }

  function sideBtn(pseudo,side,team){
    var on=DRAFT.selection&&DRAFT.selection.side===side;
    var ln=pseudo.mode==='spread'?sideLine(pseudo,side):'';
    return '<button class="side" type="button" data-side="'+side+'" aria-pressed="'+(on?'true':'false')+'">'
      +'<span>'+esc(team)+'</span>'+(ln?'<span class="ln">'+esc(ln)+'</span>':'')+'</button>';
  }

  function doCreate(){
    var ch=DRAFT.game;
    if(!ch||!DRAFT.selection)return;
    var btn=$('create');btn.disabled=true;btn.textContent='Creating…';
    S.createChallenge({
      mode:DRAFT.mode,game_id:ch.game_id,slug:ch.slug,
      home_team:ch.home_team,away_team:ch.away_team,
      kickoff:ch.kickoff?new Date(String(ch.kickoff).replace(' ','T')).toISOString():null,
      market:{spread:ch.market_spread,edgedesk:ch.edgedesk_spread,
        research_state:ch.research_state,captured_at:new Date().toISOString()},
      selection:DRAFT.selection
    }).then(function(r){
      btn.disabled=false;btn.textContent='Create the challenge';
      if(!r.ok){G.toast(r.message||'Could not create the challenge.');return;}
      G.track('h2h_invite_generated',{game_id:ch.game_id,game_slug:ch.slug,
        game_type:'h2h',mode:DRAFT.mode,research_state:ch.research_state,
        from_group:VS?'member':'direct'});
      renderInvite(r.data.invite_token,ch);
    });
  }

  function renderInvite(token,ch){
    var url=S.challengeUrl(token);
    stage.className='card reveal';
    stage.innerHTML='<div class="eyebrow">Challenge created</div>'
      +'<div class="invite"><div style="font-family:\'Space Grotesk\',sans-serif;font-size:19px;font-weight:700">'
      +(VS?('Send this to '+esc(VS)):'Send this to a friend')+'</div>'
      +'<p style="color:var(--dim);font-size:13.5px;margin:8px 0 0">Your pick is sealed. They cannot see it '
      +'until they make theirs.</p>'
      +'<div class="url" id="inviteUrl">'+esc(url)+'</div>'
      +'<div class="btn-row two"><button class="btn btn-go" id="shareBtn" type="button">Send the challenge</button>'
      +'<button class="btn" id="copyBtn" type="button">Copy link</button></div></div>'
      +'<div class="btn-row"><a class="btn btn-ghost" href="/games/h2h/'+encodeURIComponent(token)+'">View the challenge</a></div>';
    var text=(VS?(VS+' — I'):'I')+' challenged you on '+ch.away_team+' vs '+ch.home_team+'.\n\n'
      +'Think you know the game better?\n\nTake the challenge:\n'+url
      +'\n\nEdgeDesk Games\nFree to play. No real-money wagering.';
    function shared(how){
      G.track('h2h_invite_generated',{stage:'shared',how:how,game_type:'h2h',mode:DRAFT.mode});
    }
    $('shareBtn').addEventListener('click',function(){
      if(navigator.share){
        navigator.share({title:'EdgeDesk Games',text:text,url:url}).then(function(){shared('native');},function(){});
      }else{copy(text+'',url,'native_fallback');}
    });
    $('copyBtn').addEventListener('click',function(){copy(text,url,'copy');});
    function copy(t,u,how){
      var payload=t;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(payload).then(function(){
          G.toast('Challenge link copied');shared(how);
        },function(){G.toast('Copy this: '+u);});
      }else{G.toast('Copy this: '+u);}
    }
  }

  /* ── 2. VIEW / ANSWER ──────────────────────────────────────────────────── */

  function renderChallenge(ch){
    var p=S.phase(ch),a=S.entry(ch,'a'),b=S.entry(ch,'b');
    var selA=S.selectionOf(ch,'a'),selB=S.selectionOf(ch,'b');
    stage.className='card reveal';

    /* THE INVITE LANDING — the most important acquisition screen in the
       product. A stranger from a group chat must understand it instantly. */
    if(p==='YOUR_TURN'){
      stage.innerHTML='<div class="eyebrow">Head-to-Head</div>'
        +'<h1 style="font-size:22px;font-family:\'Space Grotesk\',sans-serif;text-align:center">'
        +esc(a?a.display_name:'A friend')+' challenged you</h1>'
        +matchupLine(ch)
        +'<div style="text-align:center;margin-top:12px">'+phaseBadge(p)+'</div>'
        +'<div class="sealed"><span>🔒</span><span><b>'+esc(a?a.display_name:'Their')+'’s pick is hidden.</b> '
        +'It stays sealed until you lock yours — the server will not send it, so there is nothing to peek at.</span></div>'
        +modeExplainer(ch)
        +answerPicker(ch)
        +'<div class="btn-row"><button class="btn btn-go" id="lockIt" type="button" disabled>Lock my pick</button></div>'
        +researchLink(ch,'before_pick')
        +'<div class="ftp" style="text-align:center;margin-top:12px"><b>Free to play</b> · No signup needed · No real-money wagering</div>';
      wireAnswer(ch);
      wireResearch(ch);
      G.track('h2h_invite_open',{game_id:ch.canonical_game_id,game_slug:ch.game_slug,
        game_type:'h2h',mode:ch.mode,identity:S.signedIn()?'authenticated':'anonymous'});
      return;
    }

    var head='<div class="eyebrow">Head-to-Head</div>'
      +vsBlock(ch,a?a.display_name:'…',b?b.display_name:'Waiting…')
      +matchupLine(ch)
      +'<div style="text-align:center;margin-top:12px">'+phaseBadge(p)+'</div>';

    if(p==='WAITING_FOR_OPPONENT'){
      var url=S.challengeUrl(ch.invite_token);
      stage.innerHTML=head
        +'<div class="sealed"><span>🔒</span><span><b>Your pick is sealed.</b> '
        +'Nobody sees it until your opponent locks theirs.</span></div>'
        +'<div class="invite" style="margin-top:16px">'
        +'<div style="font-weight:700">Nobody has taken it yet</div>'
        +'<div class="url">'+esc(url)+'</div>'
        +'<div class="btn-row two"><button class="btn btn-go" id="shareBtn" type="button">Send the challenge</button>'
        +'<button class="btn" id="copyBtn" type="button">Copy link</button></div></div>'
        +researchLink(ch,'waiting');
      var text='I challenged you on '+ch.away_team+' vs '+ch.home_team+'.\n\nTake the challenge:\n'+url
        +'\n\nEdgeDesk Games\nFree to play. No real-money wagering.';
      $('shareBtn').addEventListener('click',function(){
        if(navigator.share)navigator.share({title:'EdgeDesk Games',text:text,url:url}).catch(function(){});
        else doCopy(text,url);
      });
      $('copyBtn').addEventListener('click',function(){doCopy(text,url);});
      wireResearch(ch);
      return;
    }

    /* locked, live, final or draw — both answers are public now */
    var res=ch.settlement||null;
    var oa=res?res.outcome_a:null, ob=res?res.outcome_b:null;
    function ansCard(e,sel,outcome){
      var tag=outcome==='win'?'<div class="tag w">Won</div>'
        :outcome==='loss'?'<div class="tag l">Lost</div>'
        :outcome==='draw'?'<div class="tag d">Draw</div>':'';
      return '<div class="answer'+(e&&e.is_you?' you':'')+'">'
        +'<div class="who">'+esc(e?e.display_name:'—')+'</div>'
        +'<div class="pick">'+esc(pickLabel(ch,sel))+'</div>'+tag+'</div>';
    }
    var body=head
      +'<div class="answers">'+ansCard(a,selA,oa)+ansCard(b,selB,ob)+'</div>';

    if(ch.mode==='spread'&&ch.market_snapshot&&ch.market_snapshot.spread!=null){
      body+='<div class="locked-line"><span class="k">Locked line</span><span class="v">'
        +esc(G.line(ch,ch.market_snapshot.spread))+'</span></div>';
    }
    if(ch.mode==='price_it'){
      body+=priceItContext(ch);
    }
    if(p==='LOCKED'){
      body+='<div class="ftp" style="text-align:center;margin-top:14px">Picks are in. '
        +esc(G.kickoffLabel(ch.kickoff))+'</div>';
    }
    if(p==='IN_PROGRESS'){
      body+='<div class="ftp" style="text-align:center;margin-top:14px">Game in progress. '
        +'The result posts when the final score lands.</div>';
    }
    if(res){
      body+='<div class="delta" style="margin-top:14px">'+esc(settlementLine(ch,res))+'</div>';
      var mine=ch.your_slot?(ch.your_slot==='a'?oa:ob):null;
      body+=resultCtas(ch,mine);
    }else{
      body+=researchLink(ch,p==='IN_PROGRESS'?'in_progress':'locked');
    }
    stage.innerHTML=body;
    wireResearch(ch);
    if(res)wireResultCtas(ch);
    if(p==='LOCKED'||p==='IN_PROGRESS')G.track('h2h_both_locked',{game_id:ch.canonical_game_id,
      game_type:'h2h',mode:ch.mode});
    if(res)G.track('h2h_settled',{game_id:ch.canonical_game_id,game_type:'h2h',mode:ch.mode,
      outcome:ch.your_slot?(ch.your_slot==='a'?oa:ob):'observer'});
  }

  function modeExplainer(ch){
    var m=S.MODES[ch.mode]||{label:ch.mode,blurb:''};
    return '<div class="locked-line"><span class="k">'+esc(m.label)+'</span>'
      +'<span class="v" style="font-family:Inter,sans-serif;font-weight:500;color:var(--dim);font-size:12.5px">'
      +esc(m.blurb)+'</span></div>';
  }

  function answerPicker(ch){
    if(ch.mode==='price_it'){
      return '<div class="sel" style="margin-top:16px">'
        +'<div class="sel-read" aria-live="polite"><div class="sel-line mono" id="rl">Pick ’em</div>'
        +'<div class="sel-who" id="rw">Set the line you think is fair</div></div>'
        +'<div class="sel-ends"><span>'+esc(ch.away_team)+' −'+RANGE+'</span><span>'+esc(ch.home_team)+' −'+RANGE+'</span></div>'
        +'<input class="sel-range" type="range" id="sl" min="'+(-RANGE)+'" max="'+RANGE+'" step="'+STEP+'" value="0"'
        +' aria-label="Your line for this game, in points">'
        +'<div class="sel-nudge"><button class="nudge" id="dn" type="button" aria-label="Half a point toward '+esc(ch.away_team)+'">−</button>'
        +'<div class="sel-hint">Half-point steps</div>'
        +'<button class="nudge" id="up" type="button" aria-label="Half a point toward '+esc(ch.home_team)+'">+</button></div></div>';
    }
    var out='<div class="sides">'
      +'<button class="side" type="button" data-side="away" aria-pressed="false"><span>'
      +esc(ch.away_team)+'</span>'+(ch.mode==='spread'?'<span class="ln">'+esc(sideLine(ch,'away'))+'</span>':'')+'</button>'
      +'<button class="side" type="button" data-side="home" aria-pressed="false"><span>'
      +esc(ch.home_team)+'</span>'+(ch.mode==='spread'?'<span class="ln">'+esc(sideLine(ch,'home'))+'</span>':'')+'</button>'
      +'</div>';
    if(ch.mode==='spread'&&ch.market_snapshot&&ch.market_snapshot.spread!=null){
      out+='<div class="locked-line"><span class="k">Locked line</span><span class="v">'
        +esc(G.line(ch,ch.market_snapshot.spread))+'</span></div>';
    }
    return out;
  }

  function wireAnswer(ch){
    var sel=null,btn=$('lockIt');
    if(ch.mode==='price_it'){
      var sl=$('sl');
      function paint(){
        var v=-(+sl.value);sel={spread:v};
        $('rl').textContent=G.line(ch,v)||'Pick ’em';
        $('rw').textContent=v===0?'Even game — nobody is giving points'
          :((v<0?ch.home_team:ch.away_team)+' gives '+Math.abs(v).toFixed(1)+' points');
        btn.disabled=false;
      }
      sl.addEventListener('input',paint);
      $('dn').addEventListener('click',function(){sl.value=Math.min(RANGE,(+sl.value)+STEP);paint();});
      $('up').addEventListener('click',function(){sl.value=Math.max(-RANGE,(+sl.value)-STEP);paint();});
      paint();
    }else{
      Array.prototype.forEach.call(document.querySelectorAll('.side'),function(b){
        b.addEventListener('click',function(){
          sel={side:b.getAttribute('data-side')};
          Array.prototype.forEach.call(document.querySelectorAll('.side'),function(o){
            o.setAttribute('aria-pressed',o===b?'true':'false');
          });
          btn.disabled=false;
        });
      });
    }
    btn.addEventListener('click',function(){
      if(!sel)return;
      btn.disabled=true;btn.textContent='Locking…';
      S.submitChallenge(ch.invite_token,sel).then(function(r){
        if(!r.ok){
          btn.disabled=false;btn.textContent='Lock my pick';
          G.toast(r.message||'Could not lock your pick.');return;
        }
        G.track('h2h_opponent_submit',{game_id:ch.canonical_game_id,game_type:'h2h',
          mode:ch.mode,identity:S.signedIn()?'authenticated':'anonymous'});
        load();
      });
    });
  }

  function priceItContext(ch){
    var snap=ch.market_snapshot||{};
    var rows='';
    if(snap.spread!=null)rows+='<div class="price"><div class="k">Market</div><div class="v">'
      +esc(G.line(ch,snap.spread))+'</div><div class="n">at challenge time</div></div>';
    if(snap.edgedesk!=null)rows+='<div class="price"><div class="k">EdgeDesk</div><div class="v">'
      +esc(G.line(ch,snap.edgedesk))+'</div><div class="n">model</div></div>';
    if(!rows)return '';
    return '<div class="prices" style="margin-top:12px;grid-template-columns:repeat(2,1fr)">'+rows+'</div>'
      +'<div class="ftp" style="text-align:center;margin-top:8px">Neither number is the right answer — '
      +'EdgeDesk does not beat the closing line.</div>';
  }

  function settlementLine(ch,res){
    var ev=res.evidence||{};
    var base=ev.reason?String(ev.reason):'';
    var score=(ev.home_score!=null&&ev.away_score!=null)
      ?(ch.away_team+' '+ev.away_score+' · '+ch.home_team+' '+ev.home_score):'';
    return [score,base].filter(Boolean).join(' — ') || 'Settled.';
  }

  function resultCtas(ch,mine){
    var lead=mine==='loss'
      ? 'Want to see what you missed?'
      : mine==='win' ? 'See how EdgeDesk priced it.' : 'See how EdgeDesk priced it.';
    return '<div style="margin-top:18px"><div class="eyebrow">'+esc(lead)+'</div>'
      +'<p style="color:var(--dim);font-size:13px;margin:0 0 10px;line-height:1.55">'
      +'EdgeDesk gets games wrong too. The research shows its number, the market’s, and what it '
      +'could not read — not a verdict on your call.</p>'
      +'<div class="btn-row"><button class="btn btn-go" data-research="after_result" type="button">Review the matchup →</button></div>'
      +'</div>'
      +'<div class="btn-row two"><button class="btn" id="rematch" type="button">Rematch</button>'
      +'<a class="btn" href="/games/h2h/">Challenge someone else</a></div>'
      +'<div class="btn-row"><button class="btn btn-ghost" id="shareRes" type="button">Share this result</button></div>';
  }

  function wireResultCtas(ch){
    var rm=$('rematch');
    if(rm)rm.addEventListener('click',function(){
      G.track('h2h_rematch',{game_id:ch.canonical_game_id,game_type:'h2h',mode:ch.mode});
      DRAFT.mode=ch.mode;DRAFT.game=null;DRAFT.selection=null;
      history.replaceState(null,'','/games/h2h/');
      TOKEN=null;renderCreate();
    });
    var sh=$('shareRes');
    if(sh)sh.addEventListener('click',function(){shareResult(ch);});
  }

  function shareResult(ch){
    var a=S.entry(ch,'a'),b=S.entry(ch,'b');
    var selA=S.selectionOf(ch,'a'),selB=S.selectionOf(ch,'b');
    var res=ch.settlement||{};
    var mark=function(o){return o==='win'?' ✅':o==='draw'?' ➖':'';};
    var L=['HEAD-TO-HEAD','',ch.away_team+' vs '+ch.home_team,''];
    L.push((a?a.display_name:'A')+': '+pickLabel(ch,selA)+mark(res.outcome_a));
    L.push((b?b.display_name:'B')+': '+pickLabel(ch,selB)+mark(res.outcome_b));
    L.push('','Think you can beat me?','','EdgeDesk Games');
    var text=L.join('\n'),url=location.origin+'/games/h2h/';
    G.track('share_result',{game_type:'h2h',mode:ch.mode,game_id:ch.canonical_game_id});
    if(navigator.share){navigator.share({title:'EdgeDesk Games',text:text,url:url}).catch(function(){});return;}
    doCopy(text,url);
  }

  function doCopy(text,url){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text+'\n'+url).then(function(){G.toast('Copied');},
        function(){G.toast('Copy this: '+url);});
    }else G.toast('Copy this: '+url);
  }

  /* the account nudge, only after they have actually done something */
  function renderAfter(ch){
    if(!ch||S.signedIn()||!ch.your_slot){after.innerHTML='';return;}
    after.innerHTML='<div class="sec"><div class="card save"><div class="eyebrow">Save your record</div>'
      +'<p style="margin:0;color:var(--dim);font-size:14px">Create a free EdgeDesk account to keep your</p>'
      +'<ul><li>Head-to-Head record</li><li>game rating</li><li>streak</li><li>group standings</li></ul>'
      +'<div class="btn-row"><a class="btn" id="saveBtn" href="#">Save my record</a></div>'
      +'<div class="ftp" style="margin-top:10px">Your result is kept on this device until you do.</div>'
      +'</div></div>';
    var s=$('saveBtn');
    s.href=G.withAttribution('/app.html',{intent:'save_games_record'})+'#account';
    s.addEventListener('click',function(){
      G.track('signup_from_h2h',{game_type:'h2h',mode:ch.mode,game_id:ch.canonical_game_id});
    });
  }

  /* ── boot ──────────────────────────────────────────────────────────────── */

  function load(){
    if(!TOKEN){
      G.artifact().then(function(a){ART=a;POOL=a.challenges;renderCreate();})
        .catch(function(){backendDown('The challenge board could not be loaded.');});
      return;
    }
    Promise.all([
      G.artifact().catch(function(){return null;}),
      S.viewChallenge(TOKEN)
    ]).then(function(r){
      ART=r[0];POOL=(r[0]&&r[0].challenges)||[];
      var res=r[1];
      if(!res.ok){
        backendDown(res.error==='not_configured'||res.status===404
          ? 'Head-to-Head needs its database applied (supabase/games_social.sql). '
            +'Price It and Pick 5 are unaffected.'
          : (res.message||'This challenge could not be loaded.'));
        return;
      }
      if(!res.data){backendDown('That challenge link is not valid any more.');return;}
      renderChallenge(res.data);
      renderAfter(res.data);
    });
  }
  READY.then(load, load);
})();
</script>
</body>
</html>
