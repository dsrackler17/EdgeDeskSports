<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset password — EdgeDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#100e0a;--surface:#191510;--surface2:#221c15;--border:#332a1b;--text:#f1ebdf;--dim:#a29581;--faint:#6f6553;--accent:#2fa79a;--on-accent:#042320;--accent2:#54c4b7;--pos:#76bd3e;--neg:#e26044}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color-scheme:dark;accent-color:var(--accent)}
.mk{width:11px;height:18px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;transform:skewX(-12deg)}
.logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:20px}
.sheet{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 26px}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.ld{color:var(--dim);font-size:13px;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-family:'JetBrains Mono',monospace}
input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:12px;font-size:15px;font-family:'Inter',sans-serif}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{width:100%;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;border-radius:9px;padding:13px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);transition:.15s}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.6;cursor:default}
.msg{font-size:12.5px;border-radius:8px;padding:9px 12px;margin-top:12px;display:none;font-family:'JetBrains Mono',monospace}
.msg.err{display:block;color:var(--neg);background:rgba(226,96,68,.08);border:1px solid rgba(226,96,68,.3)}
.msg.ok{display:block;color:var(--pos);background:rgba(118,189,62,.08);border:1px solid rgba(118,189,62,.3)}
.back{text-align:center;margin-top:16px;font-size:13px}
.back a{color:var(--accent);text-decoration:none;font-weight:600}
</style></head><body>
<div class="sheet">
  <div class="logo"><span class="mk"></span>EdgeDesk</div>
  <div id="content">
    <h1>Set a new password</h1>
    <p class="ld" id="lede">Enter a new password for your account.</p>
    <div class="fld"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
    <div class="fld"><label for="p2">Confirm password</label><input id="p2" type="password" autocomplete="new-password" placeholder="Re-enter password"></div>
    <button class="btn" id="btn" onclick="doReset()">Update password</button>
    <div class="msg" id="msg"></div>
    <div class="back"><a href="/index.html">&larr; Back to login</a></div>
  </div>
</div>
<script src="/lib/edgedesk_auth.js?v=20260907b"></script>
<script>
var SB_URL="https://iattxbkbufslbauoumga.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdHR4YmtidWZzbGJhdW91bWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzY4MDUsImV4cCI6MjA5NzIxMjgwNX0.Mly5G587o5IFRnEigU2wRp9buWEk3dFwH9RNPJK7Uo8";
function msg(t,k){var m=document.getElementById('msg');if(!t){m.className='msg';return;}m.className='msg '+(k||'err');m.textContent=t;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dead(head,body){
  document.getElementById('content').innerHTML='<h1>'+esc(head)+'</h1><p class="ld">'+esc(body)+'</p>'+
    '<div class="back"><a href="/index.html">Back to login</a> &middot; request a new reset link there.</div>';
}

/* THE RECOVERY LINK ARRIVES IN MORE THAN ONE SHAPE.
   This page used to read exactly one — `#access_token=...&type=recovery` —
   and answered "Invalid or expired link" to every other, including the
   `?token_hash=...&type=recovery` form the current Supabase email templates
   send. A customer with a perfectly good link was told it had expired, asked
   for another, and got the same screen again. lib/edgedesk_auth.js knows all
   of them; this page only decides what to show.

   It also arrives with no parameters at all when index.html has already
   spent the link and stored the session — which is the path the confirmation
   handler uses to hand a recovery over here. */
var accessToken=null, ready=false;
(function boot(){
  var stored=null;
  try{stored=JSON.parse(localStorage.getItem('edgedesk_session')||'null');}catch(_){}
  var pre=window.EDAuth?EDAuth.parse(location):{kind:'none'};

  if(pre.kind==='none'){
    /* index.html consumed the link and forwarded here with the session in
       storage. Anything else with no parameters is somebody who typed the
       URL, and has nothing to reset. */
    if(stored&&stored.access_token){accessToken=stored.access_token;ready=true;return;}
    dead('Invalid or expired link','This password-reset link is missing, invalid, or has expired. Request a new one from the login page.');
    return;
  }
  if(pre.kind==='unfinishable'){
    dead('Open this link in the browser you asked from','This reset link was issued for a different browser session. Request a new one from the login page and open it on this device.');
    return;
  }
  document.getElementById('btn').disabled=true;
  EDAuth.consume({url:SB_URL,key:SB_KEY}).then(function(r){
    if(!r.handled){dead('Invalid or expired link','Request a new one from the login page.');return;}
    if(!r.ok){dead('That link did not work',r.message||'Request a new one from the login page.');return;}
    accessToken=r.session&&r.session.access_token;
    if(!accessToken){dead('That link did not work','Request a new one from the login page.');return;}
    ready=true;document.getElementById('btn').disabled=false;
  });
})();

['p1','p2'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doReset();}});});
async function doReset(){
  var p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(!ready){msg('Still checking your link — one moment.');return;}
  if(!p1||!p2){msg('Enter and confirm your new password.');return;}
  if(p1.length<6){msg('Password must be at least 6 characters.');return;}
  if(p1!==p2){msg('Passwords do not match.');return;}
  if(!accessToken){msg('Reset link is invalid or expired. Request a new one.');return;}
  var btn=document.getElementById('btn');btn.disabled=true;var old=btn.textContent;btn.textContent='Updating\u2026';
  try{
    var r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+accessToken},body:JSON.stringify({password:p1})});
    var d=null;try{d=await r.json();}catch(_){}
    if(!r.ok){
      msg(window.EDAuth?EDAuth.message(d,r.status,'signin'):'Could not reset password. The link may have expired — request a new one.');
      btn.disabled=false;btn.textContent=old;return;
    }
    document.getElementById('content').innerHTML='<h1>Password updated</h1><p class="ld">Your password has been changed and you are signed in on this device.</p><a class="btn" href="/index.html">Continue</a>';
  }catch(e){msg('Could not reach EdgeDesk. Check your connection and try again.');btn.disabled=false;btn.textContent=old;}
}
</script>
</body></html>
